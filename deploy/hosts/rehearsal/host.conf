# The host site: its own pages and robots.txt, and /prompt-seen/ forwarded as in
# deploy/hosts/nginx-proxy.conf (plain HTTP to the stand-in instead of HTTPS to pages.dev).
server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /srv/host;

    location = /prompt-seen {
        return 301 /prompt-seen/;
    }

    location /prompt-seen/ {
        proxy_pass http://pages;
        proxy_http_version 1.1;
        proxy_hide_header X-Robots-Tag;
        proxy_redirect http://pages/ /;
    }
}
