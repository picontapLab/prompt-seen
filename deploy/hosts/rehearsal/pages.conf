# Stand-in for the Pages project: the reference server block plus the noindex header that
# production deploys send on *.pages.dev (scripts/emitters/cloudflare.ts).
server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /srv/dist;
    add_header X-Robots-Tag noindex always;
    include /etc/nginx/prompt-seen/prompt-seen.conf;
}
