# Example: a host site on nginx forwards /prompt-seen/ to the Cloudflare Pages project
# (design doc §15.4.1, way 3; hand-written, not generated). Put these locations in the host's
# server block for the canonical host and replace prompt-seen.pages.dev with the project's
# production address.
#
# What matters:
# - The path is forwarded unchanged: the site is built for /prompt-seen/ and its files live there.
# - X-Robots-Tag is dropped. A production deploy marks every *.pages.dev address noindex (only
#   the canonical host may be indexed, §9.3); passed through, it would de-index the real site.
#   `npm run check:live` fails when the canonical host still sends it.
# - Status codes and headers pass through: 301/308 with Location, 404 and the site's own 404
#   pages, Content-Type, Link (Markdown canonical) and Cache-Control. No error_page here.
# - The host's own robots.txt carries deploy/generated/robots-snippet.txt (§15.4.3).

location = /prompt-seen {
    return 301 /prompt-seen/;
}

location /prompt-seen/ {
    proxy_pass https://prompt-seen.pages.dev;
    proxy_set_header Host prompt-seen.pages.dev;
    proxy_ssl_server_name on;
    proxy_ssl_name prompt-seen.pages.dev;
    proxy_http_version 1.1;

    proxy_hide_header X-Robots-Tag;
    # Pages answers with relative redirects; rewrite any absolute one to this host.
    proxy_redirect https://prompt-seen.pages.dev/ /;
}
