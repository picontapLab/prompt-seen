# Example host server block (hand-written, not generated). Used by the end-to-end tests and as
# the starting point for a host that serves the site with nginx (design doc §15.4).
#
# A host needs three things:
#   1. `root` pointing at a copy of dist/ (for a subpath build it contains prompt-seen/);
#   2. `absolute_redirect off`, or nginx builds Location headers from its own scheme and port,
#      which breaks behind a proxy or TLS terminator (subpath memo §7.4 item 3);
#   3. one `include` of the generated deploy/generated/nginx/prompt-seen.conf.
server {
    listen 80;
    server_name _;

    absolute_redirect off;
    root /srv/dist;

    include /etc/nginx/prompt-seen/prompt-seen.conf;
}
