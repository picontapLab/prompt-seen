  ar: فُحصت تسعة ردود فعل منفصلة للكورجي مع النصوص التسعة المطلوبة بالترتيب الصحيح، بما في ذلك سؤال
    الوجبات الخفيفة ذي السطرين وعلامات الترقيم. تبقى العلامة البيضاء على الوجه والأذنان المنتصبتان
    والمنديل الأخضر متسقة. وضعيات متميّزة للتلويح والانحناء للعب والنظرة الجانبية والاستلقاء على
    الظهر والجري والنوم والموافقة والتوق والعناق. تعمل علامات النوم والقلوب رموزًا للتعبير. لا
    عناوين أو نصوص غير ذات صلة.
