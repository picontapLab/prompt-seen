    Wiedergabeanzahl erhalten. Ursprüngliche Quellprüfung (Frame-Anzahlen
    beschreiben nur die Quelle): Zwölf vollständige Ansichten einer sitzenden
    getigerten Katze verlaufen von vorn um die Rückseite bis fast zurück nach
    vorn. Weiße Brust, Pfoten und getigertes Fell bleiben erkennbar.
    Wiederholtes GIF mit 1440 ms; Winkelabstände und feine Fellzeichnungen
    variieren leicht, da die Ansichten generierte Bilder sind."
  pt-BR: "Todas as sequências de nove quadros foram revisadas em quatro folhas de
    contato: ordem das ações, identidade, legendas e poses finais preservadas.
    Esta saída reutiliza pixels da fonte arquivada do GPT Image; não houve nova
    chamada ao provedor. Nove poses da fonte selecionadas em ordem cronológica.
    Duração total e número de reproduções preservados. Revisão original da fonte
    (as contagens de quadros descrevem apenas a fonte): Doze vistas completas de
    um gato tigrado sentado avançam da frente, passam pelas costas e retornam a
    uma posição quase frontal. O peito branco, as patas e a pelagem tigrada
    permanecem reconhecíveis. GIF em repetição de 1440 ms; os intervalos
    angulares e os detalhes das marcas da pelagem variam um pouco porque as
    vistas são imagens geradas."
