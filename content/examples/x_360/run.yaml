notes:
  en: "Reviewed all nine-frame sequences in four contact sheets: action order, identity, captions and
    final poses retained. This output reuses archived GPT Image source pixels; no new provider call.
    Nine chronological source poses selected. Total duration and playback count preserved. Original
    source review (frame counts describe source only): Twelve complete seated-tabby views progress
    from front around the back and return to near-front. White chest, paws and tabby coat remain
    recognizable. 1440 ms repeating GIF; angle intervals and fine fur markings vary slightly because
    views are generated images."
  zh-Hans: 猫游戏资产转台
  ja: 4枚の一覧画像ですべての9フレームの順序、人物の特徴、字幕、最終姿態を確認しました。保存済みのGPT
    Image素材を再利用し、新たな画像ツール呼び出しは行っていません。元素材から時系列順に9姿態を選びました。総再生時間とループ回数は保持しています。元素材の確認記録（以下のコマ数は元素材のもの）：元の12視点は座ったキジトラの正面から背面を巡り、ほぼ正面へ戻ります。白い胸、足、縞模様を保つ1.44秒ループ。生成画像のため角度間隔や細かい毛並みに変化があります。
  de: "Alle Sequenzen mit neun Frames in vier Kontaktbögen geprüft: Handlungsreihenfolge, Identität,
    Beschriftungen und Endposen erhalten. Diese Ausgabe verwendet archivierte GPT-Image-Quellpixel
    erneut; kein neuer Anbieteraufruf. Neun chronologische Quellposen ausgewählt. Gesamtdauer und
    Wiedergabeanzahl erhalten. Ursprüngliche Quellprüfung (Frame-Anzahlen beschreiben nur die
    Quelle): Zwölf vollständige Ansichten einer sitzenden getigerten Katze verlaufen von vorn um die
    Rückseite bis fast zurück nach vorn. Weiße Brust, Pfoten und getigertes Fell bleiben erkennbar.
    Wiederholtes GIF mit 1440 ms; Winkelabstände und feine Fellzeichnungen variieren leicht, da die
    Ansichten generierte Bilder sind."
  pt-BR: "Todas as sequências de nove quadros foram revisadas em quatro folhas de contato: ordem das
    ações, identidade, legendas e poses finais preservadas. Esta saída reutiliza pixels da fonte
    arquivada do GPT Image; não houve nova chamada ao provedor. Nove poses da fonte selecionadas em
    ordem cronológica. Duração total e número de reproduções preservados. Revisão original da fonte
    (as contagens de quadros descrevem apenas a fonte): Doze vistas completas de um gato tigrado
    sentado avançam da frente, passam pelas costas e retornam a uma posição quase frontal. O peito
    branco, as patas e a pelagem tigrada permanecem reconhecíveis. GIF em repetição de 1440 ms; os
    intervalos angulares e os detalhes das marcas da pelagem variam um pouco porque as vistas são
    imagens geradas."
  es: "Se revisaron todas las secuencias de nueve fotogramas en cuatro hojas de contacto: se
    conservaron el orden de la acción, la identidad, los textos y las poses finales. Este resultado
    reutiliza los píxeles de origen archivados de GPT Image; no hubo nueva llamada al proveedor. Se
    seleccionaron nueve poses de origen cronológicas. Se conservaron la duración total y el número
    de reproducciones. Revisión original de la fuente (los recuentos de fotogramas describen solo la
    fuente): Doce vistas completas de un gato atigrado sentado avanzan desde el frente alrededor de
    la espalda y vuelven casi al frente. El pecho blanco, las patas y el pelaje atigrado siguen
    siendo reconocibles. GIF repetido de 1440 ms; los intervalos de ángulo y las marcas finas del
    pelo varían ligeramente porque las vistas son imágenes generadas."
  ko: "콘택트 시트 네 장에서 아홉 프레임으로 구성된 모든 시퀀스를 검토하여 동작 순서, 대상의 정체성, 문구와 마지막 자세가 유지됨을 확인했습니다. 이 결과는 보관된 GPT
    Image 원본 픽셀을 재사용하며 제공업체를 새로 호출하지 않았습니다. 시간순 원본 자세 아홉 개를 선택했습니다. 전체 길이와 재생 횟수를 유지했습니다. 원본 검토
    기록(프레임 수는 원본에만 해당): 앉아 있는 태비 고양이 전체의 시점 열두 개가 정면에서 등 뒤를 돌아 거의 정면으로 돌아옵니다. 흰 가슴, 발과 줄무늬 털을 알아볼 수
    있습니다. 1440ms 반복 GIF이며, 생성 이미지이므로 각도 간격과 세부 털무늬가 조금씩 달라집니다."
  zh-Hant: 已在四張接觸印樣中核對全部九格序列：動作順序、身分、字幕與最終姿態均保留。本次輸出重用封存的 GPT Image
    來源像素，未再次呼叫供應商。依時間順序選取九個來源姿態，總時長與播放次數保持不變。原始來源審查（以下格數僅描述來源版本）：十二個完整坐姿虎斑貓視角由正面繞過背面，再回到接近正面。白胸、爪子與虎斑毛色仍可辨認。1440ms
    重複播放 GIF；因各視角由生成圖片構成，角度間隔與細部毛紋略有差異。
  fr: "Toutes les séquences de neuf images ont été examinées dans quatre planches-contact : ordre des
    actions, identité, légendes et poses finales conservés. Ce résultat réutilise les pixels sources
    GPT Image archivés ; aucun nouvel appel au fournisseur. Neuf poses sources sélectionnées dans
    l’ordre chronologique. La durée totale et le nombre de lectures sont conservés. Examen de la
    source d’origine (les nombres d’images ne concernent que la source) : Douze vues entières d’un
    chat tigré assis passent de la face au dos et reviennent presque de face. Poitrine blanche,
    pattes et pelage tigré restent reconnaissables. GIF répété de 1440 ms ; intervalles angulaires
    et marques fines du pelage varient légèrement car les vues sont générées."
  it: "Tutte le sequenze di nove fotogrammi sono state esaminate in quattro provini: ordine delle
    azioni, identità, didascalie e pose finali conservati. Questo risultato riusa i pixel GPT Image
    archiviati; nessuna nuova chiamata al fornitore. Selezionate nove pose originali in ordine
    cronologico. Durata totale e numero di riproduzioni conservati. Revisione originale della fonte
    (i conteggi riguardano solo la fonte): dodici viste complete di un gatto tigrato seduto passano
    dal fronte al retro e tornano quasi al fronte. Petto bianco, zampe e mantello tigrato restano
    riconoscibili. GIF ripetuta di 1440 ms; intervalli angolari e striature fini del pelo variano
    leggermente perché le viste sono immagini generate."
  ru: "Все последовательности из девяти кадров проверены на четырёх контактных листах: порядок
    действий, узнаваемость персонажей, подписи и финальные позы сохранены. Результат повторно
    использует пиксели архивного исходника GPT Image; нового обращения к сервису не было. Выбраны
    девять исходных поз в хронологическом порядке. Общая длительность и число воспроизведений
    сохранены. Исходная проверка (число кадров относится только к исходнику): двенадцать полных
    видов сидящего полосатого кота проходят от фронтального вида вокруг спины и возвращаются к почти
    фронтальному. Белая грудка, лапы и полосатая шерсть остаются узнаваемыми. Повторяющийся GIF
    длительностью 1440 мс; угловые интервалы и мелкие отметины шерсти немного различаются, поскольку
    ракурсы сгенерированы."
  ar: "رُوجعت جميع التسلسلات ذات التسعة إطارات في أربع لوحات تجميع: حُفظ ترتيب الحركة والهوية والنصوص
    والوضعيات النهائية. تعيد هذه النتيجة استخدام بكسلات مصدر GPT Image المؤرشفة؛ ومن دون استدعاء
    جديد للمزوّد. اختيرت تسع وضعيات مصدر بترتيب زمني. حُفظت المدة الإجمالية وعدد مرات التشغيل.
    مراجعة المصدر الأصلية (تصف أعداد الإطارات المصدر وحده): تتدرّج اثنتا عشرة صورة كاملة لقط مخطّط
    جالس من الأمام حول الخلف ثم تعود إلى قرب الأمام. يبقى الصدر الأبيض والكفوف والفراء المخطّط قابلة
    للتعرّف. GIF متكرر مدته 1440 ms؛ وتختلف الفواصل الزاوية وعلامات الفراء الدقيقة قليلًا لأن
    المناظر صور مولّدة."
