notes:
  en: "Reviewed all nine-frame sequences in four contact sheets: action order,
    identity, captions and final poses retained. This output reuses archived GPT
    Image source pixels; no new provider call. Nine chronological source poses
    selected. Total duration and playback count preserved. Original source
    review (frame counts describe source only): Twelve complete seated-tabby
    views progress from front around the back and return to near-front. White
    chest, paws and tabby coat remain recognizable. 1440 ms repeating GIF; angle
    intervals and fine fur markings vary slightly because views are generated
    images."
  zh-Hans: 猫游戏资产转台
  ja: 4枚の一覧画像ですべての9フレームの順序、人物の特徴、字幕、最終姿態を確認しました。保存済みのGPT
    Image素材を再利用し、新たな画像ツール呼び出しは行っていません。元素材から時系列順に9姿態を選びました。総再生時間とループ回数は保持しています。元素材の確認記録（以下のコマ数は元素材のもの）：元の12視点は座ったキジトラの正面から背面を巡り、ほぼ正面へ戻ります。白い胸、足、縞模様を保つ1.44秒ループ。生成画像のため角度間隔や細かい毛並みに変化があります。
  de: "Alle Sequenzen mit neun Frames in vier Kontaktbögen geprüft:
    Handlungsreihenfolge, Identität, Beschriftungen und Endposen erhalten. Diese
    Ausgabe verwendet archivierte GPT-Image-Quellpixel erneut; kein neuer
    Anbieteraufruf. Neun chronologische Quellposen ausgewählt. Gesamtdauer und
    Wiedergabeanzahl erhalten. Ursprüngliche Quellprüfung (Frame-Anzahlen
    beschreiben nur die Quelle): Zwölf vollständige Ansichten einer sitzenden
    getigerten Katze verlaufen von vorn um die Rückseite bis fast zurück nach
    vorn. Weiße Brust, Pfoten und getigertes Fell bleiben erkennbar.
    Wiederholtes GIF mit 1440 ms; Winkelabstände und feine Fellzeichnungen
    variieren leicht, da die Ansichten generierte Bilder sind."
  es: "Se revisaron todas las secuencias de nueve fotogramas en cuatro hojas de
    contacto: se conservaron el orden de la acción, la identidad, los textos y
    las poses finales. Este resultado reutiliza los píxeles de origen archivados
    de GPT Image; no hubo nueva llamada al proveedor. Se seleccionaron nueve
    poses de origen cronológicas. Se conservaron la duración total y el número
    de reproducciones. Revisión original de la fuente (los recuentos de
    fotogramas describen solo la fuente): Doce vistas completas de un gato
    atigrado sentado avanzan desde el frente alrededor de la espalda y vuelven
    casi al frente. El pecho blanco, las patas y el pelaje atigrado siguen
    siendo reconocibles. GIF repetido de 1440 ms; los intervalos de ángulo y las
    marcas finas del pelo varían ligeramente porque las vistas son imágenes
    generadas."
