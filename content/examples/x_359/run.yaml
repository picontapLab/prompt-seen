    Wiedergabeanzahl erhalten. Ursprüngliche Quellprüfung (Frame-Anzahlen beschreiben nur die
    Quelle): Zwölf unterscheidbare Vorder-, Seiten- und Rückansichten eines dunklen futuristischen
    Motorrads mit cyanfarbenen Rädern und roten Akzenten. Räder und Karosserie bleiben sichtbar.
    Wiederholte Rundumansicht mit 1440 ms. Kleine generierte Geometrie- und Größenverschiebungen
    sind sichtbar; dies ist eine illustrierte Adaption mit mehreren Ansichten, kein exportiertes
    3D-Asset."
  pt-BR: "Todas as sequências de nove quadros foram revisadas em quatro folhas de contato: ordem da
    ação, identidade, legendas e poses finais preservadas. Esta saída reutiliza os pixels de origem
    arquivados do GPT Image; não houve nova chamada ao provedor. Nove poses de origem selecionadas
    em ordem cronológica. Duração total e número de reproduções preservados. Revisão original da
    fonte (as contagens de quadros descrevem apenas a fonte): Doze vistas distinguíveis de frente,
    de lado e de trás de uma mesma moto futurista escura, com rodas ciano e detalhes vermelhos. As
    rodas e o corpo permanecem visíveis. Rotação repetida de 1440 ms. Pequenos deslocamentos gerados
    de geometria e escala são visíveis; é uma adaptação ilustrada de múltiplas vistas, não um
    recurso 3D exportado."
  es: "Se revisaron todas las secuencias de nueve fotogramas en cuatro hojas de contacto: se
    conservaron el orden de la acción, la identidad, los textos y las poses finales. Este resultado
