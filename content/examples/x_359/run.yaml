  ko: "콘택트 시트 네 장에서 아홉 프레임으로 구성된 모든 시퀀스를 검토하여 동작 순서, 대상의 정체성, 문구와 마지막 자세가 유지됨을 확인했습니다. 이 결과는 보관된 GPT
    Image 원본 픽셀을 재사용하며 제공업체를 새로 호출하지 않았습니다. 시간순 원본 자세 아홉 개를 선택했습니다. 전체 길이와 재생 횟수를 유지했습니다. 원본 검토
    기록(프레임 수는 원본에만 해당): 청록색 바퀴와 빨간 포인트가 있는 어두운 미래형 오토바이 한 대의 정면, 측면과 후면 시점 열두 개가 구별됩니다. 바퀴와 차체가 계속
    보입니다. 1440ms 반복 회전입니다. 생성 과정에서 형태와 크기에 작은 흔들림이 보이며, 내보낸 3D 자산이 아닌 여러 시점의 일러스트 각색입니다."
  zh-Hant: 已在四張接觸印樣中核對全部九格序列：動作順序、身分、字幕與最終姿態均保留。本次輸出重用封存的 GPT Image
