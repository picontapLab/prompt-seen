    cronologico. Durata totale e numero di riproduzioni conservati. Revisione originale della fonte
    (i conteggi riguardano solo la fonte): dodici viste distinguibili frontali, laterali e
    posteriori di una motocicletta futuristica scura con ruote ciano e accenti rossi. Ruote e corpo
    restano visibili. Rotazione ripetuta di 1440 ms. Sono visibili piccoli spostamenti di geometria
    e scala generati; è un adattamento illustrato a più viste, non una risorsa 3D esportata."
  ru: "Все последовательности из девяти кадров проверены на четырёх контактных листах: порядок
    действий, узнаваемость персонажей, подписи и финальные позы сохранены. Результат повторно
    использует пиксели архивного исходника GPT Image; нового обращения к сервису не было. Выбраны
    девять исходных поз в хронологическом порядке. Общая длительность и число воспроизведений
    сохранены. Исходная проверка (число кадров относится только к исходнику): двенадцать различимых
    видов спереди, сбоку и сзади одного тёмного футуристического мотоцикла с голубыми колёсами и
    красными акцентами. Колёса и корпус остаются видимыми. Повторяющийся круговой обзор
    длительностью 1440 мс. Заметны небольшие сгенерированные изменения геометрии и масштаба; это
    рисованная многоракурсная адаптация, а не экспортированный 3D-объект."
  ar: "رُوجعت جميع التسلسلات ذات التسعة إطارات في أربع لوحات تجميع: حُفظ ترتيب الحركة والهوية والنصوص
    والوضعيات النهائية. تعيد هذه النتيجة استخدام بكسلات مصدر GPT Image المؤرشفة؛ ومن دون استدعاء
    جديد للمزوّد. اختيرت تسع وضعيات مصدر بترتيب زمني. حُفظت المدة الإجمالية وعدد مرات التشغيل.
    مراجعة المصدر الأصلية (تصف أعداد الإطارات المصدر وحده): اثنا عشر منظورًا أماميًا وجانبيًا
    وخلفيًا متميّزًا لدراجة نارية مستقبلية داكنة واحدة بعجلات سماوية ولمسات حمراء. تبقى العجلات
    والجسم ظاهرة. دوران متكرر مدته 1440 ms. تظهر انزياحات مولّدة صغيرة في الهندسة والمقياس؛ وهذا
    اقتباس رسومي متعدد المناظر، وليس أصلًا ثلاثي الأبعاد مصدّرًا."
