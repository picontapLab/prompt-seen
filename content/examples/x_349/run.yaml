  zh-Hans: 四格温暖插画展示戴绿三角巾的柯基占据沙发，再迎接主人回家的故事。
  ja: 温かい絵本風の4コマが、閉まりかけのドアの前、ソファを見る姿、クッションを占領する姿、開いたドアで無邪気に出迎える姿の順に並んでいます。コーギーの顔の白い模様、耳、緑のバンダナは一貫し、同じ居間にソファ、本棚、ランプ、ラグ、壁の絵が繰り返し登場します。4つの指定キャプションは各1回、正しい句読点で大きく表示されています。
  de: "Vier warme Bilderbuchbilder in korrekter Reihenfolge: Hund an der sich schließenden Tür, Blick
    aufs Sofa, Belegen der Kissen, unschuldige Begrüßung an der offenen Tür. Konsistente weiße
