    Teppich und Wandbild im Wohnzimmer. Alle vier gewünschten Beschriftungen erscheinen exakt einmal
    mit korrekter Zeichensetzung und großen lesbaren Buchstaben."
  pt-BR: "Quatro quadros acolhedores em estilo de livro de histórias na ordem correta: cão junto à
