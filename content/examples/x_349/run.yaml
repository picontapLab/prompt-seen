    luminária, tapete e quadro na parede recorrentes na sala. As quatro legendas solicitadas
    aparecem exatamente uma vez, com pontuação correta e letras grandes e legíveis."
  es: "Cuatro viñetas cálidas de cuento en el orden correcto: perro junto a la puerta que se cierra,
    mirando al sofá, ocupando los cojines y saludando inocentemente ante la puerta abierta. Franja
    facial, orejas y pañuelo verde del corgi coherentes, con sofá, estantería, lámpara, alfombra y
    cuadro recurrentes en la sala de estar. Los cuatro textos solicitados aparecen exactamente una
    vez con puntuación correcta y letras grandes y legibles."
  ko: 따뜻한 동화책풍 네 칸이 올바른 순서로 배치됩니다. 닫히는 문 옆의 개, 소파 바라보기, 쿠션 차지하기, 열린 문 앞의 천진난만한 인사입니다. 코기의 얼굴 흰 무늬, 귀와
    초록 반다나가 일관되며 거실의 소파, 책장, 조명, 러그와 벽 그림이 반복됩니다. 요청한 네 문구가 정확한 문장부호와 크고 읽기 쉬운 글자로 한 번씩 나옵니다.
  zh-Hant: 四格溫暖繪本場景順序正確：狗在即將關閉的門邊、看向沙發、占據靠墊、在打開的門邊無辜迎接。柯基臉部白斑、耳朵與綠領巾一致，客廳反覆呈現同一沙發、書櫃、燈、地毯與掛畫。四句指定字幕各出現一次，標點正確，文字大且易讀。
  fr: "Quatre cases chaleureuses de livre illustré dans le bon ordre : chien près de la porte qui se
    ferme, regard vers le canapé, installation sur les coussins et accueil innocent devant la porte
    ouverte. Liste blanche du visage, oreilles et bandana vert du corgi cohérents, avec le canapé,
    la bibliothèque, la lampe, le tapis et le tableau récurrents dans le salon. Les quatre légendes
    demandées apparaissent exactement une fois, avec la bonne ponctuation et de grandes lettres
    lisibles."
  it: "Quattro riquadri caldi da libro illustrato nell’ordine corretto: cane presso la porta che si
    chiude, sguardo al divano, occupazione dei cuscini, saluto innocente alla porta aperta. Striscia
    facciale del corgi, orecchie e bandana verde coerenti, con divano, libreria, lampada, tappeto e
    quadro ricorrenti nel soggiorno. Tutte e quattro le didascalie richieste compaiono esattamente
    una volta con punteggiatura corretta e lettere grandi leggibili."
  ru: "Четыре тёплых кадра в стиле книжной иллюстрации в правильном порядке: собака у закрывающейся
    двери, взгляд на диван, собака на подушках, невинное приветствие у открытой двери. Проточина на
    морде корги, уши и зелёная бандана единообразны; в гостиной повторяются диван, книжный шкаф,
    лампа, ковёр и картина на стене. Все четыре запрошенные подписи появляются ровно по одному разу
    с правильной пунктуацией и крупными читаемыми буквами."
  ar: "أربع لوحات قصصية دافئة بالترتيب الصحيح: الكلب قرب باب يغلق، وينظر إلى الأريكة، ويستولي على
    الوسائد، ثم يرحّب ببراءة عند الباب المفتوح. تتسق علامة وجه الكورجي وأذناه ومنديله الأخضر، مع
    تكرار الأريكة ورفّ الكتب والمصباح والسجادة والصورة الجدارية في غرفة المعيشة. تظهر النصوص الأربعة
    المطلوبة مرة واحدة لكل منها، بترقيم صحيح وحروف كبيرة مقروءة."
