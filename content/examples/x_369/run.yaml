notes:
  en: "Reviewed all nine-frame sequences in four contact sheets: action order,
    identity, captions and final poses retained. This output reuses archived GPT
    Image source pixels; no new provider call. Nine chronological source poses
    selected. Total duration and playback count preserved. Original source
    review (frame counts describe source only): Twelve pixel-style poses show
    draw, windup, water sweep and recovery. Uses an original swordsman rather
    than Tanjiro. Wave approaches cell edges, with minor shape drift and a
    visible final-to-first stance change; not a perfectly seamless game sprite."
  zh-Hans: 原创剑士像素水斩
  ja: 4枚の一覧画像ですべての9フレームの順序、人物の特徴、字幕、最終姿態を確認しました。保存済みのGPT
    Image素材を再利用し、新たな画像ツール呼び出しは行っていません。元素材から時系列順に9姿態を選びました。総再生時間とループ回数は保持しています。元素材の確認記録（以下のコマ数は元素材のもの）：元の12姿態は抜刀、振りかぶり、水の横斬り、構えへの復帰を描きます。炭治郎ではなくオリジナルの剣士です。水の波はコマの端に近く、形に小さなずれがあり、末尾から先頭で構えが変わります。完全にシームレスなゲーム素材ではありません。
  de: "Alle Sequenzen mit neun Frames in vier Kontaktbögen geprüft:
    Handlungsreihenfolge, Identität, Beschriftungen und Endposen erhalten. Diese
    Ausgabe verwendet archivierte GPT-Image-Quellpixel erneut; kein neuer
    Anbieteraufruf. Neun chronologische Quellposen ausgewählt. Gesamtdauer und
    Wiedergabeanzahl erhalten. Ursprüngliche Quellprüfung (Frame-Anzahlen
    beschreiben nur die Quelle): Zwölf Posen im Pixelstil zeigen Ziehen des
    Schwerts, Ausholen, Wasserschwung und Rückkehr. Verwendet einen eigenen
    Schwertkämpfer statt Tanjiro. Die Welle nähert sich den Zellrändern, mit
    leichten Formverschiebungen und einem sichtbaren Haltungswechsel vom letzten
    zum ersten Frame; kein perfekt nahtloses Spiel-Sprite."
  pt-BR: "Todas as sequências de nove quadros foram revisadas em quatro folhas de
    contato: ordem das ações, identidade, legendas e poses finais preservadas.
    Esta saída reutiliza pixels da fonte arquivada do GPT Image; não houve nova
    chamada ao provedor. Nove poses da fonte selecionadas em ordem cronológica.
    Duração total e número de reproduções preservados. Revisão original da fonte
    (as contagens de quadros descrevem apenas a fonte): Doze poses em pixel art
    mostram sacar a espada, preparar o movimento, varrer com água e retornar à
    posição inicial. Usa um espadachim original em vez de Tanjiro. A onda se
    aproxima das bordas das células, com pequenos desvios de forma e uma mudança
    visível de postura entre o último e o primeiro quadro; não é um sprite de
    jogo perfeitamente contínuo."
  es: "Se revisaron todas las secuencias de nueve fotogramas en cuatro hojas de
    contacto: se conservaron el orden de la acción, la identidad, los textos y
    las poses finales. Este resultado reutiliza los píxeles de origen archivados
    de GPT Image; no hubo nueva llamada al proveedor. Se seleccionaron nueve
    poses de origen cronológicas. Se conservaron la duración total y el número
    de reproducciones. Revisión original de la fuente (los recuentos de
    fotogramas describen solo la fuente): Doce poses de estilo pixelado muestran
    desenvainar, preparar, barrido acuático y recuperación. Usa un espadachín
    original en lugar de Tanjiro. La ola se acerca a los bordes de las celdas,
    con pequeños cambios de forma y un cambio visible de postura entre final e
    inicio; no es un sprite de juego perfectamente continuo."
