notes:
  en: "Reviewed all nine-frame sequences in four contact sheets: action order, identity, captions and
    final poses retained. This output reuses archived GPT Image source pixels; no new provider call.
    Nine chronological source poses selected. Total duration and playback count preserved. Original
    source review (frame counts describe source only): Twelve pixel-style poses show draw, windup,
    water sweep and recovery. Uses an original swordsman rather than Tanjiro. Wave approaches cell
    edges, with minor shape drift and a visible final-to-first stance change; not a perfectly
    seamless game sprite."
  zh-Hans: 原创剑士像素水斩
  ja: 4枚の一覧画像ですべての9フレームの順序、人物の特徴、字幕、最終姿態を確認しました。保存済みのGPT
    Image素材を再利用し、新たな画像ツール呼び出しは行っていません。元素材から時系列順に9姿態を選びました。総再生時間とループ回数は保持しています。元素材の確認記録（以下のコマ数は元素材のもの）：元の12姿態は抜刀、振りかぶり、水の横斬り、構えへの復帰を描きます。炭治郎ではなくオリジナルの剣士です。水の波はコマの端に近く、形に小さなずれがあり、末尾から先頭で構えが変わります。完全にシームレスなゲーム素材ではありません。
  de: "Alle Sequenzen mit neun Frames in vier Kontaktbögen geprüft: Handlungsreihenfolge, Identität,
    Beschriftungen und Endposen erhalten. Diese Ausgabe verwendet archivierte GPT-Image-Quellpixel
    erneut; kein neuer Anbieteraufruf. Neun chronologische Quellposen ausgewählt. Gesamtdauer und
    Wiedergabeanzahl erhalten. Ursprüngliche Quellprüfung (Frame-Anzahlen beschreiben nur die
    Quelle): Zwölf Posen im Pixelstil zeigen Ziehen des Schwerts, Ausholen, Wasserschwung und
    Rückkehr. Verwendet einen eigenen Schwertkämpfer statt Tanjiro. Die Welle nähert sich den
    Zellrändern, mit leichten Formverschiebungen und einem sichtbaren Haltungswechsel vom letzten
    zum ersten Frame; kein perfekt nahtloses Spiel-Sprite."
  pt-BR: "Todas as sequências de nove quadros foram revisadas em quatro folhas de contato: ordem das
    ações, identidade, legendas e poses finais preservadas. Esta saída reutiliza pixels da fonte
    arquivada do GPT Image; não houve nova chamada ao provedor. Nove poses da fonte selecionadas em
    ordem cronológica. Duração total e número de reproduções preservados. Revisão original da fonte
    (as contagens de quadros descrevem apenas a fonte): Doze poses em pixel art mostram sacar a
    espada, preparar o movimento, varrer com água e retornar à posição inicial. Usa um espadachim
    original em vez de Tanjiro. A onda se aproxima das bordas das células, com pequenos desvios de
    forma e uma mudança visível de postura entre o último e o primeiro quadro; não é um sprite de
    jogo perfeitamente contínuo."
  es: "Se revisaron todas las secuencias de nueve fotogramas en cuatro hojas de contacto: se
    conservaron el orden de la acción, la identidad, los textos y las poses finales. Este resultado
    reutiliza los píxeles de origen archivados de GPT Image; no hubo nueva llamada al proveedor. Se
    seleccionaron nueve poses de origen cronológicas. Se conservaron la duración total y el número
    de reproducciones. Revisión original de la fuente (los recuentos de fotogramas describen solo la
    fuente): Doce poses de estilo pixelado muestran desenvainar, preparar, barrido acuático y
    recuperación. Usa un espadachín original en lugar de Tanjiro. La ola se acerca a los bordes de
    las celdas, con pequeños cambios de forma y un cambio visible de postura entre final e inicio;
    no es un sprite de juego perfectamente continuo."
  ko: "콘택트 시트 네 장에서 아홉 프레임으로 구성된 모든 시퀀스를 검토하여 동작 순서, 대상의 정체성, 문구와 마지막 자세가 유지됨을 확인했습니다. 이 결과는 보관된 GPT
    Image 원본 픽셀을 재사용하며 제공업체를 새로 호출하지 않았습니다. 시간순 원본 자세 아홉 개를 선택했습니다. 전체 길이와 재생 횟수를 유지했습니다. 원본 검토
    기록(프레임 수는 원본에만 해당): 픽셀 스타일 자세 열두 개에 발도, 준비 동작, 물결 베기와 회복이 나타납니다. Tanjiro 대신 독창적인 검사를 사용합니다. 물결이
    칸 가장자리에 가까워지고 형태가 조금 흔들리며 마지막에서 첫 자세로 전환되는 것이 보입니다. 완벽하게 매끄럽게 반복되는 게임 스프라이트는 아닙니다."
  zh-Hant: 已在四張接觸印樣中核對全部九格序列：動作順序、身分、字幕與最終姿態均保留。本次輸出重用封存的 GPT Image
    來源像素，未再次呼叫供應商。依時間順序選取九個來源姿態，總時長與播放次數保持不變。原始來源審查（以下格數僅描述來源版本）：十二個像素風格姿態呈現拔劍、蓄力、水流橫掃與恢復。使用原創劍士，而非炭治郎。波浪接近格子邊緣，形狀略有漂移，末格至首格有可見姿態變化；不是完全無縫的遊戲精靈圖。
  fr: "Toutes les séquences de neuf images ont été examinées dans quatre planches-contact : ordre des
    actions, identité, légendes et poses finales conservés. Ce résultat réutilise les pixels sources
    GPT Image archivés ; aucun nouvel appel au fournisseur. Neuf poses sources sélectionnées dans
    l’ordre chronologique. La durée totale et le nombre de lectures sont conservés. Examen de la
    source d’origine (les nombres d’images ne concernent que la source) : Douze poses en style pixel
    montrent dégainé, préparation, balayage d’eau et récupération. Utilise un épéiste original
    plutôt que Tanjiro. La vague s’approche des bords de cellule, avec une légère dérive de forme et
    un changement visible de posture entre la dernière et la première image ; ce n’est pas un sprite
    de jeu parfaitement raccordé."
  it: "Tutte le sequenze di nove fotogrammi sono state esaminate in quattro provini: ordine delle
    azioni, identità, didascalie e pose finali conservati. Questo risultato riusa i pixel GPT Image
    archiviati; nessuna nuova chiamata al fornitore. Selezionate nove pose originali in ordine
    cronologico. Durata totale e numero di riproduzioni conservati. Revisione originale della fonte
    (i conteggi riguardano solo la fonte): dodici pose in stile pixel mostrano estrazione,
    preparazione, fendente d’acqua e recupero. Usa uno spadaccino originale anziché Tanjiro. L’onda
    si avvicina ai bordi delle celle, con piccoli cambiamenti di forma e un passaggio visibile dalla
    posa finale alla prima; non è uno sprite di gioco perfettamente continuo."
  ru: "Все последовательности из девяти кадров проверены на четырёх контактных листах: порядок
    действий, узнаваемость персонажей, подписи и финальные позы сохранены. Результат повторно
    использует пиксели архивного исходника GPT Image; нового обращения к сервису не было. Выбраны
    девять исходных поз в хронологическом порядке. Общая длительность и число воспроизведений
    сохранены. Исходная проверка (число кадров относится только к исходнику): Двенадцать поз в
    пиксельном стиле показывают обнажение меча, замах, водяной взмах и возвращение в исходное
    положение. Использован оригинальный мечник, а не Тандзиро. Волна приближается к краям ячеек;
    есть небольшие изменения формы и заметная смена стойки между последним и первым кадром. Это не
    идеально бесшовный игровой спрайт."
