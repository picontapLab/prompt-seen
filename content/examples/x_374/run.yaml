notes:
  en: "Reviewed all nine-frame sequences in four contact sheets: action order, identity, captions and
    final poses retained. This output reuses archived GPT Image source pixels; no new provider call.
    One held pose is split into two frames; eight distinct source poses, nine encoded frames. Total
    duration and playback count preserved. Original source review (frame counts describe source
    only): Eight recognizable pixel-art Johnny Bravo poses show alternating steps, arm pumps, hip
    shifts and crouch bounce. Entire character visible; no text. Actual 800 ms loop, silent. Sprite
    shapes have small redraw variation; no claim of source audio."
  zh-Hans: Johnny Bravo 八位风格舞蹈
  ja: 4枚の一覧画像ですべての9フレームの順序、人物の特徴、字幕、最終姿態を確認しました。保存済みのGPT
    Image素材を再利用し、新たな画像ツール呼び出しは行っていません。一つの姿態の停留を2フレームに分けています。異なる元姿態は8種類、符号化フレームは9枚です。総再生時間とループ回数は保持しています。元素材の確認記録（以下のコマ数は元素材のもの）：元の8姿態はピクセル風のJohnny
    Bravoが交互に踏み、腕を振り、腰を動かし、しゃがんで弾む動きです。全身が入り、文字はありません。無音の0.8秒ループ。形に小さな再描画差があり、元投稿の音楽は含みません。
  de: "Alle Sequenzen mit neun Frames in vier Kontaktbögen geprüft: Handlungsreihenfolge, Identität,
    Beschriftungen und Endposen erhalten. Diese Ausgabe verwendet archivierte GPT-Image-Quellpixel
    erneut; kein neuer Anbieteraufruf. Eine gehaltene Pose ist in zwei Frames aufgeteilt; acht
    unterschiedliche Quellposen, neun codierte Frames. Gesamtdauer und Wiedergabeanzahl erhalten.
    Ursprüngliche Quellprüfung (Frame-Anzahlen beschreiben nur die Quelle): Acht erkennbare
    Johnny-Bravo-Posen in Pixel-Art zeigen abwechselnde Schritte, pumpende Arme, Hüftbewegungen und
    Wippen in der Hocke. Gesamte Figur sichtbar; kein Text. Tatsächliche 800-ms-Schleife, stumm.
    Sprite-Formen haben kleine Neuzeichnungsabweichungen; Es wird nicht behauptet, dass der
    Originalton enthalten ist."
  pt-BR: "Todas as sequências de nove quadros foram revisadas em quatro folhas de contato: ordem das
    ações, identidade, legendas e poses finais preservadas. Esta saída reutiliza pixels da fonte
    arquivada do GPT Image; não houve nova chamada ao provedor. Uma pose mantida é dividida em dois
    quadros; oito poses distintas da fonte e nove quadros codificados. Duração total e número de
    reproduções preservados. Revisão original da fonte (as contagens de quadros descrevem apenas a
    fonte): Oito poses reconhecíveis de Johnny Bravo em pixel art mostram passos alternados,
    movimentos dos braços, deslocamentos dos quadris e pulos agachados. O personagem inteiro fica
    visível; não há texto. Loop real de 800 ms, sem áudio. As formas dos sprites têm pequenas
    variações de redesenho; não se afirma a presença do áudio da fonte."
  es: "Se revisaron todas las secuencias de nueve fotogramas en cuatro hojas de contacto: se
    conservaron el orden de la acción, la identidad, los textos y las poses finales. Este resultado
    reutiliza los píxeles de origen archivados de GPT Image; no hubo nueva llamada al proveedor. Una
    pose mantenida se divide en dos fotogramas; ocho poses de origen distintas, nueve fotogramas
    codificados. Se conservaron la duración total y el número de reproducciones. Revisión original
    de la fuente (los recuentos de fotogramas describen solo la fuente): Ocho poses reconocibles de
    Johnny Bravo en arte pixelado muestran pasos alternados, movimientos de brazos, desplazamientos
    de cadera y rebote en cuclillas. Personaje entero visible; sin texto. Bucle real de 800 ms,
    silencioso. Las formas del sprite presentan pequeñas variaciones de redibujo; no se afirma que
    incluya el audio de origen."
  ko: "콘택트 시트 네 장에서 아홉 프레임으로 구성된 모든 시퀀스를 검토하여 동작 순서, 대상의 정체성, 문구와 마지막 자세가 유지됨을 확인했습니다. 이 결과는 보관된 GPT
    Image 원본 픽셀을 재사용하며 제공업체를 새로 호출하지 않았습니다. 유지되는 자세 하나를 두 프레임으로 나누어 서로 다른 원본 자세는 여덟 개, 인코딩된 프레임은 아홉
    개입니다. 전체 길이와 재생 횟수를 유지했습니다. 원본 검토 기록(프레임 수는 원본에만 해당): 알아볼 수 있는 픽셀 아트 Johnny Bravo 자세 여덟 개에 번갈아
    걷기, 팔 흔들기, 골반 이동과 웅크렸다 튀어 오르기가 나타납니다. 캐릭터 전체가 보이며 글자는 없습니다. 실제 800ms 무음 반복입니다. 스프라이트 형태에 다시 그리며
    생긴 작은 차이가 있으며 원본 오디오가 있다고 주장하지 않습니다."
  zh-Hant: 已在四張接觸印樣中核對全部九格序列：動作順序、身分、字幕與最終姿態均保留。本次輸出重用封存的 GPT Image
    來源像素，未再次呼叫供應商。一個停留姿態拆成兩個編碼格，八個不同來源姿態形成九個編碼格；總時長與播放次數保持不變。原始來源審查（以下格數僅描述來源版本）：八個可辨認的像素風格 Johnny
    Bravo 姿態呈現交替踏步、擺臂、扭臀與蹲跳。全身可見，沒有文字。實際為 800ms 無聲循環。精靈圖形略有重繪差異，不宣稱保留來源音訊。
  fr: "Toutes les séquences de neuf images ont été examinées dans quatre planches-contact : ordre des
    actions, identité, légendes et poses finales conservés. Ce résultat réutilise les pixels sources
    GPT Image archivés ; aucun nouvel appel au fournisseur. Une pose maintenue est répartie sur deux
    images : huit poses sources distinctes, neuf images encodées. La durée totale et le nombre de
    lectures sont conservés. Examen de la source d’origine (les nombres d’images ne concernent que
    la source) : Huit poses reconnaissables de Johnny Bravo en pixel art montrent pas alternés,
    mouvements des bras, déhanchements et rebond accroupi. Personnage entier visible ; aucun texte.
    Boucle réelle de 800 ms, silencieuse. Les formes du sprite présentent de légères variations de
    redessin ; aucun son source revendiqué."
  it: "Tutte le sequenze di nove fotogrammi sono state esaminate in quattro provini: ordine delle
    azioni, identità, didascalie e pose finali conservati. Questo risultato riusa i pixel GPT Image
    archiviati; nessuna nuova chiamata al fornitore. Una posa mantenuta è divisa in due fotogrammi;
    otto pose originali distinte, nove fotogrammi codificati. Durata totale e numero di riproduzioni
    conservati. Revisione originale della fonte (i conteggi riguardano solo la fonte): otto pose
    riconoscibili di Johnny Bravo in pixel art mostrano passi alternati, braccia oscillanti,
    movimenti dei fianchi e rimbalzo accovacciato. Personaggio interamente visibile; nessun testo.
    Ciclo effettivo di 800 ms, silenzioso. Le forme dello sprite presentano piccole variazioni di
    disegno; non si afferma la presenza dell’audio originale."
  ru: "Все последовательности из девяти кадров проверены на четырёх контактных листах: порядок
    действий, узнаваемость персонажей, подписи и финальные позы сохранены. Результат повторно
    использует пиксели архивного исходника GPT Image; нового обращения к сервису не было. Одна
    удерживаемая поза разделена на два кадра: восемь разных исходных поз, девять закодированных
    кадров. Общая длительность и число воспроизведений сохранены. Исходная проверка (число кадров
    относится только к исходнику): Восемь узнаваемых пиксельных поз Джонни Браво показывают
    чередующиеся шаги, взмахи руками, движения бёдрами и пружинящие приседания. Персонаж виден
    целиком; текста нет. Фактический цикл — 800 мс, без звука. Формы спрайта немного различаются при
    перерисовке; наличие исходного аудио не заявляется."
  ar: "رُوجعت جميع التسلسلات ذات التسعة إطارات في أربع لوحات تجميع: حُفظ ترتيب الحركة والهوية والنصوص
    والوضعيات النهائية. تعيد هذه النتيجة استخدام بكسلات مصدر GPT Image المؤرشفة؛ ومن دون استدعاء
    جديد للمزوّد. تُقسَّم وضعية ثابتة واحدة على إطارين؛ ثماني وضعيات مصدر متميّزة وتسعة إطارات
    مرمّزة. حُفظت المدة الإجمالية وعدد مرات التشغيل. مراجعة المصدر الأصلية (تصف أعداد الإطارات
    المصدر وحده): تُظهر ثماني وضعيات يمكن التعرّف إليها لجوني برافو بفن البكسل خطوات متناوبة وحركات
    دفع بالذراعين وإزاحة الوركين ووثبة من الانحناء. تظهر الشخصية كاملة؛ ومن دون نص. حلقة فعلية صامتة
    مدتها 800 ms. توجد فروق صغيرة في إعادة رسم الأشكال؛ ومن دون ادعاء بوجود صوت المصدر."
