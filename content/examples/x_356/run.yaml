  ko: "콘택트 시트 네 장에서 아홉 프레임으로 구성된 모든 시퀀스를 검토하여 동작 순서, 대상의 정체성, 문구와 마지막 자세가 유지됨을 확인했습니다. 이 결과는 보관된 GPT
    Image 원본 픽셀을 재사용하며 제공업체를 새로 호출하지 않았습니다. 시간순 원본 자세 아홉 개를 선택했습니다. 새로운 디테일을 만들지 않고 표시를 위해 원본 칸을
    확대했습니다. 전체 길이와 재생 횟수를 유지했습니다. 원본 검토 기록(프레임 수는 원본에만 해당): 시간순 몽타주 키프레임 열여섯 개가 성인 참조 인물의 의상, 여름 정원,
    튜브, 물총, 발로 물 차기, 회전과 마지막 물 튀기기를 유지합니다. 실제 결과는 초당 1.6개 키프레임의 무음 10초 GIF로 한 번 재생합니다. 중앙을 9:16으로 자른
    각 칸은 171×304에 불과합니다. 작은 스토리보드 각색으로 보여 주어야 하며 30fps 영상, 음악, 부드러운 카메라 움직임이나 원본 요구 사항 전체를 구현했다고 해서는
    안 됩니다."
  zh-Hant: 已在四張接觸印樣中核對全部九格序列：動作順序、身分、字幕與最終姿態均保留。本次輸出重用封存的 GPT Image
