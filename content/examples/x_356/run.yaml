  ru: "Все последовательности из девяти кадров проверены на четырёх контактных листах: порядок
    действий, узнаваемость персонажей, подписи и финальные позы сохранены. Результат повторно
    использует пиксели архивного исходника GPT Image; нового обращения к сервису не было. Выбраны
    девять исходных поз в хронологическом порядке. Исходные ячейки увеличены для показа без
    добавления новых деталей. Общая длительность и число воспроизведений сохранены. Исходная
    проверка (число кадров относится только к исходнику): шестнадцать монтажных ключевых кадров в
    хронологическом порядке сохраняют одежду взрослого с референса и летний сад, плавательный круг,
    водяной пистолет, удары ногами по воде, повороты и финальный всплеск. Фактически это беззвучный
    GIF длительностью 10 секунд с частотой 1,6 ключевого кадра в секунду и однократным
    воспроизведением. Ячейки с центральным кадрированием 9:16 имеют размер всего 171×304;
    показывайте результат как небольшую адаптацию в виде раскадровки и никогда не заявляйте о видео
    30 кадров/с, музыке, плавном движении камеры или полном соответствии исходной спецификации."
  ar: "رُوجعت جميع التسلسلات ذات التسعة إطارات في أربع لوحات تجميع: حُفظ ترتيب الحركة والهوية والنصوص
