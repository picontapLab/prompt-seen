  zh-Hans: 夏日花园喷水分镜
  ja: 4枚の一覧画像ですべての9フレームの順序、人物の特徴、字幕、最終姿態を確認しました。保存済みのGPT
    Image素材を再利用し、新たな画像ツール呼び出しは行っていません。元素材から時系列順に9姿態を選びました。元の小さな画像を表示用に拡大していますが、細部は増えていません。総再生時間とループ回数は保持しています。元素材の確認記録（以下のコマ数は元素材のもの）：元の16キーフレームは成人の参照人物の服装と夏の庭を保ち、浮き輪、水鉄砲、水蹴り、振り向き、最後の水しぶきを描いています。元は10秒、毎秒1.6キーフレームの無音GIFで1回再生。9:16の中央切り抜き素材は171×304pxです。小さな分鏡のアレンジであり、30fps動画、音楽、滑らかなカメラ移動、原文の全条件は満たしません。
  de: "Alle Sequenzen mit neun Frames in vier Kontaktbögen geprüft: Handlungsreihenfolge, Identität,
