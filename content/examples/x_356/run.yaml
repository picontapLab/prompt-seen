    neue Details für die Anzeige vergrößert. Gesamtdauer und Wiedergabeanzahl erhalten.
    Ursprüngliche Quellprüfung (Frame-Anzahlen beschreiben nur die Quelle): Sechzehn chronologische
    Montage-Schlüsselbilder bewahren das Outfit der erwachsenen Referenzperson und Sommergarten,
    Schwimmring, Wasserpistole, Tritte ins Wasser, Drehungen und abschließenden Spritzer.
    Tatsächliches stummes 10-Sekunden-GIF mit 1,6 Schlüsselbildern pro Sekunde, einmalige
    Wiedergabe. Mittig auf 9:16 zugeschnittene Zellen sind nur 171x304 groß; als kleine
    Storyboard-Adaption zeigen und niemals 30-fps-Video, Musik, flüssige Kamerabewegung oder
    vollständige Erfüllung der Originalvorgaben behaupten."
  pt-BR: "Todas as sequências de nove quadros foram revisadas em quatro folhas de contato: ordem das
