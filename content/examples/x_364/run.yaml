notes:
  en: "Reviewed all nine-frame sequences in four contact sheets: action order,
    identity, captions and final poses retained. This output reuses archived GPT
    Image source pixels; no new provider call. Nine chronological source poses
    selected. Total duration and playback count preserved. Original source
    review (frame counts describe source only): Nine actual transparent GIF
    frames show front paws clapping while half-closed deadpan eyes remain
    stable. All labels correctly read 好棒棒 and float above the ears without
    supports. Inspected encoded GIF against light and dark backgrounds: real
    alpha and no white outline. Slight face redraw variation remains;
    100-percent pixel locking is not claimed."
  zh-Hans: 藏狐鼓掌：好棒棒
  ja: 4枚の一覧画像ですべての9フレームの順序、人物の特徴、字幕、最終姿態を確認しました。保存済みのGPT
    Image素材を再利用し、新たな画像ツール呼び出しは行っていません。元素材から時系列順に9姿態を選びました。総再生時間とループ回数は保持しています。元素材の確認記録（以下のコマ数は元素材のもの）：9コマの透明GIFで前足が拍手し、半閉じの無表情な目を保っています。耳の上に支柱なしで浮く札はすべて「好棒棒」。元の符号化GIFは明暗両背景で確認済みで、実際の透明度があり白い縁はありません。顔にわずかな再描画差があり、完全な画素固定ではありません。
  de: "Alle Sequenzen mit neun Frames in vier Kontaktbögen geprüft:
    Handlungsreihenfolge, Identität, Beschriftungen und Endposen erhalten. Diese
    Ausgabe verwendet archivierte GPT-Image-Quellpixel erneut; kein neuer
    Anbieteraufruf. Neun chronologische Quellposen ausgewählt. Gesamtdauer und
    Wiedergabeanzahl erhalten. Ursprüngliche Quellprüfung (Frame-Anzahlen
    beschreiben nur die Quelle): Neun tatsächliche transparente GIF-Frames
    zeigen klatschende Vorderpfoten bei stabilen halb geschlossenen,
    regungslosen Augen. Alle Beschriftungen lauten korrekt 好棒棒 und schweben ohne
    Stützen über den Ohren. Codiertes GIF vor hellen und dunklen Hintergründen
    geprüft: echter Alphakanal und keine weiße Kontur. Leichte Abweichungen des
    neu gezeichneten Gesichts bleiben; keine Behauptung hundertprozentiger
    Pixelfixierung."
  pt-BR: "Todas as sequências de nove quadros foram revisadas em quatro folhas de
    contato: ordem das ações, identidade, legendas e poses finais preservadas.
    Este resultado reutiliza pixels de fontes arquivadas do GPT Image; não houve
    nova chamada ao provedor. Nove poses cronológicas da fonte selecionadas.
    Duração total e número de reproduções preservados. Revisão original da fonte
    (as contagens de quadros descrevem apenas a fonte): Nove quadros reais de
    GIF transparente mostram as patas dianteiras batendo palmas enquanto os
    olhos semicerrados e impassíveis permanecem estáveis. Todos os rótulos dizem
    corretamente 好棒棒 e flutuam acima das orelhas sem suportes. O GIF codificado
    foi examinado sobre fundos claros e escuros: transparência alfa real e
    ausência de contorno branco. Persiste pequena variação no redesenho do
    rosto; não se alega fixação de 100% dos pixels."
  es: "Se revisaron todas las secuencias de nueve fotogramas en cuatro hojas de
    contacto: se conservaron el orden de la acción, la identidad, los textos y
    las poses finales. Este resultado reutiliza los píxeles de origen archivados
    de GPT Image; no hubo nueva llamada al proveedor. Se seleccionaron nueve
    poses de origen cronológicas. Se conservaron la duración total y el número
    de reproducciones. Revisión original de la fuente (los recuentos de
    fotogramas describen solo la fuente): Nueve fotogramas reales de GIF
    transparente muestran las patas delanteras aplaudiendo mientras los ojos
    semicerrados e impasibles permanecen estables. Todos los textos dicen
    correctamente 好棒棒 y flotan sobre las orejas sin soportes. Se inspeccionó el
    GIF codificado sobre fondos claros y oscuros: alfa real y sin contorno
    blanco. Persiste una ligera variación del rostro redibujado; no se afirma
    una fijación del 100 por ciento de los píxeles."
  ko: "콘택트 시트 네 장에서 아홉 프레임으로 구성된 모든 시퀀스를 검토하여 동작 순서, 대상의 정체성, 문구와 마지막 자세가 유지됨을
    확인했습니다. 이 결과는 보관된 GPT Image 원본 픽셀을 재사용하며 제공업체를 새로 호출하지 않았습니다. 시간순 원본 자세 아홉
    개를 선택했습니다. 전체 길이와 재생 횟수를 유지했습니다. 원본 검토 기록(프레임 수는 원본에만 해당): 실제 투명 GIF 프레임 아홉
    개에서 반쯤 감긴 무표정한 눈은 안정적으로 유지되고 앞발이 박수 칩니다. 모든 문구가 好棒棒으로 정확하며 지지대 없이 귀 위에 떠
    있습니다. 인코딩한 GIF를 밝고 어두운 배경에서 확인했으며 실제 알파 투명도가 있고 흰 윤곽선은 없습니다. 얼굴을 다시 그리면서 생긴
    약간의 차이가 남아 있어 100% 픽셀 고정을 주장하지 않습니다."
