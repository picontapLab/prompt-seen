  zh-Hans: 花园的明暗遵循参考人像结构，在不同观看尺度下呈现变化。
  ja: 斜めから見た庭園の面を改善しました。個々のイトスギ、花壇、砂利道が原寸で識別でき、サムネイルでは参照した顔に対応します。大きく表示しても顔は分かるため、原寸では見えなくなる錯視ではなく、構造を利用した錯視として説明します。内蔵ツールの画像による条件付けを使っており、ControlNet
    は使っていません。
  de: "Verbesserte schräge Gartenebene: Einzelne Zypressen, Blumenbeete und
    Kieswege bleiben in voller Größe getrennt erkennbar; das Vorschaubild
    entspricht dem vorgegebenen Gesicht. Das Gesicht ist auch in großer
    Darstellung noch wahrnehmbar, daher als strukturelle Illusion beschreiben
    und nicht als in voller Größe unsichtbar. Integrierte Bildsteuerung, kein
    ControlNet."
  pt-BR: "Plano oblíquo de jardim melhorado: ciprestes distintos, canteiros de
    flores e caminhos de cascalho permanecem individualmente legíveis em tamanho
    integral; a miniatura se alinha ao rosto fornecido. O rosto ainda é
    perceptível em tamanho grande, portanto descreva como uma ilusão estrutural,
    não como invisível em tamanho integral. Condicionamento integrado de imagem,
    sem ControlNet."
  es: "Plano oblicuo de jardín mejorado: cipreses, parterres y caminos de grava
    distintos se leen individualmente a tamaño completo; la miniatura se alinea
    con el rostro aportado. El rostro sigue siendo perceptible a gran tamaño,
    por lo que debe describirse como una ilusión estructural, no como algo
    invisible a tamaño completo. Condicionamiento de imagen integrado, sin
    ControlNet."
  ko: 비스듬한 정원 평면이 개선되어 원본 크기에서도 사이프러스 나무, 화단과 자갈길을 각각 구분할 수 있습니다. 축소 이미지는 제공한 얼굴과
    정렬됩니다. 큰 크기에서도 얼굴이 보이므로 원본 크기에서 보이지 않는 착시가 아니라 구조적 착시로 설명해야 합니다. 내장 이미지 조건
    기능을 사용했으며 ControlNet은 사용하지 않았습니다.
