notes:
  en: "Reviewed all nine-frame sequences in four contact sheets: action order,
    identity, captions and final poses retained. This output reuses archived GPT
    Image source pixels; no new provider call. One held pose is split into two
    frames; eight distinct source poses, nine encoded frames. Total duration and
    playback count preserved. Original source review (frame counts describe
    source only): Eight drawn frames show open, half-closed, closed and reopened
    eyelids in order. Face, clothing and framing stay consistent with minor
    frame-to-frame drawing variation. Encoded as a 2-second infinite loop;
    actual GIF metadata verified. This is a frame-sheet adaptation, not native
    GIF output from the source prompt."
  zh-Hans: 动漫角色轻眨眼
  ja: 4枚の一覧画像ですべての9フレームの順序、人物の特徴、字幕、最終姿態を確認しました。保存済みのGPT
    Image素材を再利用し、新たな画像ツール呼び出しは行っていません。一つの姿態の停留を2フレームに分けています。異なる元姿態は8種類、符号化フレームは9枚です。総再生時間とループ回数は保持しています。元素材の確認記録（以下のコマ数は元素材のもの）：元の8コマは目を開く、半閉じ、閉じる、開き直す順です。顔、服、構図を保ちつつ小さな描画差があります。2秒の無限ループでGIFメタデータを検証済み。コマ画像からのアレンジであり、原文から直接返されたネイティブGIFではありません。
  de: "Alle Sequenzen mit neun Frames in vier Kontaktbögen geprüft:
    Handlungsreihenfolge, Identität, Beschriftungen und Endposen erhalten. Diese
    Ausgabe verwendet archivierte GPT-Image-Quellpixel erneut; kein neuer
    Anbieteraufruf. Eine gehaltene Pose ist in zwei Frames aufgeteilt; acht
    unterschiedliche Quellposen, neun codierte Frames. Gesamtdauer und
    Wiedergabeanzahl erhalten. Ursprüngliche Quellprüfung (Frame-Anzahlen
    beschreiben nur die Quelle): Acht gezeichnete Frames zeigen der Reihe nach
    offene, halb geschlossene, geschlossene und wieder geöffnete Augenlider.
    Gesicht, Kleidung und Bildausschnitt bleiben konsistent, mit leichten
    Zeichenabweichungen zwischen den Frames. Als Zwei-Sekunden-Endlosschleife
    codiert; tatsächliche GIF-Metadaten geprüft. Dies ist eine
    Frame-Bogen-Adaption, keine native GIF-Ausgabe des Quellprompts."
  pt-BR: "Todas as sequências de nove quadros foram revisadas em quatro folhas de
    contato: ordem das ações, identidade, legendas e poses finais preservadas.
    Este resultado reutiliza pixels de fontes arquivadas do GPT Image; não houve
    nova chamada ao provedor. Uma pose mantida é dividida em dois quadros; oito
    poses distintas da fonte, nove quadros codificados. Duração total e número
    de reproduções preservados. Revisão original da fonte (as contagens de
    quadros descrevem apenas a fonte): Oito quadros desenhados mostram pálpebras
    abertas, semicerradas, fechadas e reabertas na ordem correta. Rosto, roupas
    e enquadramento permanecem consistentes, com pequenas variações de desenho
    entre quadros. Codificado como repetição infinita de 2 segundos; metadados
    reais do GIF verificados. Esta é uma adaptação de folha de quadros, não uma
    saída nativa em GIF do prompt de origem."
  es: "Se revisaron todas las secuencias de nueve fotogramas en cuatro hojas de
    contacto: se conservaron el orden de la acción, la identidad, los textos y
    las poses finales. Este resultado reutiliza los píxeles de origen archivados
    de GPT Image; no hubo nueva llamada al proveedor. Una pose mantenida se
    divide en dos fotogramas; ocho poses de origen distintas, nueve fotogramas
    codificados. Se conservaron la duración total y el número de reproducciones.
    Revisión original de la fuente (los recuentos de fotogramas describen solo
    la fuente): Ocho fotogramas dibujados muestran párpados abiertos,
    entrecerrados, cerrados y reabiertos en orden. Rostro, ropa y encuadre
    siguen siendo coherentes con ligeras variaciones de dibujo entre fotogramas.
    Codificado como bucle infinito de 2 segundos; se verificaron los metadatos
    reales del GIF. Es una adaptación de hoja de fotogramas, no una salida GIF
    nativa del prompt de origen."
