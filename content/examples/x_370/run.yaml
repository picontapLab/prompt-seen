notes:
  en: "Reviewed all nine-frame sequences in four contact sheets: action order, identity, captions and
    final poses retained. This output reuses archived GPT Image source pixels; no new provider call.
    One held pose is split into two frames; eight distinct source poses, nine encoded frames. Total
    duration and playback count preserved. Original source review (frame counts describe source
    only): Eight drawn frames show open, half-closed, closed and reopened eyelids in order. Face,
    clothing and framing stay consistent with minor frame-to-frame drawing variation. Encoded as a
    2-second infinite loop; actual GIF metadata verified. This is a frame-sheet adaptation, not
    native GIF output from the source prompt."
  zh-Hans: 动漫角色轻眨眼
  ja: 4枚の一覧画像ですべての9フレームの順序、人物の特徴、字幕、最終姿態を確認しました。保存済みのGPT
    Image素材を再利用し、新たな画像ツール呼び出しは行っていません。一つの姿態の停留を2フレームに分けています。異なる元姿態は8種類、符号化フレームは9枚です。総再生時間とループ回数は保持しています。元素材の確認記録（以下のコマ数は元素材のもの）：元の8コマは目を開く、半閉じ、閉じる、開き直す順です。顔、服、構図を保ちつつ小さな描画差があります。2秒の無限ループでGIFメタデータを検証済み。コマ画像からのアレンジであり、原文から直接返されたネイティブGIFではありません。
  de: "Alle Sequenzen mit neun Frames in vier Kontaktbögen geprüft: Handlungsreihenfolge, Identität,
    Beschriftungen und Endposen erhalten. Diese Ausgabe verwendet archivierte GPT-Image-Quellpixel
    erneut; kein neuer Anbieteraufruf. Eine gehaltene Pose ist in zwei Frames aufgeteilt; acht
    unterschiedliche Quellposen, neun codierte Frames. Gesamtdauer und Wiedergabeanzahl erhalten.
    Ursprüngliche Quellprüfung (Frame-Anzahlen beschreiben nur die Quelle): Acht gezeichnete Frames
    zeigen der Reihe nach offene, halb geschlossene, geschlossene und wieder geöffnete Augenlider.
    Gesicht, Kleidung und Bildausschnitt bleiben konsistent, mit leichten Zeichenabweichungen
    zwischen den Frames. Als Zwei-Sekunden-Endlosschleife codiert; tatsächliche GIF-Metadaten
    geprüft. Dies ist eine Frame-Bogen-Adaption, keine native GIF-Ausgabe des Quellprompts."
  pt-BR: "Todas as sequências de nove quadros foram revisadas em quatro folhas de contato: ordem das
    ações, identidade, legendas e poses finais preservadas. Este resultado reutiliza pixels de
    fontes arquivadas do GPT Image; não houve nova chamada ao provedor. Uma pose mantida é dividida
    em dois quadros; oito poses distintas da fonte, nove quadros codificados. Duração total e número
    de reproduções preservados. Revisão original da fonte (as contagens de quadros descrevem apenas
    a fonte): Oito quadros desenhados mostram pálpebras abertas, semicerradas, fechadas e reabertas
    na ordem correta. Rosto, roupas e enquadramento permanecem consistentes, com pequenas variações
    de desenho entre quadros. Codificado como repetição infinita de 2 segundos; metadados reais do
    GIF verificados. Esta é uma adaptação de folha de quadros, não uma saída nativa em GIF do prompt
    de origem."
  es: "Se revisaron todas las secuencias de nueve fotogramas en cuatro hojas de contacto: se
    conservaron el orden de la acción, la identidad, los textos y las poses finales. Este resultado
    reutiliza los píxeles de origen archivados de GPT Image; no hubo nueva llamada al proveedor. Una
    pose mantenida se divide en dos fotogramas; ocho poses de origen distintas, nueve fotogramas
    codificados. Se conservaron la duración total y el número de reproducciones. Revisión original
    de la fuente (los recuentos de fotogramas describen solo la fuente): Ocho fotogramas dibujados
    muestran párpados abiertos, entrecerrados, cerrados y reabiertos en orden. Rostro, ropa y
    encuadre siguen siendo coherentes con ligeras variaciones de dibujo entre fotogramas. Codificado
    como bucle infinito de 2 segundos; se verificaron los metadatos reales del GIF. Es una
    adaptación de hoja de fotogramas, no una salida GIF nativa del prompt de origen."
  ko: "콘택트 시트 네 장에서 아홉 프레임으로 구성된 모든 시퀀스를 검토하여 동작 순서, 대상의 정체성, 문구와 마지막 자세가 유지됨을 확인했습니다. 이 결과는 보관된 GPT
    Image 원본 픽셀을 재사용하며 제공업체를 새로 호출하지 않았습니다. 유지되는 자세 하나를 두 프레임으로 나누어 서로 다른 원본 자세는 여덟 개, 인코딩된 프레임은 아홉
    개입니다. 전체 길이와 재생 횟수를 유지했습니다. 원본 검토 기록(프레임 수는 원본에만 해당): 그림 프레임 여덟 개가 눈을 뜬 상태, 반쯤 감은 상태, 감은 상태와 다시
    뜬 상태를 순서대로 보여 줍니다. 얼굴, 의상과 구도가 일관되며 프레임마다 그림에 약간의 차이가 있습니다. 2초 무한 반복으로 인코딩했으며 실제 GIF 메타데이터를
    확인했습니다. 원본 프롬프트에서 직접 나온 GIF가 아닌 프레임 시트 각색입니다."
  zh-Hant: 已在四張接觸印樣中核對全部九格序列：動作順序、身分、字幕與最終姿態均保留。本次輸出重用封存的 GPT Image
    來源像素，未再次呼叫供應商。一個停留姿態拆成兩個編碼格，八個不同來源姿態形成九個編碼格；總時長與播放次數保持不變。原始來源審查（以下格數僅描述來源版本）：八個繪製格依序呈現眼皮張開、半閉、閉合及重新張開。臉部、服裝與取景保持一致，但格間筆觸略有差異。編碼為兩秒無限循環，實際
    GIF 中繼資料已核對。這是精靈圖改編，不是來源提示詞的原生 GIF 輸出。
  fr: "Toutes les séquences de neuf images ont été examinées dans quatre planches-contact : ordre des
    actions, identité, légendes et poses finales conservés. Ce résultat réutilise les pixels sources
    GPT Image archivés ; aucun nouvel appel au fournisseur. Une pose maintenue est répartie sur deux
    images : huit poses sources distinctes, neuf images encodées. La durée totale et le nombre de
    lectures sont conservés. Examen de la source d’origine (les nombres d’images ne concernent que
    la source) : Huit images dessinées montrent dans l’ordre les paupières ouvertes, mi-closes,
    fermées puis rouvertes. Visage, vêtements et cadrage restent cohérents avec de légères
    variations de dessin entre les images. Encodé en boucle infinie de deux secondes ; métadonnées
    réelles du GIF vérifiées. C’est une adaptation à partir d’une planche d’images, pas une sortie
    GIF native du prompt source."
  it: "Tutte le sequenze di nove fotogrammi sono state esaminate in quattro provini: ordine delle
    azioni, identità, didascalie e pose finali conservati. Questo risultato riusa i pixel GPT Image
    archiviati; nessuna nuova chiamata al fornitore. Una posa mantenuta è divisa in due fotogrammi;
    otto pose originali distinte, nove fotogrammi codificati. Durata totale e numero di riproduzioni
    conservati. Revisione originale della fonte (i conteggi riguardano solo la fonte): otto
    fotogrammi disegnati mostrano in ordine palpebre aperte, socchiuse, chiuse e riaperte. Viso,
    vestiti e inquadratura restano coerenti con lievi variazioni del disegno tra fotogrammi.
    Codificata come ciclo infinito di 2 secondi; metadati effettivi della GIF verificati. È un
    adattamento da foglio di fotogrammi, non una GIF nativa dal prompt originale."
  ru: "Все последовательности из девяти кадров проверены на четырёх контактных листах: порядок
    действий, узнаваемость персонажей, подписи и финальные позы сохранены. Результат повторно
    использует пиксели архивного исходника GPT Image; нового обращения к сервису не было. Одна
    удерживаемая поза разделена на два кадра: восемь разных исходных поз, девять закодированных
    кадров. Общая длительность и число воспроизведений сохранены. Исходная проверка (число кадров
    относится только к исходнику): Восемь нарисованных кадров последовательно показывают открытые,
    полуприкрытые, закрытые и вновь открытые веки. Лицо, одежда и кадрирование сохраняются с
    небольшими различиями рисунка между кадрами. Закодирован бесконечный цикл длительностью 2
    секунды; фактические метаданные GIF проверены. Это адаптация листа кадров, а не GIF, напрямую
    полученный по исходному промпту."
  ar: "رُوجعت جميع التسلسلات ذات التسعة إطارات في أربع لوحات تجميع: حُفظ ترتيب الحركة والهوية والنصوص
    والوضعيات النهائية. تعيد هذه النتيجة استخدام بكسلات مصدر GPT Image المؤرشفة؛ ومن دون استدعاء
    جديد للمزوّد. تُقسَّم وضعية ثابتة واحدة على إطارين؛ ثماني وضعيات مصدر متميّزة وتسعة إطارات
    مرمّزة. حُفظت المدة الإجمالية وعدد مرات التشغيل. مراجعة المصدر الأصلية (تصف أعداد الإطارات
    المصدر وحده): تُظهر ثمانية إطارات مرسومة الجفون مفتوحة ونصف مغمضة ومغمضة ثم مفتوحة مجددًا
    بالترتيب. يبقى الوجه والملابس والتأطير متسقة مع فروق رسم طفيفة بين الإطارات. رُمّزت في حلقة لا
    نهائية مدتها ثانيتان؛ وجرت مراجعة بيانات GIF الفعلية. هذا اقتباس من ورقة إطارات، وليس خرج GIF
    أصليًا من أمر المصدر."
