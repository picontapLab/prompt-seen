  zh-Hans: 富士山旅行海报
  ja: 4枚の一覧画像ですべての9フレームの順序、人物の特徴、字幕、最終姿態を確認しました。保存済みのGPT
    Image素材を再利用し、新たな画像ツール呼び出しは行っていません。一つの姿態の停留を2フレームに分けています。異なる元姿態は8種類、符号化フレームは9枚です。総再生時間とループ回数は保持しています。元素材の確認記録（以下のコマ数は元素材のもの）：元の8コマでは塔と富士山の周囲に桜の花びらが舞い、見物客が少し動きます。3:4の中央切り抜き、2秒ループ。建物や風景には再描画による小さなずれがあります。
  de: "Alle Sequenzen mit neun Frames in vier Kontaktbögen geprüft:
    Handlungsreihenfolge, Identität, Beschriftungen und Endposen erhalten. Diese
    Ausgabe verwendet archivierte GPT-Image-Quellpixel erneut; kein neuer
    Anbieteraufruf. Eine gehaltene Pose ist in zwei Frames aufgeteilt; acht
    unterschiedliche Quellposen, neun codierte Frames. Gesamtdauer und
    Wiedergabeanzahl erhalten. Ursprüngliche Quellprüfung (Frame-Anzahlen
    beschreiben nur die Quelle): Acht Gouache-Frames zeigen fallende
    Kirschblütenblätter und subtile Besucherbewegungen um Pagode und Fuji.
    Mittiger 3:4-Zuschnitt; zweisekündiges wiederholtes GIF. Leichte
    Verschiebungen von Gebäuden und Landschaft zwischen neu gezeichneten Frames
    bleiben bestehen und müssen als Einschränkung der Adaption beschrieben
    werden."
  pt-BR: "Todas as sequências de nove quadros foram revisadas em quatro folhas de
    contato: ordem das ações, identidade, legendas e poses finais preservadas.
    Este resultado reutiliza pixels de fontes arquivadas do GPT Image; não houve
    nova chamada ao provedor. Uma pose mantida é dividida em dois quadros; oito
    poses distintas da fonte, nove quadros codificados. Duração total e número
    de reproduções preservados. Revisão original da fonte (as contagens de
    quadros descrevem apenas a fonte): Oito quadros em guache mostram pétalas de
    cerejeira caindo e movimentos sutis de visitantes ao redor do pagode e do
    Fuji. Recorte central de 3:4; GIF repetido de dois segundos. Persistem
    pequenos deslocamentos de edifícios e paisagem entre os quadros
    redesenhados, que devem ser descritos como uma limitação da adaptação."
