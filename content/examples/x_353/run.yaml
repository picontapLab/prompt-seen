  zh-Hans: 斗兽场旅行海报
  ja: 4枚の一覧画像ですべての9フレームの順序、人物の特徴、字幕、最終姿態を確認しました。保存済みのGPT
    Image素材を再利用し、新たな画像ツール呼び出しは行っていません。一つの姿態の停留を2フレームに分けています。異なる元姿態は8種類、符号化フレームは9枚です。総再生時間とループ回数は保持しています。元素材の確認記録（以下のコマ数は元素材のもの）：元の8コマではコロッセオを背景に自転車、スクーター、人、鳥が動きます。3:4の中央切り抜き、2秒ループ。ループ境界で位置が戻り、建築の細部にもずれがあるため、原文のシームレスな動きではなくキーフレームによるアレンジです。
  de: "Alle Sequenzen mit neun Frames in vier Kontaktbögen geprüft:
    Handlungsreihenfolge, Identität, Beschriftungen und Endposen erhalten. Diese
    Ausgabe verwendet archivierte GPT-Image-Quellpixel erneut; kein neuer
    Anbieteraufruf. Eine gehaltene Pose ist in zwei Frames aufgeteilt; acht
    unterschiedliche Quellposen, neun codierte Frames. Gesamtdauer und
    Wiedergabeanzahl erhalten. Ursprüngliche Quellprüfung (Frame-Anzahlen
    beschreiben nur die Quelle): Acht gezeichnete Gouache-Stadtframes zeigen
    Radfahrer, Roller, Menschen und Vögel in Bewegung vor einem erkennbaren
    Kolosseum. Tatsächlicher mittiger 3:4-Zuschnitt und zweisekündige
    wiederholte Wiedergabe. Sichtbares Zurücksetzen der Position an der
    Schleifengrenze und leichte Abweichungen der neu gezeichneten Architektur
    machen dies zu einer stilisierten Schlüsselbildadaption, nicht zum nahtlosen
    Ziel des Originalprompts."
  ko: "콘택트 시트 네 장에서 아홉 프레임으로 구성된 모든 시퀀스를 검토하여 동작 순서, 대상의 정체성, 문구와 마지막 자세가 유지됨을
    확인했습니다. 이 결과는 보관된 GPT Image 원본 픽셀을 재사용하며 제공업체를 새로 호출하지 않았습니다. 유지되는 자세 하나를 두
    프레임으로 나누어 서로 다른 원본 자세는 여덟 개, 인코딩된 프레임은 아홉 개입니다. 전체 길이와 재생 횟수를 유지했습니다. 원본 검토
    기록(프레임 수는 원본에만 해당): 구아슈 도시 그림 여덟 프레임에서 알아볼 수 있는 콜로세움을 배경으로 자전거, 스쿠터, 사람과 새가
    움직입니다. 실제로 중앙을 3:4로 자르고 2초 반복으로 재생합니다. 반복 경계에서 위치가 되돌아가는 것이 보이고 건축물을 다시 그리며
    생긴 미세한 흔들림도 있어, 원본 프롬프트가 목표로 한 무결점 연결이 아닌 스타일화된 키프레임 각색입니다."
