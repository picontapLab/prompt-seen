notes:
  en: "Reviewed all nine-frame sequences in four contact sheets: action order, identity, captions and
    final poses retained. This output reuses archived GPT Image source pixels; no new provider call.
    One held pose is split into two frames; eight distinct source poses, nine encoded frames. Total
    duration and playback count preserved. Original source review (frame counts describe source
    only): Eight drawn gouache city frames show cyclists, scooter, people and birds moving against a
    recognizable Colosseum. Actual 3:4 center crop and 2-second repeating playback. Visible position
    reset at loop boundary and minor architectural redraw drift mean this is a stylized keyframe
    adaptation, not the seamless original-prompt target."
  zh-Hans: 斗兽场旅行海报
  ja: 4枚の一覧画像ですべての9フレームの順序、人物の特徴、字幕、最終姿態を確認しました。保存済みのGPT
    Image素材を再利用し、新たな画像ツール呼び出しは行っていません。一つの姿態の停留を2フレームに分けています。異なる元姿態は8種類、符号化フレームは9枚です。総再生時間とループ回数は保持しています。元素材の確認記録（以下のコマ数は元素材のもの）：元の8コマではコロッセオを背景に自転車、スクーター、人、鳥が動きます。3:4の中央切り抜き、2秒ループ。ループ境界で位置が戻り、建築の細部にもずれがあるため、原文のシームレスな動きではなくキーフレームによるアレンジです。
  de: "Alle Sequenzen mit neun Frames in vier Kontaktbögen geprüft: Handlungsreihenfolge, Identität,
    Beschriftungen und Endposen erhalten. Diese Ausgabe verwendet archivierte GPT-Image-Quellpixel
    erneut; kein neuer Anbieteraufruf. Eine gehaltene Pose ist in zwei Frames aufgeteilt; acht
    unterschiedliche Quellposen, neun codierte Frames. Gesamtdauer und Wiedergabeanzahl erhalten.
    Ursprüngliche Quellprüfung (Frame-Anzahlen beschreiben nur die Quelle): Acht gezeichnete
    Gouache-Stadtframes zeigen Radfahrer, Roller, Menschen und Vögel in Bewegung vor einem
    erkennbaren Kolosseum. Tatsächlicher mittiger 3:4-Zuschnitt und zweisekündige wiederholte
    Wiedergabe. Sichtbares Zurücksetzen der Position an der Schleifengrenze und leichte Abweichungen
    der neu gezeichneten Architektur machen dies zu einer stilisierten Schlüsselbildadaption, nicht
    zum nahtlosen Ziel des Originalprompts."
  pt-BR: "Todas as sequências de nove quadros foram revisadas em quatro folhas de contato: ordem das
    ações, identidade, legendas e poses finais preservadas. Este resultado reutiliza pixels de
    fontes arquivadas do GPT Image; não houve nova chamada ao provedor. Uma pose mantida é dividida
    em dois quadros; oito poses distintas da fonte, nove quadros codificados. Duração total e número
    de reproduções preservados. Revisão original da fonte (as contagens de quadros descrevem apenas
    a fonte): Oito quadros desenhados de cidade em guache mostram ciclistas, scooter, pessoas e aves
    se movendo diante de um Coliseu reconhecível. Recorte central real de 3:4 e reprodução repetida
    de 2 segundos. O salto visível de posição na passagem entre fim e início e o pequeno
    deslocamento da arquitetura redesenhada indicam uma adaptação estilizada de quadros-chave, não o
    resultado contínuo pretendido pelo prompt original."
  es: "Se revisaron todas las secuencias de nueve fotogramas en cuatro hojas de contacto: se
    conservaron el orden de la acción, la identidad, los textos y las poses finales. Este resultado
    reutiliza los píxeles de origen archivados de GPT Image; no hubo nueva llamada al proveedor. Una
    pose mantenida se divide en dos fotogramas; ocho poses de origen distintas, nueve fotogramas
    codificados. Se conservaron la duración total y el número de reproducciones. Revisión original
    de la fuente (los recuentos de fotogramas describen solo la fuente): Ocho fotogramas urbanos
    dibujados a gouache muestran ciclistas, una moto, personas y aves moviéndose ante un Coliseo
    reconocible. Recorte central real de 3:4 y reproducción repetida de 2 segundos. El reinicio
    visible de posición en el límite del bucle y las pequeñas variaciones arquitectónicas al
    redibujar hacen de esto una adaptación estilizada de fotogramas clave, no el objetivo sin saltos
    del prompt original."
  ko: "콘택트 시트 네 장에서 아홉 프레임으로 구성된 모든 시퀀스를 검토하여 동작 순서, 대상의 정체성, 문구와 마지막 자세가 유지됨을 확인했습니다. 이 결과는 보관된 GPT
    Image 원본 픽셀을 재사용하며 제공업체를 새로 호출하지 않았습니다. 유지되는 자세 하나를 두 프레임으로 나누어 서로 다른 원본 자세는 여덟 개, 인코딩된 프레임은 아홉
    개입니다. 전체 길이와 재생 횟수를 유지했습니다. 원본 검토 기록(프레임 수는 원본에만 해당): 구아슈 도시 그림 여덟 프레임에서 알아볼 수 있는 콜로세움을 배경으로
    자전거, 스쿠터, 사람과 새가 움직입니다. 실제로 중앙을 3:4로 자르고 2초 반복으로 재생합니다. 반복 경계에서 위치가 되돌아가는 것이 보이고 건축물을 다시 그리며 생긴
    미세한 흔들림도 있어, 원본 프롬프트가 목표로 한 무결점 연결이 아닌 스타일화된 키프레임 각색입니다."
  zh-Hant: 已在四張接觸印樣中核對全部九格序列：動作順序、身分、字幕與最終姿態均保留。本次輸出重用封存的 GPT Image
    來源像素，未再次呼叫供應商。一個停留姿態拆成兩個編碼格，八個不同來源姿態形成九個編碼格；總時長與播放次數保持不變。原始來源審查（以下格數僅描述來源版本）：八格水粉都市畫面呈現自行車騎士、機車、行人與鳥，在可辨認的羅馬競技場前移動。實際採
    3:4 中央裁切，重複播放兩秒。循環邊界有可見的位置重設，建築重繪略有漂移；這是風格化關鍵格改編，並未達成原提示詞的無縫目標。
  fr: "Toutes les séquences de neuf images ont été examinées dans quatre planches-contact : ordre des
    actions, identité, légendes et poses finales conservés. Ce résultat réutilise les pixels sources
    GPT Image archivés ; aucun nouvel appel au fournisseur. Une pose maintenue est répartie sur deux
    images : huit poses sources distinctes, neuf images encodées. La durée totale et le nombre de
    lectures sont conservés. Examen de la source d’origine (les nombres d’images ne concernent que
    la source) : Huit images de ville dessinées à la gouache montrent cyclistes, scooter, personnes
    et oiseaux en mouvement devant un Colisée reconnaissable. Recadrage central 3:4 effectif et
    lecture répétée de deux secondes. Le retour de position visible au raccord de boucle et la
    légère dérive architecturale du redessin en font une adaptation stylisée par images clés, pas le
    résultat sans raccord visé par le prompt original."
  it: "Tutte le sequenze di nove fotogrammi sono state esaminate in quattro provini: ordine delle
    azioni, identità, didascalie e pose finali conservati. Questo risultato riusa i pixel GPT Image
    archiviati; nessuna nuova chiamata al fornitore. Una posa mantenuta è divisa in due fotogrammi;
    otto pose originali distinte, nove fotogrammi codificati. Durata totale e numero di riproduzioni
    conservati. Revisione originale della fonte (i conteggi riguardano solo la fonte): otto
    fotogrammi urbani a guazzo mostrano ciclisti, scooter, persone e uccelli in movimento davanti a
    un Colosseo riconoscibile. Ritaglio centrale effettivo 3:4 e riproduzione ripetuta di 2 secondi.
    Il ripristino visibile delle posizioni al confine del ciclo e i lievi spostamenti
    dell’architettura ridisegnata ne fanno un adattamento stilizzato a fotogrammi chiave, non il
    risultato continuo richiesto dal prompt originale."
  ru: "Все последовательности из девяти кадров проверены на четырёх контактных листах: порядок
    действий, узнаваемость персонажей, подписи и финальные позы сохранены. Результат повторно
    использует пиксели архивного исходника GPT Image; нового обращения к сервису не было. Одна
    удерживаемая поза разделена на два кадра: восемь разных исходных поз, девять закодированных
    кадров. Общая длительность и число воспроизведений сохранены. Исходная проверка (число кадров
    относится только к исходнику): восемь рисованных гуашевых городских кадров показывают движение
    велосипедистов, скутера, людей и птиц на фоне узнаваемого Колизея. Фактически выполнены
    центральное кадрирование 3:4 и повторяющееся воспроизведение длительностью 2 секунды. Видимый
    сброс положения на границе цикла и небольшие изменения перерисованной архитектуры означают, что
    это стилизованная адаптация по ключевым кадрам, а не бесшовный результат, заданный оригинальным
    промптом."
  ar: "رُوجعت جميع التسلسلات ذات التسعة إطارات في أربع لوحات تجميع: حُفظ ترتيب الحركة والهوية والنصوص
    والوضعيات النهائية. تعيد هذه النتيجة استخدام بكسلات مصدر GPT Image المؤرشفة؛ ومن دون استدعاء
    جديد للمزوّد. تُقسَّم وضعية ثابتة واحدة على إطارين؛ ثماني وضعيات مصدر متميّزة وتسعة إطارات
    مرمّزة. حُفظت المدة الإجمالية وعدد مرات التشغيل. مراجعة المصدر الأصلية (تصف أعداد الإطارات
    المصدر وحده): تُظهر ثمانية إطارات مدينية مرسومة بالغواش حركة راكبي دراجات وسكوتر وأشخاص وطيور
    أمام كولوسيوم يمكن التعرّف إليه. قصّ مركزي فعلي بنسبة 3:4 وتشغيل متكرر مدته ثانيتان. تعني إعادة
    ضبط الموضع الظاهرة عند حدّ الحلقة والانزياح البسيط في إعادة رسم العمارة أن هذا اقتباس أسلوبي
    بإطارات مفتاحية، وليس هدف الأمر الأصلي ذي الانتقال السلس."
