notes:
  en: "Reviewed all nine-frame sequences in four contact sheets: action order, identity, captions and
    final poses retained. This output reuses archived GPT Image source pixels; no new provider call.
    Nine chronological source poses selected. Total duration and playback count preserved. Original
    source review (frame counts describe source only): Twelve returned poses follow the ordered
    input chart: preparation, jump, turn, raise, dunk, hang, release and landing. Character and hoop
    positions stay readable; actual 1800 ms loop. The ball returns to the ready hand at the loop
    reset without a separate pickup transition; document this keyframe limitation."
  zh-Hans: 篮球扣篮动作
  ja: 4枚の一覧画像ですべての9フレームの順序、人物の特徴、字幕、最終姿態を確認しました。保存済みのGPT
    Image素材を再利用し、新たな画像ツール呼び出しは行っていません。元素材から時系列順に9姿態を選びました。総再生時間とループ回数は保持しています。元素材の確認記録（以下のコマ数は元素材のもの）：元の12姿態は入力表の順に、準備、ジャンプ、回転、腕上げ、ダンク、ぶら下がり、手放し、着地を描きます。人物とゴールは読み取れる位置で、1.8秒ループ。境界でボールが手に戻り、拾い上げる動作はありません。
  de: "Alle Sequenzen mit neun Frames in vier Kontaktbögen geprüft: Handlungsreihenfolge, Identität,
    Beschriftungen und Endposen erhalten. Diese Ausgabe verwendet archivierte GPT-Image-Quellpixel
    erneut; kein neuer Anbieteraufruf. Neun chronologische Quellposen ausgewählt. Gesamtdauer und
    Wiedergabeanzahl erhalten. Ursprüngliche Quellprüfung (Frame-Anzahlen beschreiben nur die
    Quelle): Zwölf zurückgegebene Posen folgen der geordneten Eingabetafel: Vorbereitung, Sprung,
    Drehung, Anheben, Dunk, Hängen, Loslassen und Landung. Figuren- und Korbpositionen bleiben
    erkennbar; tatsächliche 1800-ms-Schleife. Beim Schleifenwechsel kehrt der Ball ohne separaten
    Aufhebübergang in die bereite Hand zurück; diese Schlüsselbildgrenze dokumentieren."
  pt-BR: "Todas as sequências de nove quadros foram revisadas em quatro folhas de contato: ordem das
    ações, identidade, legendas e poses finais preservadas. Esta saída reutiliza pixels da fonte
    arquivada do GPT Image; não houve nova chamada ao provedor. Nove poses da fonte selecionadas em
    ordem cronológica. Duração total e número de reproduções preservados. Revisão original da fonte
    (as contagens de quadros descrevem apenas a fonte): Doze poses retornadas seguem a folha de
    ações de entrada ordenada: preparação, salto, giro, elevação, enterrada, suspensão no aro,
    soltura e aterrissagem. As posições do personagem e do aro permanecem claras; loop real de 1800
    ms. A bola volta à mão preparada no reinício do loop sem uma transição separada de recuperação;
    documente essa limitação dos quadros-chave."
  es: "Se revisaron todas las secuencias de nueve fotogramas en cuatro hojas de contacto: se
    conservaron el orden de la acción, la identidad, los textos y las poses finales. Este resultado
    reutiliza los píxeles de origen archivados de GPT Image; no hubo nueva llamada al proveedor. Se
    seleccionaron nueve poses de origen cronológicas. Se conservaron la duración total y el número
    de reproducciones. Revisión original de la fuente (los recuentos de fotogramas describen solo la
    fuente): Las doce poses devueltas siguen el diagrama de entrada ordenado: preparación, salto,
    giro, elevación, mate, suspensión, soltarse y aterrizaje. Las posiciones del personaje y el aro
    siguen siendo legibles; bucle real de 1800 ms. El balón vuelve a la mano preparada al
    reiniciarse el bucle sin una transición separada para recogerlo; esta limitación de fotogramas
    clave debe documentarse."
  ko: "콘택트 시트 네 장에서 아홉 프레임으로 구성된 모든 시퀀스를 검토하여 동작 순서, 대상의 정체성, 문구와 마지막 자세가 유지됨을 확인했습니다. 이 결과는 보관된 GPT
    Image 원본 픽셀을 재사용하며 제공업체를 새로 호출하지 않았습니다. 시간순 원본 자세 아홉 개를 선택했습니다. 전체 길이와 재생 횟수를 유지했습니다. 원본 검토
    기록(프레임 수는 원본에만 해당): 반환된 자세 열두 개가 입력 도표의 순서인 준비, 점프, 회전, 들어 올리기, 덩크, 매달리기, 놓기와 착지를 따릅니다. 캐릭터와 골대의
    위치를 분명히 알아볼 수 있으며 실제 반복 시간은 1800ms입니다. 반복이 초기화될 때 공을 줍는 별도 전환 없이 준비 자세의 손으로 공이 돌아오므로 이 키프레임 한계를
    기록해야 합니다."
  zh-Hant: 已在四張接觸印樣中核對全部九格序列：動作順序、身分、字幕與最終姿態均保留。本次輸出重用封存的 GPT Image
    來源像素，未再次呼叫供應商。依時間順序選取九個來源姿態，總時長與播放次數保持不變。原始來源審查（以下格數僅描述來源版本）：十二個回傳姿態遵循有序輸入動作圖：準備、跳躍、轉身、舉球、灌籃、懸掛、放手與落地。人物與籃框位置清楚，實際為
    1800ms 循環。循環重設時球直接回到準備的手中，未有獨立撿球過渡；此為需記錄的關鍵格限制。
  fr: "Toutes les séquences de neuf images ont été examinées dans quatre planches-contact : ordre des
    actions, identité, légendes et poses finales conservés. Ce résultat réutilise les pixels sources
    GPT Image archivés ; aucun nouvel appel au fournisseur. Neuf poses sources sélectionnées dans
    l’ordre chronologique. La durée totale et le nombre de lectures sont conservés. Examen de la
    source d’origine (les nombres d’images ne concernent que la source) : Douze poses renvoyées
    suivent la planche d’entrée ordonnée : préparation, saut, rotation, élévation, dunk, suspension,
    lâcher et réception. Positions du personnage et du panier lisibles ; boucle réelle de 1800 ms.
    Le ballon revient dans la main prête au redémarrage de la boucle sans transition distincte de
    ramassage ; cette limite des images clés doit être documentée."
  it: "Tutte le sequenze di nove fotogrammi sono state esaminate in quattro provini: ordine delle
    azioni, identità, didascalie e pose finali conservati. Questo risultato riusa i pixel GPT Image
    archiviati; nessuna nuova chiamata al fornitore. Selezionate nove pose originali in ordine
    cronologico. Durata totale e numero di riproduzioni conservati. Revisione originale della fonte
    (i conteggi riguardano solo la fonte): dodici pose restituite seguono la tavola di input
    ordinata: preparazione, salto, rotazione, sollevamento, schiacciata, sospensione, rilascio e
    atterraggio. Le posizioni del personaggio e del canestro restano leggibili; ciclo effettivo di
    1800 ms. La palla torna nella mano pronta al riavvio del ciclo senza una transizione separata di
    raccolta; questo limite dei fotogrammi chiave va documentato."
  ru: "Все последовательности из девяти кадров проверены на четырёх контактных листах: порядок
    действий, узнаваемость персонажей, подписи и финальные позы сохранены. Результат повторно
    использует пиксели архивного исходника GPT Image; нового обращения к сервису не было. Выбраны
    девять исходных поз в хронологическом порядке. Общая длительность и число воспроизведений
    сохранены. Исходная проверка (число кадров относится только к исходнику): двенадцать полученных
    поз следуют входной схеме в заданном порядке: подготовка, прыжок, поворот, подъём, бросок
    сверху, вис, отпускание и приземление. Положения персонажа и кольца остаются понятными;
    фактический цикл 1800 мс. При перезапуске цикла мяч возвращается в готовую руку без отдельного
    перехода с подбором; это ограничение ключевых кадров следует документировать."
  ar: "رُوجعت جميع التسلسلات ذات التسعة إطارات في أربع لوحات تجميع: حُفظ ترتيب الحركة والهوية والنصوص
    والوضعيات النهائية. تعيد هذه النتيجة استخدام بكسلات مصدر GPT Image المؤرشفة؛ ومن دون استدعاء
    جديد للمزوّد. اختيرت تسع وضعيات مصدر بترتيب زمني. حُفظت المدة الإجمالية وعدد مرات التشغيل.
    مراجعة المصدر الأصلية (تصف أعداد الإطارات المصدر وحده): تتبع الوضعيات الاثنتا عشرة المعادة مخطط
    الإدخال المرتّب: الاستعداد والقفز والالتفاف والرفع والكبس في السلة والتعلّق والإفلات والهبوط.
    تبقى مواضع الشخصية والطوق مفهومة؛ ومدة الحلقة الفعلية 1800 ms. تعود الكرة إلى اليد المستعدة عند
    إعادة الحلقة من دون انتقال منفصل لالتقاطها؛ ويجب توثيق هذا القيد للإطارات المفتاحية."
