notes:
  en: "Reviewed all nine-frame sequences in four contact sheets: action order,
    identity, captions and final poses retained. This output reuses archived GPT
    Image source pixels; no new provider call. Nine chronological source poses
    selected. Total duration and playback count preserved. Original source
    review (frame counts describe source only): Twelve returned poses follow the
    ordered input chart: preparation, jump, turn, raise, dunk, hang, release and
    landing. Character and hoop positions stay readable; actual 1800 ms loop.
    The ball returns to the ready hand at the loop reset without a separate
    pickup transition; document this keyframe limitation."
  zh-Hans: 篮球扣篮动作
  ja: 4枚の一覧画像ですべての9フレームの順序、人物の特徴、字幕、最終姿態を確認しました。保存済みのGPT
    Image素材を再利用し、新たな画像ツール呼び出しは行っていません。元素材から時系列順に9姿態を選びました。総再生時間とループ回数は保持しています。元素材の確認記録（以下のコマ数は元素材のもの）：元の12姿態は入力表の順に、準備、ジャンプ、回転、腕上げ、ダンク、ぶら下がり、手放し、着地を描きます。人物とゴールは読み取れる位置で、1.8秒ループ。境界でボールが手に戻り、拾い上げる動作はありません。
  de: "Alle Sequenzen mit neun Frames in vier Kontaktbögen geprüft:
    Handlungsreihenfolge, Identität, Beschriftungen und Endposen erhalten. Diese
    Ausgabe verwendet archivierte GPT-Image-Quellpixel erneut; kein neuer
    Anbieteraufruf. Neun chronologische Quellposen ausgewählt. Gesamtdauer und
    Wiedergabeanzahl erhalten. Ursprüngliche Quellprüfung (Frame-Anzahlen
    beschreiben nur die Quelle): Zwölf zurückgegebene Posen folgen der
    geordneten Eingabetafel: Vorbereitung, Sprung, Drehung, Anheben, Dunk,
    Hängen, Loslassen und Landung. Figuren- und Korbpositionen bleiben
    erkennbar; tatsächliche 1800-ms-Schleife. Beim Schleifenwechsel kehrt der
    Ball ohne separaten Aufhebübergang in die bereite Hand zurück; diese
    Schlüsselbildgrenze dokumentieren."
  pt-BR: "Todas as sequências de nove quadros foram revisadas em quatro folhas de
    contato: ordem das ações, identidade, legendas e poses finais preservadas.
    Esta saída reutiliza pixels da fonte arquivada do GPT Image; não houve nova
    chamada ao provedor. Nove poses da fonte selecionadas em ordem cronológica.
    Duração total e número de reproduções preservados. Revisão original da fonte
    (as contagens de quadros descrevem apenas a fonte): Doze poses retornadas
    seguem a folha de ações de entrada ordenada: preparação, salto, giro,
    elevação, enterrada, suspensão no aro, soltura e aterrissagem. As posições
    do personagem e do aro permanecem claras; loop real de 1800 ms. A bola volta
    à mão preparada no reinício do loop sem uma transição separada de
    recuperação; documente essa limitação dos quadros-chave."
  es: "Se revisaron todas las secuencias de nueve fotogramas en cuatro hojas de
    contacto: se conservaron el orden de la acción, la identidad, los textos y
    las poses finales. Este resultado reutiliza los píxeles de origen archivados
    de GPT Image; no hubo nueva llamada al proveedor. Se seleccionaron nueve
    poses de origen cronológicas. Se conservaron la duración total y el número
    de reproducciones. Revisión original de la fuente (los recuentos de
    fotogramas describen solo la fuente): Las doce poses devueltas siguen el
    diagrama de entrada ordenado: preparación, salto, giro, elevación, mate,
    suspensión, soltarse y aterrizaje. Las posiciones del personaje y el aro
    siguen siendo legibles; bucle real de 1800 ms. El balón vuelve a la mano
    preparada al reiniciarse el bucle sin una transición separada para
    recogerlo; esta limitación de fotogramas clave debe documentarse."
