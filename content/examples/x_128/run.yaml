observation:
  en: Cold blue light traces the hair and shoulders against the moon and distant city lights.
  zh-Hans: 冷蓝光勾出发梢和肩膀，背后可见月亮和虚化的城市灯光。
  ja: 冷たい青の光が髪と肩の輪郭を照らし、背景に月と遠くの街灯が見えます。
  de: Kühles Blau zeichnet Haare und Schultern vor dem Mond und entfernten Stadtlichtern nach.
  pt-BR: A luz azul fria contorna o cabelo e os ombros diante da lua e das luzes distantes da cidade.
  es: Una luz azul fría perfila el cabello y los hombros delante de la luna y las luces lejanas de la
    ciudad.
  ko: 달과 멀리 흐릿한 도시 불빛을 배경으로 차가운 파란 빛이 머리와 어깨의 윤곽을 드러냅니다.
  zh-Hant: 冷藍光勾出髮梢與肩膀，背後可見月亮和遠處模糊的城市燈光。
  fr: Une lumière bleue froide souligne les cheveux et les épaules devant la lune et des lumières
