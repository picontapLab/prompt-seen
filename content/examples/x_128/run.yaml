  it: La luce blu fredda delinea capelli e spalle davanti alla luna e alle luci lontane della città.
  ru: Холодный синий свет очерчивает волосы и плечи на фоне луны и далёких городских огней.
  ar: يرسم ضوء أزرق بارد حدود الشعر والكتفين أمام القمر وأضواء المدينة البعيدة.
