notes:
  en: "Nine distinct cartoon reactions in an even 3-by-3 arrangement. Inspected all captions in order:
    Hey!, Same., Seriously?, I am in contraction, Nope., Thank you!, You got this., BRB, Love it!;
    apostrophe in the fourth caption is present. R1 curly hair, facial features and teal sweatshirt
    remain recognizable across all cells. Large high-contrast lettering, pale background and white
    borders; no extra title. Phone layout will be checked after import."
  zh-Hans: 青绿色卫衣的卷发人物呈现九种卡通反应，每格有一条英文短句。
  ja: 均等な3×3配置に9種類の表情があります。Hey!、Same.、Seriously?、I'm in!、Nope.、Thank you!、You got this.、BRB、Love it!
    の順序と句読点を確認しました。4番目のキャプションにはアポストロフィーがあります。R1の巻き髪、顔立ち、青緑のスウェットが全コマで認識できます。大きくコントラストの高い文字、淡い背景、白い縁取りがあり、余分な見出しはありません。スマートフォンでの表示は導入後に確認します。
  de: "Neun unterschiedliche Cartoon-Reaktionen in einer gleichmäßigen 3×3-Anordnung. Alle
    Beschriftungen der Reihe nach geprüft: Hey!, Same., Seriously?, die Kurzform von I am in, Nope.,
    Thank you!, You got this., BRB, Love it!; der Apostroph in der vierten Beschriftung ist
    vorhanden. Lockiges Haar, Gesichtszüge und türkisfarbenes Sweatshirt von R1 bleiben in allen
    Zellen erkennbar. Große kontrastreiche Schrift, heller Hintergrund und weiße Ränder; kein
    zusätzlicher Titel. Die Smartphone-Darstellung wird nach dem Import geprüft."
  pt-BR: "Nove reações distintas de desenho animado em uma grade uniforme 3 por 3. Todas as legendas
    foram examinadas na ordem: Hey!, Same., Seriously?, contração de I am in, Nope., Thank you!, You
    got this., BRB, Love it!; o apóstrofo da quarta legenda está presente. O cabelo cacheado, os
    traços faciais e o moletom azul-petróleo de R1 permanecem reconhecíveis em todas as células.
    Letras grandes de alto contraste, fundo claro e bordas brancas; sem título extra. O layout no
    celular será conferido após a importação."
  es: "Nueve reacciones de dibujo animado distintas en una disposición uniforme de 3 por 3. Se
    inspeccionaron todos los textos en orden: Hey!, Same., Seriously?, la contracción de I am in,
    Nope., Thank you!, You got this., BRB, Love it!; el apóstrofo del cuarto texto está presente. El
    pelo rizado, los rasgos faciales y la sudadera verde azulada de R1 siguen siendo reconocibles en
    todas las celdas. Texto grande de alto contraste, fondo claro y bordes blancos; sin título
    adicional. La composición en teléfono se comprobará después de importar."
  ko: "균등한 3×3 배열에 서로 다른 만화 반응 아홉 개가 있습니다. 문구를 순서대로 모두 확인했습니다: Hey!, Same., Seriously?, I am in의 축약형,
    Nope., Thank you!, You got this., BRB, Love it!; 네 번째 문구에는 아포스트로피가 있습니다. 모든 칸에서 R1의 곱슬머리, 얼굴 특징과
    청록색 맨투맨을 알아볼 수 있습니다. 크고 대비가 뚜렷한 글자, 옅은 배경과 흰 테두리가 있으며 별도 제목은 없습니다. 휴대폰 레이아웃은 가져오기 후 확인할 예정입니다."
  zh-Hant: 九個不同卡通反應均勻排成 3×3。已依序檢視字幕：Hey!、Same.、Seriously?、I am in 的縮寫、Nope.、Thank you!、You got
    this.、BRB、Love it!；第四句的撇號存在。各格均可辨認 R1 的捲髮、五官與藍綠運動衫。文字大且對比高，背景淺色並有白邊，無額外標題。手機版面將於匯入後檢查。
  fr: "Neuf réactions de dessin animé distinctes dans une disposition régulière de 3 × 3. Toutes les
    légendes ont été vérifiées dans l’ordre : Hey!, Same., Seriously?, forme contractée de I am in,
    Nope., Thank you!, You got this., BRB, Love it! ; l’apostrophe de la quatrième légende est
    présente. Les cheveux bouclés, les traits du visage et le sweat bleu sarcelle de R1 restent
    reconnaissables dans toutes les cellules. Grandes lettres très contrastées, fond pâle et
    bordures blanches ; aucun titre supplémentaire. La présentation sur téléphone sera vérifiée
    après l’importation."
  it: "Nove reazioni cartoon distinte in disposizione regolare 3 per 3. Esaminate tutte le didascalie
    in ordine: Hey!, Same., Seriously?, forma contratta di I am in, Nope., Thank you!, You got
    this., BRB, Love it!; l’apostrofo della quarta didascalia è presente. Capelli ricci, tratti del
    viso e felpa petrolio di R1 restano riconoscibili in tutte le celle. Scritte grandi ad alto
    contrasto, sfondo chiaro e bordi bianchi; nessun titolo extra. L’impaginazione per telefono sarà
    controllata dopo l’importazione."
  ru: "Девять разных мультяшных реакций в равномерной сетке 3 на 3. Проверены все подписи по порядку:
    Hey!, Same., Seriously?, I'm in!, Nope., Thank you!, You got this., BRB, Love it!; апостроф в
    четвёртой подписи присутствует. Кудри, черты лица и бирюзовая толстовка R1 остаются узнаваемыми
    во всех ячейках. Крупные контрастные надписи, светлый фон и белые границы; дополнительного
    заголовка нет. Компоновка на телефоне будет проверена после импорта."
  ar: "تسعة ردود فعل كرتونية متميّزة في ترتيب منتظم 3-by-3. فُحصت جميع النصوص بالترتيب: Hey! وSame.
    وSeriously? والصيغة المختصرة من I am in وNope. وThank you! وYou got this. وBRB وLove it!؛ وتوجد
    الفاصلة العليا في النص الرابع. يبقى شعر R1 المجعّد وملامح الوجه والقميص الأخضر المزرق قابلة
    للتعرّف في جميع الخلايا. كتابة كبيرة عالية التباين وخلفية شاحبة وحدود بيضاء؛ ومن دون عنوان
    إضافي. سيُفحص تخطيط الهاتف بعد الاستيراد."
