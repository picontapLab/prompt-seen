notes:
  en: "Reviewed all nine-frame sequences in four contact sheets: action order,
    identity, captions and final poses retained. This output reuses archived GPT
    Image source pixels; no new provider call. One held pose is split into two
    frames; eight distinct source poses, nine encoded frames. Total duration and
    playback count preserved. Original source review (frame counts describe
    source only): Eight gouache frames retain bridge, cliff and beach while surf
    washes in and recedes and gulls change position. Center crop to 3:4 retains
    bridge and foreground subjects. Minor redrawn landscape and people drift is
    visible; not a perfectly locked painted layer. Two-second infinite loop,
    separately attributed production adaptation."
  zh-Hans: 金门大桥水粉海报
  ja: 4枚の一覧画像ですべての9フレームの順序、人物の特徴、字幕、最終姿態を確認しました。保存済みのGPT
    Image素材を再利用し、新たな画像ツール呼び出しは行っていません。一つの姿態の停留を2フレームに分けています。異なる元姿態は8種類、符号化フレームは9枚です。総再生時間とループ回数は保持しています。元素材の確認記録（以下のコマ数は元素材のもの）：元の8コマでは橋、崖、砂浜を保ちながら波が寄せて返し、鳥の位置が変わります。3:4の中央切り抜きで橋と前景を残しています。風景や人物には再描画による小さなずれがあります。2秒の無限ループで、完全に固定された絵のレイヤーではなく独自アレンジです。
  de: "Alle Sequenzen mit neun Frames in vier Kontaktbögen geprüft:
    Handlungsreihenfolge, Identität, Beschriftungen und Endposen erhalten. Diese
    Ausgabe verwendet archivierte GPT-Image-Quellpixel erneut; kein neuer
    Anbieteraufruf. Eine gehaltene Pose ist in zwei Frames aufgeteilt; acht
    unterschiedliche Quellposen, neun codierte Frames. Gesamtdauer und
    Wiedergabeanzahl erhalten. Ursprüngliche Quellprüfung (Frame-Anzahlen
    beschreiben nur die Quelle): Acht Gouache-Frames bewahren Brücke, Klippe und
    Strand, während die Brandung anrollt und zurückweicht und Möwen ihre
    Position ändern. Der mittige Zuschnitt auf 3:4 bewahrt Brücke und
    Vordergrundmotive. Leichte Verschiebungen der neu gezeichneten Landschaft
    und Menschen sind sichtbar; keine perfekt fixierte gemalte Ebene.
    Zwei-Sekunden-Endlosschleife, separat zugeschriebene Produktionsadaption."
  es: "Se revisaron todas las secuencias de nueve fotogramas en cuatro hojas de
    contacto: se conservaron el orden de la acción, la identidad, los textos y
    las poses finales. Este resultado reutiliza los píxeles de origen archivados
    de GPT Image; no hubo nueva llamada al proveedor. Una pose mantenida se
    divide en dos fotogramas; ocho poses de origen distintas, nueve fotogramas
    codificados. Se conservaron la duración total y el número de reproducciones.
    Revisión original de la fuente (los recuentos de fotogramas describen solo
    la fuente): Ocho fotogramas a gouache conservan el puente, el acantilado y
    la playa mientras el oleaje entra y retrocede y las gaviotas cambian de
    posición. El recorte central a 3:4 conserva el puente y los sujetos del
    primer plano. Se aprecian pequeños desplazamientos del paisaje y las
    personas redibujados; no es una capa pintada perfectamente fija. Bucle
    infinito de dos segundos, adaptación de producción con atribución separada."
  ko: "콘택트 시트 네 장에서 아홉 프레임으로 구성된 모든 시퀀스를 검토하여 동작 순서, 대상의 정체성, 문구와 마지막 자세가 유지됨을
    확인했습니다. 이 결과는 보관된 GPT Image 원본 픽셀을 재사용하며 제공업체를 새로 호출하지 않았습니다. 유지되는 자세 하나를 두
    프레임으로 나누어 서로 다른 원본 자세는 여덟 개, 인코딩된 프레임은 아홉 개입니다. 전체 길이와 재생 횟수를 유지했습니다. 원본 검토
    기록(프레임 수는 원본에만 해당): 구아슈 프레임 여덟 개에서 파도가 들어왔다 빠지고 갈매기가 이동하는 동안 다리, 절벽과 해변이
    유지됩니다. 중앙을 3:4로 잘라도 다리와 전경의 대상은 남습니다. 다시 그린 풍경과 사람의 미세한 흔들림이 보이며 완전히 고정된 그림
    레이어는 아닙니다. 2초 무한 반복이며 별도 출처를 명시한 제작용 각색입니다."
