  zh-Hans: 矮人游戏资产转台
  ja: 4枚の一覧画像ですべての9フレームの順序、人物の特徴、字幕、最終姿態を確認しました。保存済みのGPT
    Image素材を再利用し、新たな画像ツール呼び出しは行っていません。元素材から時系列順に9姿態を選びました。総再生時間とループ回数は保持しています。元素材の確認記録（以下のコマ数は元素材のもの）：元の12視点は正面から両側と背面を通り、ほぼ正面に戻ります。赤いひげ、肩の斧、毛皮、衣装と全身を保っています。1.44秒ループ。描かれた視点間隔は近似で、実際の3Dメッシュのレンダリングではありません。
  de: "Alle Sequenzen mit neun Frames in vier Kontaktbögen geprüft:
    Handlungsreihenfolge, Identität, Beschriftungen und Endposen erhalten. Diese
    Ausgabe verwendet archivierte GPT-Image-Quellpixel erneut; kein neuer
    Anbieteraufruf. Neun chronologische Quellposen ausgewählt. Gesamtdauer und
    Wiedergabeanzahl erhalten. Ursprüngliche Quellprüfung (Frame-Anzahlen
    beschreiben nur die Quelle): Zwölf unterschiedliche Ansichten drehen sich
    von vorn über beide Seiten und die Rückseite zurück bis fast nach vorn und
    halten den rotbärtigen Zwerg, die Axt auf der Schulter, Fell und Kostüm
    erkennbar. Vollständiger Körper in jedem Frame. 1440-ms-Schleife. Die
    Abstände der handgezeichneten Ansichten sind angenähert, keine echte
    Darstellung eines 3D-Meshs."
  pt-BR: "Todas as sequências de nove quadros foram revisadas em quatro folhas de
    contato: ordem da ação, identidade, legendas e poses finais preservadas.
    Esta saída reutiliza os pixels de origem arquivados do GPT Image; não houve
    nova chamada ao provedor. Nove poses de origem selecionadas em ordem
    cronológica. Duração total e número de reproduções preservados. Revisão
    original da fonte (as contagens de quadros descrevem apenas a fonte): Doze
    vistas distintas giram da frente, passando pelos dois lados e pelas costas,
    até quase voltar à frente, mantendo reconhecíveis o anão ruivo, o machado no
    ombro, a pele de animal e o traje. O corpo inteiro permanece dentro de cada
    quadro. Loop de 1440 ms. O espaçamento entre vistas desenhadas à mão é
    aproximado, não uma renderização real de malha 3D."
