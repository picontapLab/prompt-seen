notes:
  en: "Reviewed all nine-frame sequences in four contact sheets: action order,
    identity, captions and final poses retained. This output reuses archived GPT
    Image source pixels; no new provider call. Nine chronological source poses
    selected. Total duration and playback count preserved. Original source
    review (frame counts describe source only): Twelve distinct views rotate
    from front through both sides and back to near-front, keeping the
    red-bearded dwarf, shoulder axe, fur and costume recognizable. Complete body
    within each frame. 1440 ms loop. Hand-drawn view spacing is approximate, not
    a true 3D mesh render."
  zh-Hans: 矮人游戏资产转台
  ja: 4枚の一覧画像ですべての9フレームの順序、人物の特徴、字幕、最終姿態を確認しました。保存済みのGPT
    Image素材を再利用し、新たな画像ツール呼び出しは行っていません。元素材から時系列順に9姿態を選びました。総再生時間とループ回数は保持しています。元素材の確認記録（以下のコマ数は元素材のもの）：元の12視点は正面から両側と背面を通り、ほぼ正面に戻ります。赤いひげ、肩の斧、毛皮、衣装と全身を保っています。1.44秒ループ。描かれた視点間隔は近似で、実際の3Dメッシュのレンダリングではありません。
  de: "Alle Sequenzen mit neun Frames in vier Kontaktbögen geprüft:
    Handlungsreihenfolge, Identität, Beschriftungen und Endposen erhalten. Diese
    Ausgabe verwendet archivierte GPT-Image-Quellpixel erneut; kein neuer
    Anbieteraufruf. Neun chronologische Quellposen ausgewählt. Gesamtdauer und
    Wiedergabeanzahl erhalten. Ursprüngliche Quellprüfung (Frame-Anzahlen
    beschreiben nur die Quelle): Zwölf unterschiedliche Ansichten drehen sich
    von vorn über beide Seiten und die Rückseite zurück bis fast nach vorn und
    halten den rotbärtigen Zwerg, die Axt auf der Schulter, Fell und Kostüm
    erkennbar. Vollständiger Körper in jedem Frame. 1440-ms-Schleife. Die
    Abstände der handgezeichneten Ansichten sind angenähert, keine echte
    Darstellung eines 3D-Meshs."
  es: "Se revisaron todas las secuencias de nueve fotogramas en cuatro hojas de
    contacto: se conservaron el orden de la acción, la identidad, los textos y
    las poses finales. Este resultado reutiliza los píxeles de origen archivados
    de GPT Image; no hubo nueva llamada al proveedor. Se seleccionaron nueve
    poses de origen cronológicas. Se conservaron la duración total y el número
    de reproducciones. Revisión original de la fuente (los recuentos de
    fotogramas describen solo la fuente): Doce vistas distintas giran desde el
    frente por ambos lados y la espalda hasta casi volver al frente, manteniendo
    reconocibles al enano de barba roja, el hacha al hombro, las pieles y el
    atuendo. Cuerpo completo dentro de cada fotograma. Bucle de 1440 ms. La
    separación de las vistas dibujadas es aproximada, no un renderizado real de
    malla 3D."
  ko: "콘택트 시트 네 장에서 아홉 프레임으로 구성된 모든 시퀀스를 검토하여 동작 순서, 대상의 정체성, 문구와 마지막 자세가 유지됨을
    확인했습니다. 이 결과는 보관된 GPT Image 원본 픽셀을 재사용하며 제공업체를 새로 호출하지 않았습니다. 시간순 원본 자세 아홉
    개를 선택했습니다. 전체 길이와 재생 횟수를 유지했습니다. 원본 검토 기록(프레임 수는 원본에만 해당): 서로 다른 열두 시점이 정면에서
    양쪽 측면과 후면을 지나 거의 정면으로 돌아오며, 붉은 수염의 드워프, 어깨에 걸친 도끼, 털과 의상을 알아볼 수 있게 유지합니다. 각
    프레임 안에 전신이 들어갑니다. 1440ms 반복입니다. 손으로 그린 시점 간격은 근사치이며 실제 3D 메시 렌더링은 아닙니다."
