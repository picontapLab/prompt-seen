notes:
  en: "Reviewed all nine-frame sequences in four contact sheets: action order,
    identity, captions and final poses retained. This output reuses archived GPT
    Image source pixels; no new provider call. One held pose is split into two
    frames; eight distinct source poses, nine encoded frames. Total duration and
    playback count preserved. Original source review (frame counts describe
    source only): Eight poses show furrowed brows, puffed cheeks and alternating
    foot stomps, preserving penguin and red scarf. 1600 ms loop; expression
    resets to neutral on first frame, so no seamless expression match is
    claimed."
  zh-Hans: 企鹅：怒
  ja: 4枚の一覧画像ですべての9フレームの順序、人物の特徴、字幕、最終姿態を確認しました。保存済みのGPT
    Image素材を再利用し、新たな画像ツール呼び出しは行っていません。一つの姿態の停留を2フレームに分けています。異なる元姿態は8種類、符号化フレームは9枚です。総再生時間とループ回数は保持しています。元素材の確認記録（以下のコマ数は元素材のもの）：元の8姿態は眉を寄せ、頬を膨らませ、交互に足踏みします。ペンギンと赤いマフラーを保つ1.6秒ループ。先頭で通常表情に戻るため、表情の完全なシームレス接続ではありません。
  de: "Alle Sequenzen mit neun Frames in vier Kontaktbögen geprüft:
    Handlungsreihenfolge, Identität, Beschriftungen und Endposen erhalten. Diese
    Ausgabe verwendet archivierte GPT-Image-Quellpixel erneut; kein neuer
    Anbieteraufruf. Eine gehaltene Pose ist in zwei Frames aufgeteilt; acht
    unterschiedliche Quellposen, neun codierte Frames. Gesamtdauer und
    Wiedergabeanzahl erhalten. Ursprüngliche Quellprüfung (Frame-Anzahlen
    beschreiben nur die Quelle): Acht Posen zeigen gerunzelte Brauen,
    aufgeblasene Wangen und abwechselndes Fußstampfen, wobei Pinguin und roter
    Schal erhalten bleiben. 1600-ms-Schleife; der Gesichtsausdruck wird im
    ersten Frame auf neutral zurückgesetzt, daher wird keine nahtlose
    Übereinstimmung des Ausdrucks behauptet."
  pt-BR: "Todas as sequências de nove quadros foram revisadas em quatro folhas de
    contato: ordem das ações, identidade, legendas e poses finais preservadas.
    Esta saída reutiliza pixels da fonte arquivada do GPT Image; não houve nova
    chamada ao provedor. Uma pose mantida é dividida em dois quadros; oito poses
    distintas da fonte e nove quadros codificados. Duração total e número de
    reproduções preservados. Revisão original da fonte (as contagens de quadros
    descrevem apenas a fonte): Oito poses mostram sobrancelhas franzidas,
    bochechas infladas e batidas alternadas dos pés, preservando o pinguim e o
    cachecol vermelho. Loop de 1600 ms; a expressão volta ao neutro no primeiro
    quadro, por isso não se afirma uma transição de expressão sem emenda."
  es: "Se revisaron todas las secuencias de nueve fotogramas en cuatro hojas de
    contacto: se conservaron el orden de la acción, la identidad, los textos y
    las poses finales. Este resultado reutiliza los píxeles de origen archivados
    de GPT Image; no hubo nueva llamada al proveedor. Una pose mantenida se
    divide en dos fotogramas; ocho poses de origen distintas, nueve fotogramas
    codificados. Se conservaron la duración total y el número de reproducciones.
    Revisión original de la fuente (los recuentos de fotogramas describen solo
    la fuente): Ocho poses muestran ceño fruncido, mejillas hinchadas y
    pisotones alternados, conservando el pingüino y la bufanda roja. Bucle de
    1600 ms; la expresión vuelve a neutra en el primer fotograma, por lo que no
    se afirma una transición de expresión sin saltos."
  ko: "콘택트 시트 네 장에서 아홉 프레임으로 구성된 모든 시퀀스를 검토하여 동작 순서, 대상의 정체성, 문구와 마지막 자세가 유지됨을
    확인했습니다. 이 결과는 보관된 GPT Image 원본 픽셀을 재사용하며 제공업체를 새로 호출하지 않았습니다. 유지되는 자세 하나를 두
    프레임으로 나누어 서로 다른 원본 자세는 여덟 개, 인코딩된 프레임은 아홉 개입니다. 전체 길이와 재생 횟수를 유지했습니다. 원본 검토
    기록(프레임 수는 원본에만 해당): 자세 여덟 개가 찌푸린 눈썹, 부푼 볼과 번갈아 발 구르기를 보여 주며 펭귄과 빨간 목도리를
    유지합니다. 1600ms 반복입니다. 첫 프레임에서 표정이 기본 상태로 돌아가므로 표정이 매끄럽게 이어진다고 주장하지 않습니다."
