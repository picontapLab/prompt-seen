  zh-Hans: 树蛙交替抬手打字，一侧镜片闪光，双手随后回到初始姿势。
  ja: カエルが左右の手を交互に動かし、片方のレンズが光った後、両手が最初の位置に戻ります。
  de: Der Frosch tippt abwechselnd, ein Brillenglas blitzt auf und beide Hände kehren in die
    Ausgangsposition zurück.
  pt-BR: O sapo alterna as mãos ao digitar, uma lente reluz e as duas mãos voltam à posição inicial.
  es: La rana alterna las manos al teclear. Tras el destello de una lente, ambas manos vuelven a la
    posición inicial.
  ko: 개구리가 양손을 번갈아 움직이고 한쪽 렌즈가 반짝인 뒤 두 손이 처음 위치로 돌아갑니다.
  zh-Hant: 樹蛙交替抬手打字，一邊鏡片閃光，雙手隨後回到起始姿勢。
  fr: La grenouille alterne les mains, un verre de lunettes brille et les deux mains reviennent à leur
