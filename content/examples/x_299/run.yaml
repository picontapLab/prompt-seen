notes:
  en: Pencil owl blinks and lifts its wings while remaining a drawing on the notebook page. Six-frame
    composed GIF preserves the paper setting with small page and line drift between frames.
  zh-Hans: 笔记本上的铅笔猫头鹰眨眼并抬起翅膀，保持纸上涂鸦形态；纸张和线条在各帧间有小幅位移。
  ja: 鉛筆で描いたフクロウが、ノートのページ上の絵のまま、まばたきをして翼を持ち上げます。6 フレームから組み立てた GIF
    で、紙の背景を保っていますが、フレーム間でページと線に小さなずれがあります。
  de: Eine Bleistifteule blinzelt und hebt ihre Flügel, bleibt dabei aber eine Zeichnung auf der
    Notizbuchseite. Das zusammengesetzte GIF mit sechs Frames bewahrt die Papierkulisse, mit
    leichten Verschiebungen von Seite und Linien zwischen den Frames.
  pt-BR: A coruja a lápis pisca e levanta as asas, permanecendo um desenho na página do caderno. O GIF
    composto de seis quadros preserva o papel como cenário, com pequenos deslocamentos da página e
    dos traços entre os quadros.
  es: Un búho a lápiz parpadea y levanta las alas mientras sigue siendo un dibujo en la página del
    cuaderno. El GIF compuesto de seis fotogramas conserva el entorno de papel con pequeños
    desplazamientos de página y trazos entre fotogramas.
  ko: 연필로 그린 부엉이가 노트 위의 그림 상태를 유지한 채 눈을 깜박이고 날개를 들어 올립니다. 여섯 프레임 합성 GIF는 종이 배경을 유지하지만 프레임 사이에 페이지와 선이
    조금 흔들립니다.
  zh-Hant: 鉛筆貓頭鷹眨眼並抬起翅膀，同時仍是筆記本頁面上的畫。六格合成 GIF 保留紙面場景，各格間紙張與線條略有漂移。
  fr: La chouette au crayon cligne des yeux et lève ses ailes tout en restant un dessin sur la page du
    carnet. Le GIF assemblé de six images conserve le cadre de papier avec de petites dérives de
    page et de traits entre les images.
  it: Il gufo a matita sbatte le palpebre e solleva le ali restando un disegno sulla pagina del
    quaderno. La GIF assemblata di sei fotogrammi conserva l’ambientazione su carta con piccoli
    spostamenti di pagina e tratti tra i fotogrammi.
