notes:
  en: "Reviewed all nine-frame sequences in four contact sheets: action order, identity, captions and
    final poses retained. This output reuses archived GPT Image source pixels; no new provider call.
    One held pose is split into two frames; eight distinct source poses, nine encoded frames. Total
    duration and playback count preserved. Original source review (frame counts describe source
    only): Selected first eight cells: cat looks at camera, winks one eye, then green Robin-labelled
    hat falls and settles. Discarded final four cells because cat jumps/disappears. Final
    eight-frame GIF plays once for 2 seconds; no false seamless-loop claim. Text Robin is legible on
    settled hat."
  zh-Hans: Robin 猫眨眼与落帽
  ja: 4枚の一覧画像ですべての9フレームの順序、人物の特徴、字幕、最終姿態を確認しました。保存済みのGPT
    Image素材を再利用し、新たな画像ツール呼び出しは行っていません。一つの姿態の停留を2フレームに分けています。異なる元姿態は8種類、符号化フレームは9枚です。総再生時間とループ回数は保持しています。元素材の確認記録（以下のコマ数は元素材のもの）：元の先頭8コマを選択し、カメラを見る猫、片目のウインク、緑のRobinの帽子が落ちて収まる動きを使っています。猫が跳んで消える後半4コマは除外。元の8コマ版は2秒で1回再生し、シームレスループとはしていません。着地後の帽子のRobinは読み取れます。
  de: "Alle Sequenzen mit neun Frames in vier Kontaktbögen geprüft: Handlungsreihenfolge, Identität,
    Beschriftungen und Endposen erhalten. Diese Ausgabe verwendet archivierte GPT-Image-Quellpixel
    erneut; kein neuer Anbieteraufruf. Eine gehaltene Pose ist in zwei Frames aufgeteilt; acht
    unterschiedliche Quellposen, neun codierte Frames. Gesamtdauer und Wiedergabeanzahl erhalten.
    Ursprüngliche Quellprüfung (Frame-Anzahlen beschreiben nur die Quelle): Die ersten acht Zellen
    ausgewählt: Die Katze schaut zur Kamera, zwinkert mit einem Auge, dann fällt der grüne Hut mit
    Robin-Beschriftung herab und kommt zur Ruhe. Die letzten vier Zellen verworfen, weil die Katze
    springt/verschwindet. Das damals erstellte GIF mit acht Frames wird einmal für 2 Sekunden
    abgespielt; kein falscher Anspruch einer nahtlosen Schleife. Robin ist auf dem zur Ruhe
    gekommenen Hut lesbar."
  pt-BR: "Todas as sequências de nove quadros foram revisadas em quatro folhas de contato: ordem da
    ação, identidade, legendas e poses finais preservadas. Esta saída reutiliza os pixels de origem
    arquivados do GPT Image; não houve nova chamada ao provedor. Uma pose mantida é dividida em dois
    quadros; oito poses de origem distintas, nove quadros codificados. Duração total e número de
    reproduções preservados. Revisão original da fonte (as contagens de quadros descrevem apenas a
    fonte): Foram selecionadas as primeiras oito células: o gato olha para a câmera, pisca um olho
    e, em seguida, um chapéu verde com a inscrição Robin cai e se acomoda. As quatro células finais
    foram descartadas porque o gato salta ou desaparece. O GIF final de oito quadros reproduz uma
    vez por 2 segundos; não há falsa alegação de loop sem emendas. O texto Robin é legível no chapéu
    acomodado."
  es: "Se revisaron todas las secuencias de nueve fotogramas en cuatro hojas de contacto: se
    conservaron el orden de la acción, la identidad, los textos y las poses finales. Este resultado
    reutiliza los píxeles de origen archivados de GPT Image; no hubo nueva llamada al proveedor. Una
    pose mantenida se divide en dos fotogramas; ocho poses de origen distintas, nueve fotogramas
    codificados. Se conservaron la duración total y el número de reproducciones. Revisión original
    de la fuente (los recuentos de fotogramas describen solo la fuente): Se seleccionaron las
    primeras ocho celdas: el gato mira a cámara, guiña un ojo y después el sombrero verde con la
    etiqueta Robin cae y se posa. Se descartaron las cuatro celdas finales porque el gato salta o
    desaparece. El GIF final de ocho fotogramas se reproduce una vez durante 2 segundos; no se
    afirma falsamente que sea un bucle sin saltos. El texto Robin es legible en el sombrero posado."
  ko: "콘택트 시트 네 장에서 아홉 프레임으로 구성된 모든 시퀀스를 검토하여 동작 순서, 대상의 정체성, 문구와 마지막 자세가 유지됨을 확인했습니다. 이 결과는 보관된 GPT
    Image 원본 픽셀을 재사용하며 제공업체를 새로 호출하지 않았습니다. 유지되는 자세 하나를 두 프레임으로 나누어 서로 다른 원본 자세는 여덟 개, 인코딩된 프레임은 아홉
    개입니다. 전체 길이와 재생 횟수를 유지했습니다. 원본 검토 기록(프레임 수는 원본에만 해당): 처음 여덟 칸을 선택했습니다. 고양이가 카메라를 보고 한쪽 눈을 윙크한 뒤
    Robin 글자가 있는 초록 모자가 떨어져 자리를 잡습니다. 마지막 네 칸은 고양이가 뛰거나 사라져 제외했습니다. 최종 여덟 프레임 GIF는 2초 동안 한 번 재생하며
    매끄러운 반복이라고 잘못 주장하지 않습니다. 자리를 잡은 모자에서 Robin 글자를 읽을 수 있습니다."
  zh-Hant: 已在四張接觸印樣中核對全部九格序列：動作順序、身分、字幕與最終姿態均保留。本次輸出重用封存的 GPT Image
    來源像素，未再次呼叫供應商。一個停留姿態拆成兩個編碼格，八個不同來源姿態形成九個編碼格；總時長與播放次數保持不變。原始來源審查（以下格數僅描述來源版本）：選取前八格：貓看向鏡頭、眨一隻眼，之後標有
    Robin 的綠帽落下並停穩。最後四格因貓跳躍／消失而捨棄。原八格 GIF 播放一次，共兩秒；不宣稱無縫循環。帽子停穩後 Robin 文字可讀。
  fr: "Toutes les séquences de neuf images ont été examinées dans quatre planches-contact : ordre des
    actions, identité, légendes et poses finales conservés. Ce résultat réutilise les pixels sources
    GPT Image archivés ; aucun nouvel appel au fournisseur. Une pose maintenue est répartie sur deux
    images : huit poses sources distinctes, neuf images encodées. La durée totale et le nombre de
    lectures sont conservés. Examen de la source d’origine (les nombres d’images ne concernent que
    la source) : Huit premières cellules sélectionnées : le chat regarde la caméra, fait un clin
    d’œil, puis un chapeau vert marqué Robin tombe et se pose. Quatre dernières cellules écartées
    parce que le chat saute ou disparaît. Le GIF final de huit images est lu une fois en deux
    secondes ; aucune fausse revendication de boucle sans raccord. Robin est lisible sur le chapeau
    posé."
  it: "Tutte le sequenze di nove fotogrammi sono state esaminate in quattro provini: ordine delle
    azioni, identità, didascalie e pose finali conservati. Questo risultato riusa i pixel GPT Image
    archiviati; nessuna nuova chiamata al fornitore. Una posa mantenuta è divisa in due fotogrammi;
    otto pose originali distinte, nove fotogrammi codificati. Durata totale e numero di riproduzioni
    conservati. Revisione originale della fonte (i conteggi riguardano solo la fonte): selezionate
    le prime otto celle: il gatto guarda la camera, fa l’occhiolino, poi il cappello verde con
    etichetta Robin cade e si ferma. Scartate le ultime quattro celle perché il gatto salta o
    scompare. La GIF finale di otto fotogrammi si riproduce una volta per 2 secondi; nessuna falsa
    promessa di ciclo continuo. Il testo Robin è leggibile sul cappello fermo."
  ru: "Все последовательности из девяти кадров проверены на четырёх контактных листах: порядок
    действий, узнаваемость персонажей, подписи и финальные позы сохранены. Результат повторно
    использует пиксели архивного исходника GPT Image; нового обращения к сервису не было. Одна
    удерживаемая поза разделена на два кадра: восемь разных исходных поз, девять закодированных
    кадров. Общая длительность и число воспроизведений сохранены. Исходная проверка (число кадров
    относится только к исходнику): Выбраны первые восемь ячеек: кот смотрит в камеру, подмигивает
    одним глазом, затем зелёная шляпа с надписью Robin падает и останавливается. Последние четыре
    ячейки отброшены, поскольку кот подпрыгивает или исчезает. Итоговый GIF из восьми кадров
    воспроизводится один раз за 2 секунды; ложного заявления о бесшовном цикле нет. Надпись Robin
    читается на остановившейся шляпе."
  ar: "رُوجعت جميع التسلسلات ذات التسعة إطارات في أربع لوحات تجميع: حُفظ ترتيب الحركة والهوية والنصوص
    والوضعيات النهائية. تعيد هذه النتيجة استخدام بكسلات مصدر GPT Image المؤرشفة؛ ومن دون استدعاء
    جديد للمزوّد. تُقسَّم وضعية ثابتة واحدة على إطارين؛ ثماني وضعيات مصدر متميّزة وتسعة إطارات
    مرمّزة. حُفظت المدة الإجمالية وعدد مرات التشغيل. مراجعة المصدر الأصلية (تصف أعداد الإطارات
    المصدر وحده): اختيرت الخلايا الثماني الأولى: ينظر القط إلى الكاميرا ويغمز بعين واحدة، ثم تسقط
    القبعة الخضراء المكتوب عليها Robin وتستقر. استُبعدت الخلايا الأربع الأخيرة لأن القط يقفز أو
    يختفي. يُشغَّل GIF النهائي ذو الثمانية إطارات مرة واحدة لمدة ثانيتين؛ ومن دون ادعاء غير صحيح
    بحلقة سلسة. النص Robin مقروء على القبعة المستقرة."
