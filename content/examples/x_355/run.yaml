notes:
  en: "Reviewed all nine-frame sequences in four contact sheets: action order,
    identity, captions and final poses retained. This output reuses archived GPT
    Image source pixels; no new provider call. Nine chronological source poses
    selected. Total duration and playback count preserved. Original source
    review (frame counts describe source only): Ten gray hallway frames show
    approach, mannequin appearance, camera turn and fall, approach and pass,
    then empty tilted hallway. Play once, ten 500 ms frames, 5 seconds. Camera
    tilt and geometry are approximate drawn keyframes rather than a measured 3D
    camera simulation; documented adaptation limitation. Removed only 2px panel
    borders during extraction."
  zh-Hans: 灰色走廊与长臂人偶
  ja: 4枚の一覧画像ですべての9フレームの順序、人物の特徴、字幕、最終姿態を確認しました。保存済みのGPT
    Image素材を再利用し、新たな画像ツール呼び出しは行っていません。元素材から時系列順に9姿態を選びました。総再生時間とループ回数は保持しています。元素材の確認記録（以下のコマ数は元素材のもの）：元の10コマは接近、人形の出現、カメラの旋回と転倒、人形の接近と通過、傾いた無人の廊下の順です。元は各500msの10コマ、計5秒で1回再生します。カメラの傾きや形状は描かれた近似であり、計測された3Dカメラではありません。切り出し時に各コマの2pxの枠線だけを除きました。
  de: "Alle Sequenzen mit neun Frames in vier Kontaktbögen geprüft:
    Handlungsreihenfolge, Identität, Beschriftungen und Endposen erhalten. Diese
    Ausgabe verwendet archivierte GPT-Image-Quellpixel erneut; kein neuer
    Anbieteraufruf. Neun chronologische Quellposen ausgewählt. Gesamtdauer und
    Wiedergabeanzahl erhalten. Ursprüngliche Quellprüfung (Frame-Anzahlen
    beschreiben nur die Quelle): Zehn graue Flurframes zeigen Annäherung,
    Auftauchen einer Schaufensterpuppe, Kameradrehung und Sturz, Annäherung und
    Vorbeigehen, dann einen leeren geneigten Flur. Einmalige Wiedergabe, zehn
    Frames zu je 500 ms, 5 Sekunden. Kameraneigung und Geometrie sind
    angenäherte gezeichnete Schlüsselbilder statt einer gemessenen
    3D-Kamerasimulation; dokumentierte Adaptionsgrenze. Bei der Extraktion
    wurden nur 2px-Bildränder entfernt."
  pt-BR: "Todas as sequências de nove quadros foram revisadas em quatro folhas de
    contato: ordem das ações, identidade, legendas e poses finais preservadas.
    Este resultado reutiliza pixels de fontes arquivadas do GPT Image; não houve
    nova chamada ao provedor. Nove poses cronológicas da fonte selecionadas.
    Duração total e número de reproduções preservados. Revisão original da fonte
    (as contagens de quadros descrevem apenas a fonte): Dez quadros de corredor
    cinza mostram aproximação, surgimento do manequim, giro e queda da câmera,
    aproximação e passagem, e depois o corredor vazio inclinado. Reprodução
    única, dez quadros de 500 ms, 5 segundos. A inclinação da câmera e a
    geometria são quadros-chave desenhados aproximados, não uma simulação medida
    de câmera 3D; limitação documentada da adaptação. Apenas as bordas de 2 px
    dos quadros foram removidas na extração."
  es: "Se revisaron todas las secuencias de nueve fotogramas en cuatro hojas de
    contacto: se conservaron el orden de la acción, la identidad, los textos y
    las poses finales. Este resultado reutiliza los píxeles de origen archivados
    de GPT Image; no hubo nueva llamada al proveedor. Se seleccionaron nueve
    poses de origen cronológicas. Se conservaron la duración total y el número
    de reproducciones. Revisión original de la fuente (los recuentos de
    fotogramas describen solo la fuente): Diez fotogramas de pasillo gris
    muestran acercamiento, aparición de maniquí, giro y caída de cámara,
    acercamiento y paso, y después un pasillo vacío e inclinado. Se reproduce
    una vez, diez fotogramas de 500 ms, 5 segundos. La inclinación y la
    geometría de cámara son fotogramas clave dibujados aproximados, no una
    simulación medida de cámara 3D; limitación documentada de la adaptación.
    Durante la extracción solo se quitaron bordes de viñeta de 2px."
