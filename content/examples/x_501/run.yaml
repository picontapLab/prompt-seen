notes:
  en: The left panel shows the full stool and the triangular bite at its front-left edge. The right panel repeats the notch opening, grain direction and the leg directly below. The lighting on the end grain is darker than in the crop.
  zh-Hans: "木凳座面左前方的三角形缺口、木纹方向和正下方的凳腿均与原照对应。放大图里，缺口处的木材断面比原始裁片暗。"
  zh-Hant: "木凳座面左前方的三角形缺口、木紋方向和正下方的凳腿均與原照對應。放大圖裡，缺口處的木材斷面比原始裁圖暗。"
  es: "A la izquierda se ven el taburete entero y la muesca triangular en la parte delantera izquierda del asiento. A la derecha coinciden la abertura de la muesca, la dirección de la veta y la pata situada justo debajo. La madera expuesta en el corte se ve más oscura que en el recorte original."
  pt-BR: "À esquerda aparecem o banco inteiro e a lasca triangular na parte dianteira esquerda do assento. À direita, a abertura da lasca, a direção dos veios e o pé logo abaixo coincidem. A madeira exposta no corte fica mais escura do que no recorte original."
  de: "Links sind der ganze Hocker und die dreieckige Kerbe vorne links an der Sitzfläche zu sehen. Rechts stimmen die Öffnung der Kerbe, die Maserung und das Bein direkt darunter überein. Das freiliegende Hirnholz wirkt dunkler als im ursprünglichen Bildausschnitt."
  fr: "À gauche, on voit tout le tabouret et l’encoche triangulaire à l’avant gauche de l’assise. À droite, l’ouverture de l’encoche, le fil du bois et le pied juste en dessous concordent. Le bois de bout est plus sombre que sur le détail d’origine."
  ru: "Слева видны весь табурет и треугольный скол на переднем левом краю сиденья. Справа совпадают контур скола, направление волокон и положение ножки прямо под ним. Торец древесины выглядит темнее, чем на исходном фрагменте."
  ja: "左はスツール全体で、座面の左手前に三角形の欠けがあります。右の拡大図でも欠けの開き方、木目の向き、真下の脚の位置は一致します。欠けた部分の木口は元の切り抜きより暗く写っています。"
  ko: "왼쪽은 나무 스툴 전체와 좌판 왼쪽 앞의 삼각형 모양으로 깨진 부분입니다. 오른쪽에서도 깨진 부분의 벌어진 모양과 나뭇결 방향, 바로 아래 다리 위치가 일치합니다. 드러난 목재 단면은 원본을 잘라 낸 사진보다 어둡게 보입니다."
  it: "A sinistra si vedono lo sgabello intero e la scheggiatura triangolare sul bordo anteriore sinistro del sedile. A destra coincidono l’apertura della scheggiatura, la direzione delle venature e la gamba subito sotto. Il legno di testa appare più scuro rispetto al ritaglio originale."
  ar: "يظهر المقعد الخشبي كاملًا على اليسار مع ثلمة مثلثة في حافته الأمامية اليسرى. وفي التكبير على اليمين يتطابق شكل فتحة الثلمة واتجاه العروق وموضع الرِجل تحتها مباشرة. يبدو مقطع الخشب المكشوف أغمق مما هو عليه في القصاصة الأصلية."
