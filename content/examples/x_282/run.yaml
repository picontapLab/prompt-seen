notes:
  en: Vase changed from cream to cobalt blue, red markup removed. Jug, dried stems, tiles and window
    remain visually consistent; new glaze is glossier.
  zh-Hans: 花瓶由米色改为钴蓝，红圈已移除；玻璃壶、干燥枝条、墙砖和窗户保持视觉一致。
  ja: 花瓶をクリーム色からコバルトブルーに変え、赤い書き込みを除去しています。水差し、乾燥した茎、タイル、窓は見た目の一貫性を保っています。新しい釉薬はより光沢があります。
  de: Die Vase wurde von Creme zu Kobaltblau geändert, die rote Markierung entfernt. Krug, getrocknete
    Stängel, Fliesen und Fenster bleiben visuell konsistent; die neue Glasur glänzt stärker.
  pt-BR: Vaso alterado de creme para azul-cobalto, marcação vermelha removida. Jarra, hastes secas,
    azulejos e janela permanecem visualmente consistentes; o novo esmalte é mais brilhante.
  es: El jarrón cambió de crema a azul cobalto y se eliminó la marca roja. La jarra, los tallos secos,
    los azulejos y la ventana siguen siendo visualmente coherentes; el nuevo esmalte es más
    brillante.
  ko: 화병이 크림색에서 코발트색으로 바뀌었고 빨간 표시가 제거되었습니다. 물주전자, 마른 줄기, 타일과 창문은 시각적으로 일관되며, 새 유약은 더 광택이 납니다.
  zh-Hant: 花瓶由奶油色改為鈷藍，紅色標記已移除。水壺、乾枝、磁磚與窗戶在視覺上保持一致；新釉面更亮。
  fr: Vase passé du crème au bleu cobalt, annotation rouge supprimée. Pichet, tiges sèches, carreaux
    et fenêtre restent visuellement cohérents ; la nouvelle glaçure est plus brillante.
  it: Il vaso passa dal crema al blu cobalto e l’annotazione rossa viene rimossa. Brocca, steli
    secchi, piastrelle e finestra restano visivamente coerenti; il nuovo smalto è più lucido.
  ru: Цвет вазы изменён с кремового на кобальтовый, красная разметка убрана. Кувшин, сухие стебли,
    плитка и окно визуально согласованы с исходником; новая глазурь более глянцевая.
  ar: تغيّر لون المزهرية من كريمي إلى أزرق كوبالتي، وأُزيل التحديد الأحمر. يبقى الإبريق والسيقان
    الجافة والبلاط والنافذة متسقة بصريًا؛ والطلاء الزجاجي الجديد أشد لمعانًا.
observation:
  en: The vase changes from cream to cobalt blue and the red marking disappears. The jug, stems, tiles
