  it: Il vaso passa dal crema al blu cobalto e il segno rosso scompare. La brocca, gli steli, le
    piastrelle e la finestra restano riconoscibili.
  ru: Ваза стала кобальтово-синей вместо кремовой, красная отметка исчезла. Кувшин, стебли, плитка и
    окно остались узнаваемыми.
  ar: تغيّر لون المزهرية من الكريمي إلى الأزرق الكوبالتي واختفت العلامة الحمراء. بقي الإبريق والسيقان
    والبلاط والنافذة واضحة المعالم.
