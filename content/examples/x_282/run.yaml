  pt-BR: O vaso muda de creme para azul-cobalto e o traço vermelho desaparece. A jarra, as hastes, os
    azulejos e a janela continuam reconhecíveis.
  es: El jarrón pasa de crema a azul cobalto y desaparece la marca roja. La jarra, los tallos, los
    azulejos y la ventana siguen reconocibles.
  ko: 꽃병이 크림색에서 코발트블루로 바뀌고 빨간 표시가 사라집니다. 주전자, 줄기, 타일과 창문은 여전히 알아볼 수 있습니다.
  zh-Hant: 花瓶從米白色變成鈷藍色，紅色圈線消失。玻璃壺、枝條、牆磚和窗戶仍可辨認。
  fr: Le vase passe du crème au bleu cobalt et le repère rouge disparaît. La carafe, les tiges, les
