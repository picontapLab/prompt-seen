  zh-Hans: 花瓶从米色变为钴蓝色，红色圈线消失。玻璃壶、枝条、墙砖和窗户仍可辨认。
  ja: 花瓶がクリーム色からコバルトブルーに変わり、赤い印が消えました。ガラス容器、草茎、タイル、窓は見分けられます。
  de: Die Vase wechselt von Creme zu Kobaltblau, die rote Markierung verschwindet. Kanne, Stängel,
