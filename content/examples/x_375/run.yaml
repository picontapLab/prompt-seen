notes:
  en: "Reviewed all nine-frame sequences in four contact sheets: action order,
    identity, captions and final poses retained. This output reuses archived GPT
    Image source pixels; no new provider call. Nine chronological source poses
    selected. Total duration and playback count preserved. Original source
    review (frame counts describe source only): Twelve poses show upward tilt,
    quick downward nod and recovery with eyes closed. Plays once and holds final
    closed-eye frame. Fifth cell has drawn motion blur and small alignment
    drift."
  zh-Hans: 动漫角色点头闭眼
  ja: 4枚の一覧画像ですべての9フレームの順序、人物の特徴、字幕、最終姿態を確認しました。保存済みのGPT
    Image素材を再利用し、新たな画像ツール呼び出しは行っていません。元素材から時系列順に9姿態を選びました。総再生時間とループ回数は保持しています。元素材の確認記録（以下のコマ数は元素材のもの）：元の12姿態は顔を上げ、素早くうなずき、目を閉じて通常位置へ戻ります。1回再生して最後の閉じた目を保持します。元の5コマ目には描かれた動きのぼけと小さな位置ずれがあります。
  de: "Alle Sequenzen mit neun Frames in vier Kontaktbögen geprüft:
    Handlungsreihenfolge, Identität, Beschriftungen und Endposen erhalten. Diese
    Ausgabe verwendet archivierte GPT-Image-Quellpixel erneut; kein neuer
    Anbieteraufruf. Neun chronologische Quellposen ausgewählt. Gesamtdauer und
    Wiedergabeanzahl erhalten. Ursprüngliche Quellprüfung (Frame-Anzahlen
    beschreiben nur die Quelle): Zwölf Posen zeigen Aufwärtsneigung, schnelles
    Nicken nach unten und Erholung mit geschlossenen Augen. Wird einmal
    abgespielt und hält den letzten Frame mit geschlossenen Augen. Die fünfte
    Zelle hat gezeichnete Bewegungsunschärfe und leichte
    Ausrichtungsabweichungen."
  pt-BR: "Todas as sequências de nove quadros foram revisadas em quatro folhas de
    contato: ordem da ação, identidade, legendas e poses finais preservadas.
    Esta saída reutiliza os pixels de origem arquivados do GPT Image; não houve
    nova chamada ao provedor. Nove poses de origem selecionadas em ordem
    cronológica. Duração total e número de reproduções preservados. Revisão
    original da fonte (as contagens de quadros descrevem apenas a fonte): Doze
    poses mostram inclinação para cima, um rápido aceno para baixo e recuperação
    com os olhos fechados. Reproduz uma vez e mantém o quadro final com olhos
    fechados. A quinta célula tem desfoque de movimento desenhado e pequeno
    deslocamento de alinhamento."
  es: "Se revisaron todas las secuencias de nueve fotogramas en cuatro hojas de
    contacto: se conservaron el orden de la acción, la identidad, los textos y
    las poses finales. Este resultado reutiliza los píxeles de origen archivados
    de GPT Image; no hubo nueva llamada al proveedor. Se seleccionaron nueve
    poses de origen cronológicas. Se conservaron la duración total y el número
    de reproducciones. Revisión original de la fuente (los recuentos de
    fotogramas describen solo la fuente): Doce poses muestran inclinación hacia
    arriba, asentimiento rápido hacia abajo y recuperación con ojos cerrados. Se
    reproduce una vez y mantiene el fotograma final de ojos cerrados. La quinta
    celda tiene desenfoque de movimiento dibujado y un pequeño desplazamiento de
    alineación."
  ko: "콘택트 시트 네 장에서 아홉 프레임으로 구성된 모든 시퀀스를 검토하여 동작 순서, 대상의 정체성, 문구와 마지막 자세가 유지됨을
    확인했습니다. 이 결과는 보관된 GPT Image 원본 픽셀을 재사용하며 제공업체를 새로 호출하지 않았습니다. 시간순 원본 자세 아홉
    개를 선택했습니다. 전체 길이와 재생 횟수를 유지했습니다. 원본 검토 기록(프레임 수는 원본에만 해당): 자세 열두 개에 눈을 감은 채
    위로 고개 들기, 빠르게 아래로 끄덕이기와 복귀가 나타납니다. 한 번 재생한 뒤 눈을 감은 마지막 프레임을 유지합니다. 다섯 번째 칸에는
    그려 넣은 모션 블러와 작은 정렬 흔들림이 있습니다."
