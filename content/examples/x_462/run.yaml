notes:
  en: A 12-frame cassette loop keeps the label and shell stable while the reels move.
  zh-Hans: 磁带卷轴 12 帧循环，标签与外壳保持稳定
  es: Un bucle de casete de 12 fotogramas mantiene estable la etiqueta y la carcasa mientras se mueven los carretes.
  pt-BR: Um loop de fita de 12 quadros mantém o rótulo e a carcaça estáveis enquanto os carretéis se movem.
  ja: 12フレームのカセットループで、リールだけが動きラベルと外装は安定します。
  ko: 12프레임 카세트 루프에서 릴만 움직이고 라벨과 케이스는 안정적으로 유지됩니다.
  de: Ein Kassettenloop mit 12 Bildern hält Etikett und Gehäuse stabil, während sich die Spulen bewegen.
  fr: Une boucle de cassette en 12 images garde l’étiquette et le boîtier fixes pendant que les bobines tournent.
  ru: В 12-кадровом цикле кассеты этикетка и корпус неподвижны, а катушки вращаются.
  zh-Hant: 12 幀卡帶循環中標籤與外殼固定，只有捲軸移動。
  it: Un loop di cassetta di 12 fotogrammi mantiene fermi etichetta e involucro mentre ruotano le bobine.
  ar: تحافظ حلقة الكاسيت ذات 12 إطاراً على ثبات الملصق والهيكل بينما تتحرك البكرات.
observation:
  en: The two spools turn inside the clear cassette while the C-60 label and shell remain visually
    stable.
  zh-Hans: 两个卷轴在透明磁带盒里转动，C-60 标签和外壳的视觉位置保持稳定。
  ja: 透明なカセットの中で 2 つのリールが回転しても、C-60 ラベルとケースは見た目の位置を保ちます。
  de: Die beiden Spulen drehen sich in der transparenten Kassette. C-60-Etikett und Gehäuse bleiben
    optisch stabil.
  pt-BR: As duas bobinas giram dentro do cassete transparente, enquanto o rótulo C-60 e a carcaça
    ficam visualmente estáveis.
  es: Los dos carretes giran dentro del casete transparente. La etiqueta C-60 y la carcasa se
    mantienen visualmente estables.
  ko: 투명 카세트 안의 릴 두 개가 돌아가는 동안 C-60 라벨과 외장은 시각적으로 안정적입니다.
  zh-Hant: 兩個捲軸在透明卡帶內轉動，C-60 標籤與外殼的視覺位置維持穩定。
  fr: Les deux bobines tournent dans la cassette transparente. L’étiquette C-60 et la coque restent
    visuellement stables.
  it: Le due bobine girano nella cassetta trasparente mentre l’etichetta C-60 e il guscio restano
