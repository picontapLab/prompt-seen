notes:
  en: Restored synthetic archival portrait retains face, clothing and room with subdued color; no
    claim of a real historical photo.
  zh-Hans: 减轻划痕与褪色，同时保持原始场景可辨认。
  ja: 生成した古い写真風のポートレートを修復し、顔、服装、室内を控えめな色で保っています。実在する歴史写真だとはしていません。
  de: Das restaurierte künstlich erzeugte Archivporträt bewahrt Gesicht, Kleidung und Raum mit
    zurückhaltenden Farben; kein Anspruch, ein echtes historisches Foto zu sein.
  pt-BR: O retrato de arquivo sintético restaurado preserva rosto, roupas e ambiente com cores
    discretas; não há alegação de que seja uma foto histórica real.
  es: El retrato de archivo sintético restaurado conserva el rostro, la ropa y la habitación con color
    tenue; no se afirma que sea una fotografía histórica real.
  ko: 복원한 합성 옛 사진풍 인물 이미지에서 얼굴, 의상과 방을 절제된 색상으로 유지했습니다. 실제 역사 사진이라고 주장하지 않습니다.
  zh-Hant: 修復後的合成檔案風格人像保留臉部、服裝與房間，配色柔和；不宣稱這是真實歷史照片。
  fr: Le portrait d’archives synthétique restauré conserve le visage, les vêtements et la pièce dans
    des couleurs discrètes ; il n’est pas présenté comme une véritable photographie historique.
  it: Il ritratto d’archivio sintetico restaurato conserva viso, abiti e stanza con colori tenui; non
    si afferma che sia una vera foto storica.
  ru: Восстановленный синтетический архивный портрет сохраняет лицо, одежду и комнату в приглушённых
