  ar: يحافظ ترميم البورتريه الأرشيفي الاصطناعي على الوجه والملابس والغرفة بألوان هادئة؛ دون ادعاء أنه
    صورة تاريخية حقيقية.
observation:
  en: Scratches fade and muted color returns. The seated subject, clothing and window-side setting
    remain recognizable.
  zh-Hans: 划痕淡去，画面出现柔和色彩。坐姿、衣着和窗边场景仍可辨认。
  ja: 傷が薄れ、落ち着いた色が戻りました。腰掛けた人物、服、窓辺の背景は引き続き識別できます。
  de: Kratzer verblassen und dezente Farben kehren zurück. Die sitzende Person, Kleidung und Umgebung
    am Fenster bleiben erkennbar.
  pt-BR: Os riscos diminuem e as cores suaves voltam. A pessoa sentada, a roupa e o cenário junto à
    janela continuam reconhecíveis.
  es: Los arañazos se atenúan y vuelve el color suave. La persona sentada, la ropa y la escena junto a
    la ventana siguen siendo reconocibles.
  ko: 긁힌 자국이 옅어지고 은은한 색이 돌아옵니다. 앉은 인물과 옷, 창가 배경은 여전히 알아볼 수 있습니다.
  zh-Hant: 刮痕淡去，畫面出現柔和色彩。坐姿人物、衣著及窗邊場景仍可辨認。
  fr: Les rayures s’atténuent et des couleurs douces réapparaissent. La personne assise, les vêtements
    et le décor près de la fenêtre restent reconnaissables.
  it: I graffi si attenuano e tornano colori tenui. La persona seduta, gli abiti e l’ambiente vicino
    alla finestra rimangono riconoscibili.
  ru: Царапины стали менее заметны, появились приглушённые цвета. Сидящий человек, одежда и обстановка
    у окна остались узнаваемыми.
  ar: تخفّ الخدوش وتظهر ألوان هادئة، مع بقاء الشخص الجالس وملابسه والمشهد بجانب النافذة واضحة المعالم.
