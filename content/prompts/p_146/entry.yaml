annotations:
  - phrase: a clean 4-by-4 grid
    region:
      x: 0.01
      y: 0.26
      w: 0.98
      h: 0.23
    note:
      en: The explicit grid fixes the sticker count and reading order.
      zh-Hans: 明确四行四列，控制贴纸数量和配文阅读顺序。
      ja: 明示したグリッドが、ステッカーの数と読む順番を決めています。
      de: Das explizit vorgegebene Raster legt Stickeranzahl und Leserichtung fest.
      pt-BR: A grade explícita define a quantidade de figurinhas e a ordem de leitura.
      es: La cuadrícula explícita fija el número de pegatinas y el orden de lectura.
      ko: 명시적인 격자가 스티커 개수와 읽는 순서를 고정합니다.
      zh-Hant: 明確的網格固定貼紙數量和閱讀順序。
      fr: La grille explicite fixe le nombre d’autocollants et l’ordre de lecture.
      it: La griglia esplicita fissa il numero degli adesivi e l’ordine di lettura.
      ru: Явная сетка фиксирует число стикеров и порядок чтения.
      ar: تحدّد الشبكة الصريحة عدد الملصقات اللاصقة وترتيب قراءتها.
  - phrase: face, hairstyle, outfit and colors consistent
    region:
      x: 0.01
      y: 0.01
      w: 0.24
      h: 0.23
    note:
      en: Identity and clothing stay consistent across the sixteen emotions.
      zh-Hans: 统一面部、发型与服装，让十六种表情保持同一个角色。
      ja: 16 種類の感情を通して、人物の特徴と服装を統一しています。
      de: Identität und Kleidung bleiben über die sechzehn Emotionen hinweg konsistent.
      pt-BR: A identidade e as roupas permanecem consistentes ao longo das dezesseis emoções.
      es: La identidad y la ropa se mantienen coherentes a través de las dieciséis emociones.
      ko: 열여섯 감정에서 인물 정체성과 의상이 일관되게 유지됩니다.
      zh-Hant: 統一面部、髮型與服裝，讓十六種表情保持同一個角色。
      fr: L’identité et les vêtements restent cohérents d’une émotion à l’autre, sur les seize images.
      it: Identità e abbigliamento restano coerenti nelle sedici emozioni.
      ru: Узнаваемость персонажа и одежда сохраняются во всех шестнадцати эмоциях.
      ar: تبقى الهوية والملابس متسقتين عبر الحالات الشعورية الست عشرة.
  - phrase: sleepiness
    region:
      x: 0.01
      y: 0.25
      w: 0.23
      h: 0.22
    note:
      en: "Closed eyes and blue Zs mark the sleepy sticker."
      zh-Hans: "闭眼和蓝色的 Z 表现出困意。"
      zh-Hant: "閉眼和藍色的 Z 表現出睏意。"
      ja: "閉じた目と青い Z が眠気を表しています。"
      ko: "감은 눈과 파란 Z가 졸음을 나타냅니다."
      de: "Geschlossene Augen und blaue Z zeigen Müdigkeit."
      es: "Los ojos cerrados y las zetas azules indican sueño."
      pt-BR: "Os olhos fechados e as letras Z azuis indicam sono."
      fr: "Les yeux fermés et les Z bleus évoquent le sommeil."
      it: "Gli occhi chiusi e le Z blu suggeriscono sonnolenza."
      ru: "Закрытые глаза и синие буквы Z передают сонливость."
      ar: "تدل العينان المغمضتان وحروف Z الزرقاء على النعاس."
