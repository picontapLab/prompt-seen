      zh-Hans: 色条为活动名称预留位置；直接要求文字常常会生成乱码。
      ja: 帯でイベント名の場所を確保します。文字そのものを求めると崩れがちです。
      ar: الأشرطة تحجز مكان اسم الفعالية؛ طلب نص حقيقي يخرج مشوهًا غالبًا.
      de: Balken halten Platz für den Veranstaltungsnamen frei; angeforderter echter
