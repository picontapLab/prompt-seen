    note:
      en: The largest shape anchors the upper right and sets the warm accent.
      zh-Hans: 最大的图形压住右上角，定下暖色重点。
      ja: 最も大きな形が右上を支え、暖色のアクセントを決めます。
      ar: أكبر شكل يثبّت الزاوية العلوية اليمنى ويحدد اللون الدافئ.
      de: Die größte Form verankert die Komposition oben rechts und setzt den warmen
        Farbakzent.
      pt-BR: A maior forma ancora o canto superior direito e define o destaque quente.
      es: La forma más grande ancla la zona superior derecha y establece el acento
        cálido.
      ko: 가장 큰 도형이 오른쪽 위를 잡아 주고 따뜻한 포인트 색을 정합니다.
  - phrase: a thin teal arc
    region:
      x: 0.03
      y: 0.08
      w: 0.52
      h: 0.39
    note:
      en: “Thin” keeps the arc a line, so it adds motion without a second heavy shape.
      zh-Hans: “细”让弧线保持为线条，增加动感而不多出一块重色。
      ja: 「Thin（細い）」の指定で弧が線にとどまり、重い形をもうひとつ増やすことなく動きが出ます。
      ar: كلمة “رفيع” تُبقي القوس خطًا يضيف حركة دون شكل ثقيل آخر.
      de: „Dünn“ hält den Bogen linienförmig. So bringt er Bewegung ins Bild, ohne
        eine zweite schwere Form zu erzeugen.
      pt-BR: “Thin” mantém o arco como uma linha, acrescentando movimento sem uma
        segunda forma pesada.
      es: «Thin» mantiene el arco como una línea, aportando movimiento sin una
        segunda forma pesada.
      ko: “Thin”은 호를 선 형태로 유지하여 두 번째 무거운 도형을 만들지 않고 움직임을 더합니다.
  - phrase: a red half circle
    region:
      x: 0
      y: 0.448
      w: 0.53
      h: 0.335
    note:
      en: A half circle on the left balances the disc on the right.
      zh-Hans: 左侧的半圆与右侧的圆盘形成平衡。
      ja: 左の半円が右の円と釣り合います。
