      ko: 왼쪽 반원이 오른쪽 원판과 균형을 이룹니다.
  - phrase: a grid of small grey dots
    region:
      x: 0.63
      y: 0.645
      w: 0.34
      h: 0.245
    note:
      en: A quiet texture that fills the lower right without competing.
      zh-Hans: 安静的纹理填补右下角，又不抢戏。
      ja: 右下を埋める控えめな質感で、主役と競いません。
