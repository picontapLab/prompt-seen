      inglês.
    es: Sube primero el retrato de la primera persona adulta y después el de la
      segunda. La imagen 1 permanece a la izquierda y la imagen 2 a la derecha.
      La demostración usa personas ficticias generadas por IA. Conserva todos
      los textos en inglés.
    ko: 첫 번째 성인 인물 사진을 먼저, 두 번째 성인 인물 사진을 다음에 업로드하세요. 이미지 1은 왼쪽, 이미지 2는 오른쪽을 유지합니다.
      시연에는 AI로 생성한 가상 인물을 사용합니다. 모든 글자는 영어로 유지하세요.
