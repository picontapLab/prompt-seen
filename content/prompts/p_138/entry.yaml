  instructions:
    en: Upload one old photo. Our before image is a synthetic aged photograph, not a real family
      archive.
    zh-Hans: 待修复的旧照片
    ja: 古い写真を 1 枚アップロードしてください。この作例の修復前画像は、古びた写真として生成したもので、実際の家族の記録写真ではありません。
    de: Lade ein altes Foto hoch. Unser Vorher-Bild ist ein künstlich gealtertes, generiertes Foto, kein
      echtes Familienarchiv.
    pt-BR: Envie uma foto antiga. Nossa imagem anterior à restauração é uma fotografia envelhecida
      sinteticamente, não um arquivo familiar real.
    es: Sube una foto antigua. Nuestra imagen inicial es una fotografía envejecida sintética, no un
      archivo familiar real.
    ko: 오래된 사진 한 장을 업로드하세요. 보정 전 이미지는 실제 가족 기록이 아닌 합성한 오래된 사진입니다.
    zh-Hant: 上傳一張老照片。本例是合成的仿舊圖片，並非真實的家庭檔案。
    fr: Importez une photo ancienne. Notre image avant restauration est une photographie vieillie
      synthétique, pas une véritable archive familiale.
    it: Carica una vecchia foto. L’immagine iniziale del nostro esempio è una fotografia invecchiata
      sintetica, non un vero documento di famiglia.
    ru: Загрузите одну старую фотографию. Наш исходник — синтетически состаренная фотография, а не
      настоящий семейный архив.
    ar: ارفع صورة قديمة واحدة. صورة «قبل» لدينا صورة اصطناعية أُضفي عليها طابع القِدم، وليست من أرشيف
      عائلي حقيقي.
