  - phrase: a clear crystal sphere
    region:
      x: 0.25
      y: 0.02
      w: 0.5
      h: 0.5
    note:
      en: A single glass sphere frames the miniature world and gives it a clear boundary.
      zh-Hans: 用一只透明球体框住微缩世界，让边界清楚可见。
      ja: ひとつのガラス球がミニチュアの世界を囲み、明確な境界を与えています。
      de: Eine einzelne Glaskugel rahmt die Miniaturwelt und gibt ihr eine klare Grenze.
      pt-BR: Uma única esfera de vidro emoldura o mundo em miniatura e lhe dá um limite claro.
      es: Una única esfera de vidrio enmarca el mundo en miniatura y le da un límite claro.
      ko: 유리 구 하나가 작은 세계를 감싸며 명확한 경계를 만듭니다.
      zh-Hant: 用一隻透明球體框住微縮世界，讓邊界清楚可見。
      fr: Une sphère de verre unique encadre le monde miniature et lui donne une limite nette.
      it: Un’unica sfera di vetro incornicia il mondo in miniatura e gli dà un confine chiaro.
  - phrase: cascades over the table edge
    region:
      x: 0.56
      y: 0.54
      w: 0.36
      h: 0.45
    note:
      en: The waterfall crosses the tabletop and joins the two scales.
      zh-Hans: 瀑布越过桌边，把微缩景观与房间连接起来。
      ja: 滝がテーブルの上を横切り、2 つのスケールの世界をつないでいます。
      de: Der Wasserfall überquert die Tischplatte und verbindet die beiden Maßstäbe.
      pt-BR: A cachoeira atravessa o tampo da mesa e une as duas escalas.
      es: La cascada cruza la superficie de la mesa y une las dos escalas.
      ko: 폭포가 탁자를 가로질러 두 크기의 세계를 연결합니다.
      zh-Hant: 瀑布越過桌邊，把微縮景觀與房間連接起來。
      fr: La cascade traverse le plateau de la table et relie les deux échelles.
      it: La cascata attraversa il piano del tavolo e unisce le due scale.
