    note:
      en: The count sets the rhythm across the scroll; five stays open.
      zh-Hans: 数量决定长卷的节奏，五根恰好留有空隙。
      ja: 本数が絵巻のリズムを決めます。五本なら余白が残ります。
      ar: العدد يحدد إيقاع اللوحة؛ خمس سيقان تترك مساحة مفتوحة.
  - phrase: drifting leaves
    region:
      x: 0.05
      y: 0.03
      w: 0.8
      h: 0.75
    note:
      en: “Drifting” turns stiff leaf clusters into loose, overlapping sprays.
      zh-Hans: “飘落”让僵硬的叶簇变成松散交叠的枝叶。
      ja: 「舞う」の一語で、硬い葉の塊がゆるく重なる葉に変わります。
      ar: كلمة “متطايرة” تحوّل عناقيد الأوراق الجامدة إلى أوراق متداخلة.
  - phrase: a small red artist's seal
    region:
