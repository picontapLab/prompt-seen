      y: 0.09
      w: 0.04
      h: 0.085
    note:
      en: The only colour in the image; it marks where the eye ends.
      zh-Hans: 画面里唯一的颜色，标出视线的终点。
      ja: 画面で唯一の色が、視線の終わる場所を示します。
      ar: اللون الوحيد في الصورة، ويحدد أين تنتهي العين.
