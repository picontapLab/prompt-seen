    note:
      en: Dry brush gives the branch its rough, broken edge.
      zh-Hans: “枯笔”让枝干出现粗糙、断续的边缘。
      ja: 「Dry brush（かすれた筆致）」の指定で、枝の縁が荒く途切れた表現になります。
      ar: ضربات الفرشاة الجافة تعطي الغصن حافته الخشنة المتقطعة.
      de: Der trockene Pinsel verleiht dem Zweig seine raue, unterbrochene Kontur.
      pt-BR: O pincel seco dá ao galho uma borda áspera e irregular.
      es: El pincel seco da a la rama un borde áspero y discontinuo.
  - phrase: pink plum blossoms clustered along the branch
    region:
      x: 0.255
      y: 0.22
      w: 0.16
      h: 0.24
    note:
      en: Placing the blossoms along the branch keeps them off the empty paper.
      zh-Hans: 把梅花放在枝条上，空白处就不会被花朵占满。
      ja: 花を枝沿いに置くことで、余白に花が散らばりません。
      ar: وضع الأزهار على طول الغصن يُبقي الورق الفارغ نظيفًا.
      de: Die Platzierung der Blüten entlang des Zweigs hält die freie Papierfläche
        leer.
      pt-BR: Posicionar as flores ao longo do galho mantém o papel vazio livre delas.
      es: Situar las flores a lo largo de la rama evita que ocupen el papel vacío.
  - phrase: a small red seal in the upper right corner
    region:
      x: 0.92
      y: 0.058
      w: 0.055
      h: 0.09
    note:
      en: Naming the corner keeps the seal away from the branch.
      zh-Hans: 写明角落，印章就不会压在枝条上。
      ja: 角を指定すると、印が枝に重なりません。
      ar: تحديد الزاوية يُبعد الختم عن الغصن.
      de: Die genaue Angabe der Ecke hält das Siegel vom Zweig fern.
      pt-BR: Especificar o canto mantém o selo longe do galho.
      es: Indicar la esquina mantiene el sello alejado de la rama.
