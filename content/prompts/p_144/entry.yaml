    en: Upload the adult portrait first and costume second. Both inputs are synthetic; the costume is a
      modern fictional design.
    zh-Hans: 人物照片和服饰参考
    ja: 成人のポートレートを先に、衣装を次にアップロードしてください。どちらも生成した入力画像で、衣装は現代の架空のデザインです。
    de: Lade zuerst das Erwachsenenporträt und danach das Kostüm hoch. Beide Eingaben sind künstlich
      erzeugt; das Kostüm ist ein moderner fiktiver Entwurf.
    pt-BR: Envie primeiro o retrato da pessoa adulta e depois o traje. As duas entradas são sintéticas;
      o traje é um design fictício moderno.
    es: Sube primero el retrato adulto y después el vestuario. Ambas entradas son sintéticas; el
      vestuario es un diseño moderno ficticio.
    ko: 성인 인물 사진을 먼저, 의상 이미지를 다음에 업로드하세요. 두 입력 모두 합성 이미지이며 의상은 현대적인 가상 디자인입니다.
    zh-Hant: 先上傳成年人的人像照片，再上傳服裝參考圖片。兩張輸入圖片均為合成；服裝是現代虛構設計。
    fr: Importez d’abord le portrait d’adulte, puis le costume. Les deux entrées sont synthétiques ; le
      costume est une création fictive moderne.
    it: Carica prima il ritratto dell’adulto e poi il costume. Entrambi gli input sono sintetici; il
      costume è un modello moderno immaginario.
    ru: Сначала загрузите портрет взрослого, затем костюм. Оба изображения синтетические; костюм —
      современный вымышленный дизайн.
    ar: ارفع بورتريه الشخص البالغ أولًا، ثم صورة الزي. المدخلان اصطناعيان؛ والزي تصميم خيالي حديث.
