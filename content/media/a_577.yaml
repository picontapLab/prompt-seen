alt:
  en: A 16-bit sunglasses-wearing golden retriever gives two thumbs-up as pixel stars pop and disappear.
  zh-Hans: 16-bit 戴墨镜金毛双手点赞，像素星星弹出消失
  es: Un golden retriever de 16 bits con gafas de sol hace dos pulgares arriba mientras aparecen y desaparecen estrellas pixeladas.
  pt-BR: Um golden retriever 16-bit de óculos escuros faz dois sinais de positivo enquanto estrelas pixeladas aparecem e somem.
  ja: サングラス姿の16ビットのゴールデンレトリバーが両手で親指を立て、ドットの星が現れて消えます。
  ko: 선글라스를 쓴 16비트 골든 리트리버가 양손 엄지척을 하고 픽셀 별이 나타났다 사라집니다.
  de: Ein Golden Retriever im 16-Bit-Stil zeigt mit beiden Daumen nach oben, während Pixelsterne erscheinen und verschwinden.
  fr: Un golden retriever 16 bits portant des lunettes fait deux pouces levés pendant que des étoiles pixelisées apparaissent puis disparaissent.
  ru: Золотистый ретривер в очках в стиле 16 бит показывает два больших пальца, а пиксельные звёзды появляются и исчезают.
  zh-Hant: 戴墨鏡的 16-bit 金毛雙手比讚，像素星星出現後消失。
  it: Un golden retriever a 16 bit con occhiali da sole mostra due pollici in su mentre appaiono e scompaiono stelle pixelate.
