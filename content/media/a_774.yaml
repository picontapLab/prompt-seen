alt:
  en: A restorer in a blue apron holds a yellow desk lamp at right. Cream lettering fills the left side of the teal cover. Why fix this lamp? — Bench Notes · Ep. 04
  zh-Hans: 蓝绿色横幅右侧，穿蓝围裙的修复师托着黄色台灯，米白色标题排在左侧。 Why fix this lamp? — Bench Notes · Ep. 04
  es: Sobre un fondo verde azulado, un restaurador con delantal azul sostiene una lámpara amarilla a la derecha del título crema. Why fix this lamp? — Bench Notes · Ep. 04
  pt-BR: À direita do título em creme, um restaurador de avental azul segura uma luminária amarela contra o fundo verde-azulado. Why fix this lamp? — Bench Notes · Ep. 04
  ja: 青緑の横長の表紙。右側で青いエプロンの修理職人が黄色い卓上ランプを手にし、左側にクリーム色の見出しがある。 Why fix this lamp? — Bench Notes · Ep. 04
  ko: 청록색 가로 표지 오른쪽에서 파란 앞치마를 입은 수리공이 노란 탁상등을 들고 있다. 왼쪽은 크림색 제목이 채운다. Why fix this lamp? — Bench Notes · Ep. 04
  de: Rechts hält ein Restaurator mit blauer Schürze eine gelbe Schreibtischlampe. Links steht die cremefarbene Überschrift auf blaugrünem Grund. Why fix this lamp? — Bench Notes · Ep. 04
  fr: Sur fond bleu-vert, un restaurateur en tablier bleu tient une lampe jaune à droite du titre crème. Why fix this lamp? — Bench Notes · Ep. 04
  ru: Справа от кремового заголовка на сине-зелёном фоне мастер в синем фартуке держит жёлтую настольную лампу. Why fix this lamp? — Bench Notes · Ep. 04
  it: Su fondo verde petrolio, un restauratore con grembiule blu regge una lampada gialla a destra del titolo color crema. Why fix this lamp? — Bench Notes · Ep. 04
  ar: يحمل مصلح يرتدي مئزرا أزرق مصباح مكتب أصفر على يمين غلاف أفقي بلون أزرق مخضر، ويملأ العنوان الكريمي الجانب الأيسر. Why fix this lamp? — Bench Notes · Ep. 04
  zh-Hant: 藍綠色橫幅右側，穿藍圍裙的修復師托著黃色檯燈，米白色標題排在左側。 Why fix this lamp? — Bench Notes · Ep. 04
