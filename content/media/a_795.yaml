alt:
  en: "A red paper fox with a white tip on its left ear looks down at a blue bookmark beside a closed book. あれ、しおりだ。 · 机のすみに青い一枚。"
  zh-Hans: "红色纸狐狸低头看桌上的蓝书签，旁边是合上的书；白色耳尖在狐狸自己的左侧。 あれ、しおりだ。 · 机のすみに青い一枚。"
  es: "El zorro de papel rojo mira el marcapáginas azul sobre la mesa, junto al libro cerrado. La punta blanca está en su oreja izquierda. あれ、しおりだ。 · 机のすみに青い一枚。"
  pt-BR: "A raposa de papel vermelha olha para o marcador azul na mesa, ao lado do livro fechado. A ponta branca é a da orelha esquerda da raposa. あれ、しおりだ。 · 机のすみに青い一枚。"
  ja: "赤い紙のキツネが机の青いしおりを見下ろし、横には閉じた本がある。白い耳先はキツネ自身の左側。 あれ、しおりだ。 · 机のすみに青い一枚。"
  ko: "빨간 종이 여우가 덮인 책 옆에 놓인 파란 책갈피를 내려다본다. 흰 귀 끝은 여우 자신의 왼쪽에 있다. あれ、しおりだ。 · 机のすみに青い一枚。"
  de: "Der rote Papierfuchs blickt auf das blaue Lesezeichen neben dem geschlossenen Buch. Die weiße Spitze sitzt an seinem linken Ohr. あれ、しおりだ。 · 机のすみに青い一枚。"
  fr: "Le renard en papier rouge regarde le marque-page bleu sur la table à côté du livre fermé. C’est son oreille gauche qui a la pointe blanche. あれ、しおりだ。 · 机のすみに青い一枚。"
  ru: "Красный бумажный лис смотрит на синюю закладку на столе рядом с закрытой книгой. Белый кончик у него на левом ухе. あれ、しおりだ。 · 机のすみに青い一枚。"
  it: "La volpe di carta rossa guarda il segnalibro blu sulla scrivania accanto al libro chiuso. La punta bianca è sul suo orecchio sinistro. あれ、しおりだ。 · 机のすみに青い一枚。"
  ar: "ينظر الثعلب الورقي الأحمر إلى العلامة الزرقاء على الطاولة بجوار الكتاب المغلق. الطرف الأبيض على أذنه اليسرى. あれ、しおりだ。 · 机のすみに青い一枚。"
  zh-Hant: "紅色紙狐狸低頭看著桌上的藍色書籤，旁邊是闔上的書，白色耳尖在狐狸自己的左側。 あれ、しおりだ。 · 机のすみに青い一枚。"
