alt:
  en: An ivory mug with a square handle and a single cobalt stroke sits below two lines of navy type. The Tide Mug — Studio release 01
  zh-Hans: 象牙白杯子放在两行深蓝字下方，方形杯柄朝右，杯口下有一道钴蓝笔触。 The Tide Mug — Studio release 01
  es: Una taza marfil con asa cuadrada y un trazo azul cobalto aparece debajo de dos líneas de texto azul marino. The Tide Mug — Studio release 01
  pt-BR: Uma caneca marfim com alça quadrada e um traço azul-cobalto fica abaixo de duas linhas em azul-marinho. The Tide Mug — Studio release 01
  ja: 紺色の文字二行の下に、角形の取っ手とコバルトブルーの筆跡が一つあるアイボリーのマグが置かれている。 The Tide Mug — Studio release 01
  ko: 남색 문구 두 줄 아래에 각진 손잡이와 코발트색 붓 자국 하나가 있는 상아색 머그가 놓여 있다. The Tide Mug — Studio release 01
  de: Unter zwei dunkelblauen Textzeilen steht ein elfenbeinfarbener Becher mit eckigem Henkel und einem kobaltblauen Pinselstrich. The Tide Mug — Studio release 01
  fr: Une tasse ivoire à anse carrée, ornée d’un trait bleu cobalt, se trouve sous deux lignes bleu marine. The Tide Mug — Studio release 01
  ru: Под двумя тёмно-синими строками стоит кружка цвета слоновой кости с прямоугольной ручкой и одним кобальтовым мазком. The Tide Mug — Studio release 01
  it: Una tazza color avorio con manico squadrato e un tratto blu cobalto è posta sotto due righe blu scuro. The Tide Mug — Studio release 01
  ar: تحت سطرين بالأزرق الداكن يظهر كوب عاجي بمقبض مربع وضربة فرشاة واحدة باللون الأزرق الكوبالتي. The Tide Mug — Studio release 01
  zh-Hant: 象牙白杯子放在兩行深藍字下方，方形杯把朝右，杯口下有一道鈷藍筆觸。 The Tide Mug — Studio release 01
