alt:
  en: Honey jar with a gold lid and a cream HONEY label beneath a bee mark, surrounded by citrus fruit.
  zh-Hans: 金色罐盖的蜂蜜罐带米白标签，蜜蜂图案下写有 HONEY，周围有柑橘。
  ja: 金色の蓋が付いた蜂蜜瓶。クリーム色のラベルにはハチの印と HONEY の文字があり、周りにかんきつ類がある。
  de: Honigglas mit goldenem Deckel und cremefarbenem HONEY-Etikett mit Bienenzeichen, umgeben von
    Zitrusfrüchten.
  pt-BR: Pote de mel com tampa dourada e rótulo creme com a palavra HONEY sob uma abelha, cercado por
    frutas cítricas.
  es: Tarro de miel con tapa dorada y etiqueta crema que dice HONEY bajo una abeja, rodeado de
    cítricos.
  ko: 금색 뚜껑과 크림색 라벨이 있는 꿀병. 벌 아이콘 아래 HONEY가 적혀 있고 주변에 감귤류가 있습니다.
  zh-Hant: 金色瓶蓋的蜂蜜瓶帶米白標籤，蜜蜂圖案下寫有 HONEY，四周有柑橘。
  fr: Pot de miel au couvercle doré et à l’étiquette crème avec HONEY sous un symbole d’abeille,
    entouré d’agrumes.
  it: Vasetto di miele con coperchio dorato ed etichetta crema con la scritta HONEY sotto un’ape,
    circondato da agrumi.
  ru: Банка мёда с золотистой крышкой и кремовой этикеткой с надписью HONEY под значком пчелы, вокруг
    цитрусовые.
  ar: مرطبان عسل بغطاء ذهبي وملصق كريمي يحمل كلمة HONEY أسفل رمز نحلة، وحوله ثمار حمضية.
