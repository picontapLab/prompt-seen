  es: En un retrato de cerca, el restaurador sujeta la lámpara amarilla con ambas manos sobre dos líneas de letra estrecha color crema. Meet the restorer — Bench Notes · Ep. 04
  pt-BR: Em um retrato de perto, o restaurador segura a luminária amarela com as duas mãos, acima de duas linhas em letras estreitas cor de creme. Meet the restorer — Bench Notes · Ep. 04
  ja: 職人が黄色いランプを両手で持つ姿を大きく写し、その下に細長いクリーム色の文字を二行置いた縦長の写真。 Meet the restorer — Bench Notes · Ep. 04
  ko: 근접 인물 사진에서 수리공이 양손으로 노란 탁상등을 잡고 있다. 아래에는 폭이 좁은 크림색 글씨가 두 줄 놓여 있다. Meet the restorer — Bench Notes · Ep. 04
  de: In der Nahaufnahme hält der Restaurator die gelbe Lampe mit beiden Händen. Darunter stehen zwei cremefarbene Zeilen in schmaler Schrift. Meet the restorer — Bench Notes · Ep. 04
  fr: En portrait serré, le restaurateur tient la lampe jaune à deux mains au-dessus de deux lignes crème en caractères étroits. Meet the restorer — Bench Notes · Ep. 04
  ru: На крупном портрете мастер держит жёлтую лампу обеими руками. Ниже расположены две кремовые строки, набранные узким шрифтом. Meet the restorer — Bench Notes · Ep. 04
  it: Nel ritratto ravvicinato il restauratore regge la lampada gialla con entrambe le mani sopra due righe color crema in caratteri stretti. Meet the restorer — Bench Notes · Ep. 04
  ar: تظهر لقطة قريبة للمصلح وهو يمسك المصباح الأصفر بكلتا يديه، وتحته سطران بلون كريمي وحروف ضيقة. Meet the restorer — Bench Notes · Ep. 04
