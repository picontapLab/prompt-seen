alt:
  en: "The blue bookmark sticks out of the closed book beside the paper fox with its blue scarf and white-tipped left ear. ここで待ってる。 · また明日、つづきを読もう。"
  zh-Hans: "蓝书签从合上的书中露出一角，旁边的纸狐狸仍系着蓝围巾，左耳尖是白色。 ここで待ってる。 · また明日、つづきを読もう。"
  es: "La punta del marcapáginas azul sobresale del libro cerrado junto al zorro, que conserva el pañuelo azul y la punta blanca de la oreja izquierda. ここで待ってる。 · また明日、つづきを読もう。"
  pt-BR: "A ponta do marcador azul sai do livro fechado. Ao lado, a raposa continua com o lenço azul e a ponta da orelha esquerda branca. ここで待ってる。 · また明日、つづきを読もう。"
  ja: "閉じた本から青いしおりの先が出ている。隣の紙のキツネは青いスカーフを着け、左耳の先は白い。 ここで待ってる。 · また明日、つづきを読もう。"
  ko: "덮인 책 밖으로 파란 책갈피 끝이 나와 있다. 옆에 앉은 종이 여우는 파란 스카프를 두르고 왼쪽 귀 끝이 희다. ここで待ってる。 · また明日、つづきを読もう。"
  de: "Das blaue Lesezeichen ragt aus dem geschlossenen Buch. Daneben sitzt der Papierfuchs mit blauem Schal und weißer Spitze am linken Ohr. ここで待ってる。 · また明日、つづきを読もう。"
  fr: "Le marque-page bleu dépasse du livre fermé à côté du renard, qui garde son foulard bleu et la pointe blanche de l’oreille gauche. ここで待ってる。 · また明日、つづきを読もう。"
  ru: "Синяя закладка выглядывает из закрытой книги. Рядом сидит бумажный лис в синем шарфе, с белым кончиком левого уха. ここで待ってる。 · また明日、つづきを読もう。"
  it: "Il segnalibro blu sporge dal libro chiuso. Accanto siede la volpe con la sciarpa blu e la punta dell’orecchio sinistro bianca. ここで待ってる。 · また明日、つづきを読もう。"
  ar: "يبرز طرف علامة القراءة الزرقاء من الكتاب المغلق. وبجواره الثعلب الورقي بوشاحه الأزرق وطرف أذنه اليسرى الأبيض. ここで待ってる。 · また明日、つづきを読もう。"
  zh-Hant: "藍色書籤從闔上的書中露出一角，旁邊的紙狐狸仍繫著藍圍巾，左耳尖是白色。 ここで待ってる。 · また明日、つづきを読もう。"
