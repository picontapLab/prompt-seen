alt:
  en: Two gray panels show a blue pouch with an orange zipper at left and an olive messenger bag with two buckles at right. Pick your carry — Two bags for different loads
  zh-Hans: 两个灰色画框内，左侧是带橙色拉链的蓝色小包，右侧是带双扣的橄榄绿邮差包。 Pick your carry — Two bags for different loads
  es: Dos paneles grises muestran un bolso azul con cremallera naranja a la izquierda y una bandolera verde oliva con dos hebillas a la derecha. Pick your carry — Two bags for different loads
  pt-BR: Dois quadros cinza mostram, à esquerda, uma bolsa azul com zíper laranja e, à direita, uma bolsa carteiro verde-oliva com duas fivelas. Pick your carry — Two bags for different loads
  ja: 灰色の二つの枠に、左はオレンジのファスナー付きの青いポーチ、右は留め具が二つあるオリーブ色のバッグが写る。 Pick your carry — Two bags for different loads
  ko: 회색 칸 두 개에 왼쪽은 주황색 지퍼가 달린 파란 가방, 오른쪽은 버클이 두 개 달린 올리브색 메신저백이 보인다. Pick your carry — Two bags for different loads
  de: Zwei graue Bildfelder zeigen links eine blaue Tasche mit orangefarbenem Reißverschluss und rechts eine olivgrüne Umhängetasche mit zwei Schnallen. Pick your carry — Two bags for different loads
  fr: Deux cadres gris montrent à gauche une pochette bleue à fermeture orange et à droite une besace olive à deux boucles. Pick your carry — Two bags for different loads
  ru: В двух серых рамках показаны синяя сумочка с оранжевой молнией слева и оливковая сумка с двумя пряжками справа. Pick your carry — Two bags for different loads
  it: Due riquadri grigi mostrano a sinistra una borsa blu con cerniera arancione e a destra una borsa a tracolla verde oliva con due fibbie. Pick your carry — Two bags for different loads
  ar: يعرض إطاران رماديان حقيبة زرقاء بسحاب برتقالي على اليسار وحقيبة كتف زيتونية بإبزيمين على اليمين. Pick your carry — Two bags for different loads
  zh-Hant: 兩個灰色畫框中，左側是有橘色拉鍊的藍色小包，右側是有兩個搭扣的橄欖綠郵差包。 Pick your carry — Two bags for different loads
