alt:
  en: "Two separate frames show the runners from behind at the start and hands arranging cups at the water station. Valeu, pessoal! · Até a próxima corrida"
  zh-Hans: "两个独立画格分别展示集合时跑者的背影，以及补水点摆放水杯的双手。 Valeu, pessoal! · Até a próxima corrida"
  es: "Dos recuadros separados muestran a los corredores de espaldas en la salida y las manos que colocan los vasos en el avituallamiento. Valeu, pessoal! · Até a próxima corrida"
  pt-BR: "Dois quadros separados mostram os corredores de costas na largada e as mãos arrumando os copos no ponto de hidratação. Valeu, pessoal! · Até a próxima corrida"
  ja: "別々の二つの枠に、集合時のランナーの後ろ姿と給水所でカップを並べる手が写る。 Valeu, pessoal! · Até a próxima corrida"
  ko: "두 사진 칸에 출발 지점의 주자들 뒷모습과 급수대에서 컵을 놓는 손이 각각 보인다. Valeu, pessoal! · Até a próxima corrida"
  de: "Zwei getrennte Bildfelder zeigen die Laufenden am Start von hinten und Hände beim Aufstellen der Becher an der Wasserstation. Valeu, pessoal! · Até a próxima corrida"
  fr: "Deux cadres distincts montrent les coureurs de dos au départ et les mains qui disposent les gobelets au ravitaillement. Valeu, pessoal! · Até a próxima corrida"
  ru: "В двух отдельных кадрах видны бегуны со спины на старте и руки, расставляющие стаканы на пункте с водой. Valeu, pessoal! · Até a próxima corrida"
  it: "Due riquadri separati mostrano i corridori di spalle alla partenza e le mani che dispongono i bicchieri al punto di ristoro. Valeu, pessoal! · Até a próxima corrida"
  ar: "يظهر في إطارين منفصلين العداؤون من الخلف عند الانطلاق والأيدي التي ترتب الأكواب عند محطة المياه. Valeu, pessoal! · Até a próxima corrida"
  zh-Hant: "兩個獨立畫框分別呈現集合時跑者的背影，以及補給站擺放水杯的雙手。 Valeu, pessoal! · Até a próxima corrida"
