alt:
  en: Two horizontal bars start together below the heading on cream paper. The upper navy bar is longer than the lower green bar. Baseline 12 min · Pilot 8 min — Average wait · Demo data
  zh-Hans: 米色纸面上，标题下的两根横条起点对齐，上方深蓝条长于下方绿条。 Baseline 12 min · Pilot 8 min — Average wait · Demo data
  es: Dos barras horizontales parten del mismo lado bajo el título. La azul marino de arriba es más larga que la verde de abajo. Baseline 12 min · Pilot 8 min — Average wait · Demo data
  pt-BR: Sob o título, duas barras horizontais começam do mesmo lado. A azul-marinho de cima é mais longa que a verde de baixo. Baseline 12 min · Pilot 8 min — Average wait · Demo data
  ja: 見出しの下に左端をそろえた二本の横棒があり、上の紺色の棒が下の緑色の棒より長い。 Baseline 12 min · Pilot 8 min — Average wait · Demo data
  ko: 제목 아래에 시작점이 거의 같은 가로 막대 두 개가 있다. 위쪽 남색 막대가 아래쪽 초록색 막대보다 길다. Baseline 12 min · Pilot 8 min — Average wait · Demo data
  de: Unter der Überschrift beginnen zwei waagerechte Balken auf derselben Seite. Der obere dunkelblaue Balken ist länger als der untere grüne. Baseline 12 min · Pilot 8 min — Average wait · Demo data
  fr: Deux barres horizontales partent du même côté sous le titre. La barre bleu marine du haut dépasse la verte du bas. Baseline 12 min · Pilot 8 min — Average wait · Demo data
  ru: Под заголовком с одной стороны начинаются две горизонтальные полосы. Верхняя тёмно-синяя полоса длиннее нижней зелёной. Baseline 12 min · Pilot 8 min — Average wait · Demo data
  it: Sotto il titolo, due barre orizzontali partono dallo stesso lato. Quella blu scuro in alto è più lunga di quella verde in basso. Baseline 12 min · Pilot 8 min — Average wait · Demo data
  ar: أسفل العنوان شريطان أفقيان ينطلقان من الجهة نفسها. الشريط العلوي الأزرق الداكن أطول من الشريط الأخضر السفلي. Baseline 12 min · Pilot 8 min — Average wait · Demo data
  zh-Hant: 米色紙面上，標題下方的兩條橫條起點對齊，上方深藍條長於下方綠條。 Baseline 12 min · Pilot 8 min — Average wait · Demo data
