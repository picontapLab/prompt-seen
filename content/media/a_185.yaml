alt:
  en: Head and shoulders in shadow edged with blue light against a bright moon and blurred blue city
    lights.
  zh-Hans: 阴影中的头肩剪影以蓝光勾边，背景有明月和虚化的蓝色城市灯光。
  ja: 青い光が影の中の頭と肩を縁取り、背後に明るい月とぼけた青い街灯が見える。
  de: Kopf und Schultern liegen im Schatten und sind blau umrandet, vor einem hellen Mond und
    unscharfen blauen Stadtlichtern.
  pt-BR: Cabeça e ombros na sombra com contorno azul, diante da lua brilhante e de luzes urbanas azuis
    desfocadas.
  es: Cabeza y hombros en sombra recortados por luz azul ante la luna y las luces azules desenfocadas
    de la ciudad.
  ko: 파란 빛이 그림자 속 머리와 어깨의 윤곽을 드러내고, 뒤에는 밝은 달과 흐릿한 파란 도시 불빛이 보입니다.
  zh-Hant: 陰影中的頭肩剪影以藍光勾邊，背景有明月和模糊的藍色城市燈光。
  fr: Tête et épaules dans l’ombre, bordées de bleu devant une lune lumineuse et des lumières urbaines
    bleues floues.
  it: Testa e spalle in ombra delineate da luce blu davanti a una luna luminosa e luci urbane blu
    sfocate.
  ru: Голова и плечи в тени очерчены синим светом на фоне яркой луны и размытых синих огней города.
