  en: A cream cup with a green lid and ribbed sleeve turns on a gray platform, changing the visible
    position of the lid opening.
  zh-Hans: 带绿杯盖和竖纹杯套的米色杯子在灰色平台上转动，饮口的位置随画面改变。
  ja: 緑の蓋と縦溝のスリーブが付いたクリーム色のカップが灰色の台で回転し、飲み口の見える位置が変わる。
  de: Ein cremefarbener Becher mit grünem Deckel und gerippter Manschette dreht sich auf einer grauen
    Plattform. Die Trinköffnung wechselt ihre sichtbare Position.
  pt-BR: Um copo creme com tampa verde e faixa canelada gira sobre uma plataforma cinza, mudando a
    posição visível da abertura.
  es: Un vaso crema con tapa verde y funda estriada gira sobre una plataforma gris. Cambia la posición
    visible de la abertura.
  ko: 초록색 뚜껑과 골이 있는 슬리브가 달린 크림색 컵이 회색 판 위에서 돌아가며 마시는 구멍의 보이는 위치가 달라집니다.
  zh-Hant: 帶綠杯蓋與直紋杯套的米色杯子在灰色平台上轉動，飲口的位置隨畫面改變。
