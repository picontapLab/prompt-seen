alt:
  en: A single clear ESC keycap contains a seated worker, screens, lamp, cables, cup and greenery,
    with surrounding keyboard keys visible.
  zh-Hans: 单个透明ESC键帽内含坐姿人物、屏幕、台灯、线缆、杯子及绿植，周围键盘可见。
  ja: 透明な ESC キーキャップ 1 個の中に、座った作業者、画面、ランプ、ケーブル、カップ、植物があり、周囲のキーボードのキーも見えます。
  de: Eine einzelne transparente ESC-Tastenkappe enthält eine sitzende arbeitende Person, Bildschirme,
    Lampe, Kabel, Tasse und Pflanzen; die umliegenden Tasten bleiben sichtbar.
  pt-BR: Uma única capa transparente de tecla ESC contém uma pessoa sentada trabalhando, telas,
    luminária, cabos, xícara e plantas, com as teclas vizinhas visíveis.
  es: Una única cubierta transparente de tecla ESC contiene a una persona sentada trabajando,
    pantallas, lámpara, cables, taza y vegetación, con las teclas circundantes visibles.
  ko: 투명한 ESC 키캡 하나 안에 앉아 있는 직장인, 화면, 조명, 케이블, 컵과 식물이 있습니다. 주변 키보드 키도 보입니다.
  zh-Hant: 單一透明 ESC 鍵帽內包含坐著的工作者、螢幕、燈具、線材、杯子與綠植，周圍鍵盤按鍵可見。
  fr: Une touche ESC transparente unique contient une personne assise au travail, des écrans, une
    lampe, des câbles, une tasse et de la verdure ; les touches voisines restent visibles.
  it: Un unico tasto ESC trasparente contiene una persona seduta al lavoro, schermi, lampada, cavi,
    tazza e piante, con i tasti circostanti visibili.
  ru: Одна прозрачная клавиша ESC содержит сидящего работника, экраны, лампу, кабели, чашку и зелень;
    вокруг видны другие клавиши клавиатуры.
  ar: يحتوي غطاء مفتاح ESC شفاف واحد على عامل جالس وشاشات ومصباح وكابلات وكوب ونباتات، مع ظهور مفاتيح
    لوحة المفاتيح المحيطة.
