alt:
  en: Four named movement panels and the warm-up, progression, alternative and recovery modules are
    readable. The model added explanations; the image is a layout concept, not validated exercise
    instruction.
  zh-Hans: 四个动作区及热身、进阶、替代、恢复模块清晰；模型添加了说明，本图仅作版式概念，未作为训练指导验证。
  ja: 名前付きの 4
    つの動作パネルと、ウォームアップ、段階的な進め方、代替動作、回復の欄が読めます。モデルが説明を追加しています。画像はレイアウトのコンセプトであり、検証済みの運動指導ではありません。
  de: Vier benannte Bewegungstafeln sowie Module für Aufwärmen, Steigerung, Alternative und Erholung
    sind lesbar. Das Modell hat Erklärungen ergänzt; das Bild ist ein Layoutkonzept, keine geprüfte
    Trainingsanleitung.
  pt-BR: Quatro quadros de movimentos nomeados e os módulos de aquecimento, progressão, alternativa e
    recuperação são legíveis. O modelo acrescentou explicações; a imagem é um conceito de
    diagramação, não uma orientação de exercícios validada.
  es: Son legibles los cuatro paneles de movimientos con nombre y los módulos de calentamiento,
    progresión, alternativa y recuperación. El modelo añadió explicaciones; la imagen es un concepto
    de composición, no instrucciones de ejercicio validadas.
  ko: 이름이 붙은 동작 패널 네 개와 준비 운동, 단계별 발전, 대체 동작 및 회복 모듈이 읽힙니다. 모델이 설명을 추가했습니다. 이미지 레이아웃 콘셉트이며 검증된 운동 지침이
    아닙니다.
  zh-Hant: 四個具名動作面板，以及暖身、進階、替代與恢復模組均可讀。模型新增了解釋；圖片屬版面概念，不是經驗證的運動指引。
  fr: Les quatre panneaux de mouvements nommés et les modules d’échauffement, de progression,
    d’alternative et de récupération sont lisibles. Le modèle a ajouté des explications ; l’image
    est un concept de mise en page, pas une consigne d’exercice validée.
  it: Quattro riquadri di movimenti con nome e i moduli di riscaldamento, progressione, alternativa e
    recupero sono leggibili. Il modello ha aggiunto spiegazioni; l’immagine è un concept di
    impaginazione, non istruzioni di esercizio convalidate.
  ru: Читаются четыре подписанных блока движений и блоки разминки, прогрессии, альтернативы и
    восстановления. Модель добавила пояснения; изображение — концепт компоновки, а не проверенная
    инструкция по упражнениям.
  ar: تُقرأ أربع لوحات مسمّاة للحركات ووحدات الإحماء والتدرّج والبدائل والتعافي. أضاف النموذج شروحًا؛
    والصورة تصوّر للتخطيط وليست تعليمات تمرين جرى التحقق منها.
