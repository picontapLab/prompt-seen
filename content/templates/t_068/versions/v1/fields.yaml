fields:
  - name: rotation
    required: true
    group: composition
    labels:
      en: Rotation in degrees
      zh-Hans: 旋转角度
      ja: 回転角度（度）
      de: Drehung in Grad
      pt-BR: Rotação em graus
      es: Rotación en grados
      ko: 회전 각도(도)
    help:
      en: Changing the angle also requires revising the room-position directions in
        the prompt. Only the default is demonstrated.
      zh-Hans: 修改角度时还需同步修改提示词中的房间方位描述。仅默认值有展示结果。
      ja: 角度を変える場合は、プロンプト内の部屋の位置関係の指示も修正する必要があります。実演しているのはデフォルト値だけです。
      de: Eine Änderung des Winkels erfordert auch eine Anpassung der Angaben zur
        Raumposition im Prompt. Nur der Standardwert wird demonstriert.
      pt-BR: Mudar o ângulo também exige revisar no prompt as orientações de posição
        dos cômodos. Somente o valor padrão é demonstrado.
      es: Cambiar el ángulo también requiere revisar las indicaciones de posición
        de las habitaciones en el prompt. Solo se demuestra la versión
        predeterminada.
      ko: 각도를 바꾸면 프롬프트 안의 방 위치 지시도 수정해야 합니다. 기본값만 시연되어 있습니다.
    type: string
    default: "180"
    minLength: 1
    maxLength: 3
    multiline: false
