instructions:
  en: Upload one pet photo and choose an adult age range and personality. The example pet is synthetic.
  zh-Hans: 宠物照片；年龄范围和性格
  ja: ペットの写真を 1 枚アップロードし、成人の年齢層と性格を選んでください。作例のペットは生成したものです。
  de: Lade ein Haustierfoto hoch und wähle eine erwachsene Altersgruppe sowie eine Persönlichkeit. Das
    Haustier im Beispiel wurde künstlich erzeugt.
  pt-BR: Envie uma foto de um animal de estimação e escolha uma faixa etária adulta e uma
    personalidade. O animal do exemplo é sintético.
  es: Sube una foto de mascota y elige un rango de edad adulta y una personalidad. La mascota de
    ejemplo es sintética.
  ko: 반려동물 사진 한 장을 업로드하고 성인 연령대와 성격을 선택하세요. 예시의 반려동물은 합성 이미지입니다.
  zh-Hant: 上傳一張寵物照片，並選擇成年人的年齡範圍與性格。本例寵物為合成。
  fr: Importez une photo d’animal et choisissez une tranche d’âge adulte et une personnalité. L’animal
    d’exemple est synthétique.
  it: Carica una foto di un animale domestico e scegli una fascia d’età adulta e una personalità.
    L’animale dell’esempio è sintetico.
  ru: Загрузите одну фотографию питомца и выберите взрослый возрастной диапазон и характер. Питомец в
    примере синтетический.
  ar: ارفع صورة حيوان أليف واحدة، واختر نطاق عمر لشخص بالغ وطابعًا للشخصية. الحيوان الأليف في المثال
    اصطناعي.
