fields:
  - name: headline
    required: true
    group: subject
    labels:
      en: Headline
      zh-Hans: 标题
      ja: 見出し
      de: Überschrift
      pt-BR: Título principal
      es: Titular
      ko: 제목
      zh-Hant: 標題
      fr: Titre
      it: Titolo
    help:
      en: Changing this value creates an untested variant. Keep related content consistent.
      zh-Hans: 修改后属于未验证的新变体，请同时保持相关内容一致。
      ja: この値を変更すると、未検証の別案になります。関連する内容に一貫性を持たせてください。
      de: Eine Änderung dieses Werts erzeugt eine ungetestete Variante. Halte zusammengehörige Inhalte
        konsistent.
      pt-BR: Mudar este valor cria uma variante não testada. Mantenha o conteúdo relacionado consistente.
      es: Cambiar este valor crea una variante sin probar. Mantén coherente el contenido relacionado.
      ko: 이 값을 바꾸면 아직 테스트하지 않은 새 변형이 됩니다. 관련 내용의 일관성을 유지하세요.
      zh-Hant: 修改後屬於未驗證的新變體，請同時保持相關內容一致。
      fr: Modifier cette valeur crée une variante non testée. Gardez les contenus associés cohérents.
      it: Cambiare questo valore crea una variante non verificata. Mantieni coerenti i contenuti
        correlati.
    type: string
    default: 泡茶三步
    minLength: 1
    maxLength: 400
    multiline: false
