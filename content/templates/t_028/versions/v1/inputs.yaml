referenceImage: required
instructions:
  en: Upload one product photo and supply headline, subtext, call to action and palette.
  zh-Hans: 产品图、标题、副文案与行动文案
  ja: 商品写真を 1 枚アップロードし、見出し、補足文、行動を促す誘導文、配色を指定してください。
  de: Lade ein Produktfoto hoch und gib Überschrift, Unterzeile, Handlungsaufforderung und Farbpalette
    an.
  pt-BR: Envie uma foto do produto e forneça título, texto de apoio, chamada para ação e paleta.
  es: Sube una foto de producto e indica titular, texto secundario, llamada a la acción y paleta.
  ko: 제품 사진 한 장을 업로드하고 제목, 보조 문구, 행동 유도 문구와 팔레트를 제공하세요.
  zh-Hant: 上傳一張商品照片，並提供標題、副文案、行動文案與配色。
  fr: Importez une photo de produit et indiquez titre, texte secondaire, appel à l’action et palette.
  it: Carica una foto di prodotto e indica titolo, testo secondario, invito all’azione e palette.
  ru: Загрузите одну фотографию товара и задайте заголовок, дополнительный текст, призыв к действию и
    палитру.
