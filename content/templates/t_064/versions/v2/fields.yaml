fields:
  - name: title
    required: true
    group: subject
    labels:
      en: Title
      zh-Hans: 标题
      ja: タイトル
      de: Titel
    help:
      en: Changing this value creates an untested variant. Keep related content
        consistent.
      zh-Hans: 修改后属于未验证的新变体，请同时保持相关内容一致。
      ja: この値を変更すると、未検証の別案になります。関連する内容に一貫性を持たせてください。
      de: Eine Änderung dieses Werts erzeugt eine ungetestete Variante. Halte
        zusammengehörige Inhalte konsistent.
    type: string
    default: STAR CLUB
    minLength: 1
    maxLength: 400
    multiline: false
  - name: tagline
    required: true
    group: subject
    labels:
      en: Tagline
      zh-Hans: 标语
      ja: キャッチフレーズ
      de: Slogan
    help:
      en: Changing this value creates an untested variant. Keep related content
        consistent.
      zh-Hans: 修改后属于未验证的新变体，请同时保持相关内容一致。
      ja: この値を変更すると、未検証の別案になります。関連する内容に一貫性を持たせてください。
      de: Eine Änderung dieses Werts erzeugt eine ungetestete Variante. Halte
        zusammengehörige Inhalte konsistent.
    type: string
    default: Small shine. Big joy.
    minLength: 1
    maxLength: 400
    multiline: false
