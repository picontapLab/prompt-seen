fields:
  - name: accentColor
    required: true
    group: subject
    labels:
      en: Accent color
      zh-Hans: 点缀色
      ja: アクセントカラー
      de: Akzentfarbe
      pt-BR: Cor de destaque
    help:
      en: Changing this value creates an untested variant. Keep related content
        consistent.
      zh-Hans: 修改后属于未验证的新变体，请同时保持相关内容一致。
      ja: この値を変更すると、未検証の別案になります。関連する内容に一貫性を持たせてください。
      de: Eine Änderung dieses Werts erzeugt eine ungetestete Variante. Halte
        zusammengehörige Inhalte konsistent.
      pt-BR: Mudar este valor cria uma variante não testada. Mantenha o conteúdo
        relacionado consistente.
    type: string
    default: orange
    minLength: 1
    maxLength: 400
    multiline: false
