fields:
  - name: word
    required: true
    group: subject
    labels:
      en: Four-letter word
      zh-Hans: 四字母单词
      ja: 4 文字の単語
      de: Wort mit vier Buchstaben
      ko: 네 글자 단어
    help:
      en: Changing this value creates an untested variant. Keep related content
        consistent.
      zh-Hans: 修改后属于未验证的新变体，请同时保持相关内容一致。
      ja: この値を変更すると、未検証の別案になります。関連する内容に一貫性を持たせてください。
      de: Eine Änderung dieses Werts erzeugt eine ungetestete Variante. Halte
        zusammengehörige Inhalte konsistent.
      ko: 이 값을 바꾸면 아직 테스트하지 않은 새 변형이 됩니다. 관련 내용의 일관성을 유지하세요.
    type: string
    default: MELT
    minLength: 1
    maxLength: 400
    multiline: false
  - name: caption
    required: true
    group: subject
    labels:
      en: Caption
      zh-Hans: 说明句
      ja: キャプション
      de: Beschriftung
      ko: 문구
    help:
      en: Changing this value creates an untested variant. Keep related content
        consistent.
      zh-Hans: 修改后属于未验证的新变体，请同时保持相关内容一致。
      ja: この値を変更すると、未検証の別案になります。関連する内容に一貫性を持たせてください。
      de: Eine Änderung dieses Werts erzeugt eine ungetestete Variante. Halte
        zusammengehörige Inhalte konsistent.
      ko: 이 값을 바꾸면 아직 테스트하지 않은 새 변형이 됩니다. 관련 내용의 일관성을 유지하세요.
    type: string
    default: Letters soften into motion.
    minLength: 1
    maxLength: 400
    multiline: false
