    reading order.
  zh-Hans: 一张角色参考图；16条短中文配文
  ja: キャラクターの参照画像を 1 枚アップロードしてください。短いキャプションを読む順にちょうど 16 個指定します。
  de: Lade ein Figurenreferenzbild hoch. Gib genau sechzehn kurze Beschriftungen
