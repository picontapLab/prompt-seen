  es: Sube una referencia de personaje. Aporta exactamente dieciséis textos cortos
    en orden de lectura.
  ko: 캐릭터 참조 이미지 한 장을 업로드하세요. 읽는 순서대로 짧은 문구를 정확히 열여섯 개 제공하세요.
