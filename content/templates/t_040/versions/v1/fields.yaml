fields:
  - name: product
    required: true
    group: subject
    labels:
      en: Product
      zh-Hans: 产品
      ja: 商品
      de: Produkt
      es: Producto
      ko: 제품
    help:
      en: Changing this value creates an untested variant. Keep related content
        consistent.
      zh-Hans: 修改后属于未验证的新变体，请同时保持相关内容一致。
      ja: この値を変更すると、未検証の別案になります。関連する内容に一貫性を持たせてください。
      de: Eine Änderung dieses Werts erzeugt eine ungetestete Variante. Halte
        zusammengehörige Inhalte konsistent.
      es: Cambiar este valor crea una variante sin probar. Mantén coherente el
        contenido relacionado.
      ko: 이 값을 바꾸면 아직 테스트하지 않은 새 변형이 됩니다. 관련 내용의 일관성을 유지하세요.
    type: string
    default: a compact espresso maker
    minLength: 1
    maxLength: 400
    multiline: false
  - name: feature
    required: true
    group: subject
    labels:
      en: Feature
      zh-Hans: 功能细节
      ja: 特徴
      de: Merkmal
      es: Característica
      ko: 특징
    help:
      en: Changing this value creates an untested variant. Keep related content
        consistent.
      zh-Hans: 修改后属于未验证的新变体，请同时保持相关内容一致。
      ja: この値を変更すると、未検証の別案になります。関連する内容に一貫性を持たせてください。
      de: Eine Änderung dieses Werts erzeugt eine ungetestete Variante. Halte
        zusammengehörige Inhalte konsistent.
      es: Cambiar este valor crea una variante sin probar. Mantén coherente el
        contenido relacionado.
      ko: 이 값을 바꾸면 아직 테스트하지 않은 새 변형이 됩니다. 관련 내용의 일관성을 유지하세요.
    type: string
    default: the tactile control surface
    minLength: 1
    maxLength: 400
    multiline: false
