fields:
  - name: brand
    required: true
    group: subject
    labels:
      en: Exact label
      zh-Hans: 准确标签
      ja: 正確なラベル文言
      de: Exakte Beschriftung
      pt-BR: Rótulo exato
      es: Etiqueta exacta
      ko: 정확한 라벨
    help:
      en: Changing this value creates an untested variant. Keep related content
        consistent.
      zh-Hans: 修改后属于未验证的新变体，请同时保持相关内容一致。
      ja: この値を変更すると、未検証の別案になります。関連する内容に一貫性を持たせてください。
      de: Eine Änderung dieses Werts erzeugt eine ungetestete Variante. Halte
        zusammengehörige Inhalte konsistent.
      pt-BR: Alterar este valor cria uma variante não testada. Mantenha o conteúdo
        relacionado consistente.
      es: Cambiar este valor crea una variante sin probar. Mantén coherente el
        contenido relacionado.
      ko: 이 값을 바꾸면 아직 테스트하지 않은 새 변형이 됩니다. 관련 내용의 일관성을 유지하세요.
    type: string
    default: BERRY DAY
    minLength: 1
    maxLength: 400
    multiline: false
