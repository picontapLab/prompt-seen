fields:
  - name: captions
    required: true
    group: text
    labels:
      en: Nine English captions
      zh-Hans: 九条英文配文
      ja: 9つの英語キャプション
      de: Neun englische Beschriftungen
      pt-BR: Nove legendas em inglês
      es: Nueve textos en inglés
      ko: 영어 문구 아홉 개
    help:
      en: Exactly nine short captions in reading order; up to 28 characters each.
      zh-Hans: 按阅读顺序填写九条短句，每条最多 28 个字符。
      ja: 読む順に9つの短いキャプションを入力してください。各28文字以内です。
      de: Genau neun kurze Beschriftungen in Leserichtung; jeweils bis zu 28 Zeichen.
      pt-BR: Exatamente nove legendas curtas na ordem de leitura; até 28 caracteres
        cada.
      es: Exactamente nueve textos cortos en orden de lectura; hasta 28 caracteres
        cada uno.
      ko: 읽는 순서대로 짧은 문구를 정확히 아홉 개 입력하세요. 각 문구는 최대 28자입니다.
    type: string-list
    default:
      - I'm in!
      - Who's coming?
      - Small talk?
      - Need a minute.
      - Battery low.
      - I'm staying in.
      - Maybe next time.
      - Recharging.
      - Home sweet home.
    minItems: 9
    maxItems: 9
    itemMaxLength: 28
    separator: "; "
