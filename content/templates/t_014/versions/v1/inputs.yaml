referenceImage: optional
instructions:
  en: Describe the cast and supply exactly four ordered story beats; a character sheet is optional.
  zh-Hans: 角色描述和四个故事节点；角色参考图可选
  ja: 登場するキャラクターを説明し、物語の展開を順番にちょうど 4 つ指定してください。キャラクター設定画の使用は任意です。
  de: Beschreibe die Figuren und gib genau vier geordnete Handlungsschritte vor; ein Figurenblatt ist
    optional.
  pt-BR: Descreva os personagens e forneça exatamente quatro momentos da história em ordem; uma folha
    de personagens é opcional.
  es: Describe el reparto y aporta exactamente cuatro momentos narrativos en orden; una hoja de
    personaje es opcional.
  ko: 등장인물을 설명하고 순서가 있는 이야기 장면을 정확히 네 개 제공하세요. 캐릭터 시트는 선택 사항입니다.
  zh-Hant: 描述角色，並依順序提供恰好四個故事節點；角色設定圖為選填。
  fr: Décrivez les personnages et fournissez exactement quatre étapes narratives ordonnées ; une
    planche de personnages est facultative.
slots:
  - id: character
    labels:
      en: Character
      zh-Hans: 角色设定图
      ja: 人物
      de: Figur
