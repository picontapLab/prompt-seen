fields:
  - name: product
    required: true
    group: subject
    labels:
      en: Product
      zh-Hans: 产品
      ja: 商品
      de: Produkt
      es: Producto
    help:
      en: Changing this value creates an untested variant. Keep related content
        consistent.
      zh-Hans: 修改后属于未验证的新变体，请同时保持相关内容一致。
      ja: この値を変更すると、未検証の別案になります。関連する内容に一貫性を持たせてください。
      de: Eine Änderung dieses Werts erzeugt eine ungetestete Variante. Halte
        zusammengehörige Inhalte konsistent.
      es: Cambiar este valor crea una variante sin probar. Mantén coherente el
        contenido relacionado.
    type: string
    default: a dark green tea tin
    minLength: 1
    maxLength: 400
    multiline: false
  - name: brandColor
    required: true
    group: subject
    labels:
      en: Background color
      zh-Hans: 背景颜色
      ja: 背景色
      de: Hintergrundfarbe
      es: Color de fondo
    help:
      en: Changing this value creates an untested variant. Keep related content
        consistent.
      zh-Hans: 修改后属于未验证的新变体，请同时保持相关内容一致。
      ja: この値を変更すると、未検証の別案になります。関連する内容に一貫性を持たせてください。
      de: Eine Änderung dieses Werts erzeugt eine ungetestete Variante. Halte
        zusammengehörige Inhalte konsistent.
      es: Cambiar este valor crea una variante sin probar. Mantén coherente el
        contenido relacionado.
    type: string
    default: deep cobalt
    minLength: 1
    maxLength: 400
    multiline: false
