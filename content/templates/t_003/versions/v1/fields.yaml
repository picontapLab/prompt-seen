fields:
  - name: character
    type: string
    required: true
    group: subject
    maxLength: 60
    labels:
      en: Character
      zh-Hans: 人物
      ja: 人物
      de: Figur
      pt-BR: Personagem
      es: Personaje
    help:
      en: Who it is and one pose, e.g. “a dancer mid-turn”.
      zh-Hans: 人物身份加一个动作，如“正在转身的舞者”。
      ja: 人物とポーズをひとつ指定します。例：「回転中のダンサー」。
      de: Beschreibe die Person und eine Pose, etwa „eine tanzende Person mitten in
        einer Drehung“.
      pt-BR: Quem é e uma pose, como “uma pessoa dançando durante um giro”.
      es: Quién es y una pose, por ejemplo «una persona que baila en pleno giro».
  - name: rimLight
    type: enum
    required: true
    group: style
    default: cyan and magenta
    labels:
      en: Rim light
      zh-Hans: 轮廓光
      ja: リムライト
      de: Konturlicht
      pt-BR: Luz de contorno
      es: Luz de contorno
    options:
      - value: cyan and magenta
        swatch:
          - "#22D3EE"
          - "#F472B6"
        labels:
          en: Cyan and magenta
          zh-Hans: 青与洋红
          ja: シアンとマゼンタ
          de: Cyan und Magenta
          pt-BR: Ciano e magenta
          es: Cian y magenta
      - value: amber and teal
        swatch:
          - "#F59E0B"
          - "#14B8A6"
        labels:
          en: Amber and teal
          zh-Hans: 琥珀与青绿
          ja: 琥珀色と青緑
          de: Bernstein und Petrol
          pt-BR: Âmbar e verde-azulado
          es: Ámbar y verde azulado
      - value: violet and cyan
        swatch:
          - "#A78BFA"
          - "#22D3EE"
        labels:
          en: Violet and cyan
          zh-Hans: 紫与青
          ja: バイオレットとシアン
          de: Violett und Cyan
          pt-BR: Violeta e ciano
          es: Violeta y cian
  - name: background
    type: enum
    required: true
    group: composition
    default: soft bokeh lights
    labels:
      en: Background
      zh-Hans: 背景
      ja: 背景
      de: Hintergrund
      pt-BR: Fundo
      es: Fondo
    options:
      - value: soft bokeh lights
        labels:
          en: Soft bokeh lights
          zh-Hans: 柔和的虚化光点
          ja: やわらかな玉ぼけ
          de: Sanfte Bokeh-Lichter
          pt-BR: Luzes de bokeh suaves
          es: Luces de bokeh suave
      - value: a blurred night city
        labels:
          en: Blurred night city
          zh-Hans: 虚化的夜城
          ja: ぼけた夜の街
          de: Unscharfe nächtliche Stadt
          pt-BR: Cidade noturna desfocada
          es: Ciudad nocturna desenfocada
      - value: a flat dark gradient
        labels:
          en: Flat dark gradient
          zh-Hans: 平涂暗色渐变
          ja: 平面的な暗いグラデーション
          de: Flächiger dunkler Farbverlauf
          pt-BR: Degradê escuro simples
          es: Degradado plano oscuro
  - name: mood
    type: string
    required: false
    group: style
    maxLength: 40
    labels:
      en: Mood
      zh-Hans: 情绪
      ja: ムード
      de: Stimmung
      pt-BR: Clima
      es: Ambiente
  - name: aspectRatio
    type: enum
    required: true
    group: composition
    default: 4:5
    labels:
      en: Aspect ratio
      zh-Hans: 画面比例
      ja: アスペクト比
      ar: نسبة الأبعاد
      de: Seitenverhältnis
      pt-BR: Proporção
      es: Relación de aspecto
    options:
      - value: 4:5
        labels:
          en: 4:5
          zh-Hans: 4:5
          ja: 4:5
          ar: 4:5
          de: 4:5
          pt-BR: 4:5
          es: 4:5
      - value: 1:1
        labels:
          en: 1:1
          zh-Hans: 1:1
          ja: 1:1
          ar: 1:1
          de: 1:1
          pt-BR: 1:1
          es: 1:1
      - value: 2:3
        labels:
          en: 2:3
          zh-Hans: 2:3
          ja: 2:3
          ar: 2:3
          de: 2:3
          pt-BR: 2:3
          es: 2:3
      - value: 9:16
        labels:
          en: 9:16
          zh-Hans: 9:16
          ja: 9:16
          ar: 9:16
          de: 9:16
          pt-BR: 9:16
          es: 9:16
