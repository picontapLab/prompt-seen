fields:
  - name: character
    type: string
    required: true
    group: subject
    maxLength: 60
    labels:
      en: Character
      zh-Hans: 人物
      ja: 人物
      de: Figur
      pt-BR: Personagem
      es: Personaje
      ko: 캐릭터
      zh-Hant: 人物
      fr: Personnage
      it: Personaggio
      ru: Персонаж
    help:
      en: Who it is and one pose, e.g. “a dancer mid-turn”.
      zh-Hans: 人物身份加一个动作，如“正在转身的舞者”。
      ja: 人物とポーズをひとつ指定します。例：「回転中のダンサー」。
      de: Beschreibe die Person und eine Pose, etwa „eine tanzende Person mitten in einer Drehung“.
      pt-BR: Quem é e uma pose, como “uma pessoa dançando durante um giro”.
      es: Quién es y una pose, por ejemplo «una persona que baila en pleno giro».
      ko: "누구인지와 자세 하나를 적으세요. 예: “회전 중인 무용수”."
      zh-Hant: 人物身分與一個姿勢，例如「正在轉身的舞者」。
      fr: Indiquez qui est le sujet et une pose, par exemple « un danseur en pleine rotation ».
      it: Chi è e una posa, per esempio «una ballerina a metà giro».
      ru: Кто это и одна поза, например «танцор в середине поворота».
  - name: rimLight
    type: enum
    required: true
    group: style
    default: cyan and magenta
    labels:
      en: Rim light
      zh-Hans: 轮廓光
      ja: リムライト
      de: Konturlicht
      pt-BR: Luz de contorno
      es: Luz de contorno
      ko: 윤곽광
      zh-Hant: 輪廓光
      fr: Éclairage de contour
      it: Luce sui bordi
      ru: Контровый свет
    options:
      - value: cyan and magenta
        swatch:
          - "#22D3EE"
          - "#F472B6"
        labels:
          en: Cyan and magenta
          zh-Hans: 青与洋红
          ja: シアンとマゼンタ
          de: Cyan und Magenta
          pt-BR: Ciano e magenta
          es: Cian y magenta
          ko: 청록색과 마젠타색
          zh-Hant: 青與洋紅
          fr: Cyan et magenta
          it: Ciano e magenta
          ru: Голубой и пурпурный
      - value: amber and teal
        swatch:
          - "#F59E0B"
          - "#14B8A6"
        labels:
          en: Amber and teal
          zh-Hans: 琥珀与青绿
          ja: 琥珀色と青緑
          de: Bernstein und Petrol
          pt-BR: Âmbar e verde-azulado
          es: Ámbar y verde azulado
          ko: 호박색과 청록색
          zh-Hant: 琥珀與青綠
          fr: Ambre et sarcelle
          it: Ambra e petrolio
          ru: Янтарный и бирюзовый
      - value: violet and cyan
        swatch:
          - "#A78BFA"
          - "#22D3EE"
        labels:
          en: Violet and cyan
          zh-Hans: 紫与青
          ja: バイオレットとシアン
          de: Violett und Cyan
          pt-BR: Violeta e ciano
          es: Violeta y cian
          ko: 보라색과 청록색
          zh-Hant: 紫與青
          fr: Violet et cyan
          it: Viola e ciano
          ru: Фиолетовый и голубой
  - name: background
    type: enum
    required: true
    group: composition
    default: soft bokeh lights
    labels:
      en: Background
      zh-Hans: 背景
      ja: 背景
      de: Hintergrund
      pt-BR: Fundo
      es: Fondo
      ko: 배경
      zh-Hant: 背景
      fr: Arrière-plan
      it: Sfondo
      ru: Фон
    options:
      - value: soft bokeh lights
        labels:
          en: Soft bokeh lights
          zh-Hans: 柔和的虚化光点
          ja: やわらかな玉ぼけ
          de: Sanfte Bokeh-Lichter
          pt-BR: Luzes de bokeh suaves
          es: Luces de bokeh suave
          ko: 부드러운 보케 불빛
          zh-Hant: 柔和的虛化光點
          fr: Lumières en bokeh doux
          it: Luci bokeh morbide
          ru: Мягкие огни боке
      - value: a blurred night city
        labels:
          en: Blurred night city
          zh-Hans: 虚化的夜城
          ja: ぼけた夜の街
          de: Unscharfe nächtliche Stadt
          pt-BR: Cidade noturna desfocada
          es: Ciudad nocturna desenfocada
          ko: 흐릿한 밤의 도시
          zh-Hant: 虛化的夜城
          fr: Ville nocturne floue
          it: Città notturna sfocata
          ru: Размытый ночной город
      - value: a flat dark gradient
        labels:
          en: Flat dark gradient
          zh-Hans: 平涂暗色渐变
          ja: 平面的な暗いグラデーション
          de: Flächiger dunkler Farbverlauf
          pt-BR: Degradê escuro simples
          es: Degradado plano oscuro
          ko: 단순한 어두운 그라데이션
          zh-Hant: 平坦的深色漸層
          fr: Dégradé sombre uniforme
          it: Sfumatura scura piatta
          ru: Плоский тёмный градиент
  - name: mood
    type: string
    required: false
    group: style
    maxLength: 40
    labels:
      en: Mood
      zh-Hans: 情绪
      ja: ムード
      de: Stimmung
      pt-BR: Clima
      es: Ambiente
      ko: 분위기
      zh-Hant: 情緒
      fr: Ambiance
      it: Atmosfera
      ru: Настроение
