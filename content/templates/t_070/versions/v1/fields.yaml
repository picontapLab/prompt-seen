fields:
  - name: captions
    required: true
    group: text
    labels:
      en: Nine English captions
      zh-Hans: 九条英文配文
      ja: 9つの英語キャプション
    help:
      en: Exactly nine short captions in reading order; up to 28 characters each.
      zh-Hans: 按阅读顺序填写九条短句，每条最多 28 个字符。
      ja: 読む順に9つの短いキャプションを入力してください。各28文字以内です。
    type: string-list
    default:
      - Hi, human!
      - Did someone say snacks?
      - Side eye.
      - Not sorry.
      - Let's go!
      - Need a nap.
      - Good job!
      - Miss you.
      - Love you!
    minItems: 9
    maxItems: 9
    itemMaxLength: 28
    separator: "; "
