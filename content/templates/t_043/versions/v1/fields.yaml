fields:
  - name: product
    required: true
    group: subject
    labels:
      en: Product
      zh-Hans: 产品
      ja: 商品
      de: Produkt
      pt-BR: Produto
    help:
      en: Changing this value creates an untested variant. Keep related content
        consistent.
      zh-Hans: 修改后属于未验证的新变体，请同时保持相关内容一致。
      ja: この値を変更すると、未検証の別案になります。関連する内容に一貫性を持たせてください。
      de: Eine Änderung dieses Werts erzeugt eine ungetestete Variante. Halte
        zusammengehörige Inhalte konsistent.
      pt-BR: Mudar este valor cria uma variante não testada. Mantenha o conteúdo
        relacionado consistente.
    type: string
    default: a translucent sports bottle
    minLength: 1
    maxLength: 400
    multiline: false
  - name: season
    required: true
    group: subject
    labels:
      en: Seasonal setting
      zh-Hans: 季节场景
      ja: 季節を感じさせる背景
      de: Jahreszeitliche Umgebung
      pt-BR: Cenário sazonal
    help:
      en: Changing this value creates an untested variant. Keep related content
        consistent.
      zh-Hans: 修改后属于未验证的新变体，请同时保持相关内容一致。
      ja: この値を変更すると、未検証の別案になります。関連する内容に一貫性を持たせてください。
      de: Eine Änderung dieses Werts erzeugt eine ungetestete Variante. Halte
        zusammengehörige Inhalte konsistent.
      pt-BR: Alterar este valor cria uma variante não testada. Mantenha o conteúdo
        relacionado consistente.
    type: string
    default: restrained autumn leaves and warm seasonal light
    minLength: 1
    maxLength: 400
    multiline: false
