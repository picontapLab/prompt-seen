fields:
  - name: material
    required: true
    group: subject
    labels:
      en: Material and color
      zh-Hans: 材质与颜色
      ja: 素材と色
      de: Material und Farbe
      ko: 소재와 색상
    help:
      en: Changing this value creates an untested variant. Keep related content
        consistent.
      zh-Hans: 修改后属于未验证的新变体，请同时保持相关内容一致。
      ja: この値を変更すると、未検証の別案になります。関連する内容に一貫性を持たせてください。
      de: Eine Änderung dieses Werts erzeugt eine ungetestete Variante. Halte
        zusammengehörige Inhalte konsistent.
      ko: 이 값을 바꾸면 아직 테스트하지 않은 새 변형이 됩니다. 관련 내용의 일관성을 유지하세요.
    type: string
    default: brown leather
    minLength: 1
    maxLength: 400
    multiline: false
  - name: stitchColor
    required: true
    group: subject
    labels:
      en: Stitch color
      zh-Hans: 缝线颜色
      ja: ステッチの色
      de: Nahtfarbe
      ko: 스티치 색상
    help:
      en: Changing this value creates an untested variant. Keep related content
        consistent.
      zh-Hans: 修改后属于未验证的新变体，请同时保持相关内容一致。
      ja: この値を変更すると、未検証の別案になります。関連する内容に一貫性を持たせてください。
      de: Eine Änderung dieses Werts erzeugt eine ungetestete Variante. Halte
        zusammengehörige Inhalte konsistent.
      ko: 이 값을 바꾸면 아직 테스트하지 않은 새 변형이 됩니다. 관련 내용의 일관성을 유지하세요.
    type: string
    default: cream
    minLength: 1
    maxLength: 400
    multiline: false
