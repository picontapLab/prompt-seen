  ko: 기기, 확인한 구조 설명과 정확한 라벨을 제공하세요. 제품 사진은 선택 사항입니다.
  zh-Hant: 提供裝置名稱、已核對的結構資料與準確的標註文字；商品照片為選填。
  fr: Indiquez l’appareil, des notes de structure vérifiées et les légendes exactes ; une photo du
