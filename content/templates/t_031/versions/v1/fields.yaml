fields:
  - name: country
    required: true
    group: subject
    labels:
      en: Country
      zh-Hans: 目的地国家
      ja: 国
      de: Land
      es: País
      ko: 국가
    help: {}
    type: string
    default: Japan
    minLength: null
    maxLength: 300
    multiline: false
  - name: destinations
    required: true
    group: subject
    labels:
      en: Destinations
      zh-Hans: 核对后的目的地
      ja: 目的地
      de: Reiseziele
      es: Destinos
      ko: 목적지
    help: {}
    type: string-list
    default:
      - Tokyo
      - Kyoto
      - Osaka
    minItems: 1
    maxItems: 12
    itemMaxLength: null
    separator: "; "
  - name: routeNotes
    required: true
    group: text
    labels:
      en: Route notes
      zh-Hans: 核对后的路线说明
      ja: 経路の説明
      de: Routenhinweise
      es: Notas de ruta
      ko: 경로 설명
    help: {}
    type: string
    default: Illustrative route from Tokyo to Kyoto to Osaka. Place labels at the
      supplied map locations. No travel times, prices or current transport
      claims.
    minLength: null
    maxLength: 2000
    multiline: true
