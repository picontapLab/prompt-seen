referenceImage: required
instructions:
  en: Use the same references for all three pages. Select a sample, replace the subject and copy, then run each page separately.
  zh-Hans: 三页使用同一组参考图。选择样例，替换主体和文案后逐页生成。
  es: Usa las mismas referencias en las tres páginas. Elige un ejemplo, cambia el motivo y el texto y genera cada página por separado.
  pt-BR: Use as mesmas referências nas três páginas. Escolha um exemplo, troque o tema e o texto e gere cada página separadamente.
  ja: 三枚とも同じ参考画像を使います。サンプルを選び、題材と文言を入れ替えて、一枚ずつ生成してください。
  ko: 세 장 모두 같은 참고 이미지를 사용합니다. 예시를 고르고 소재와 문구를 바꾼 뒤 한 장씩 생성하세요.
  de: Verwende für alle drei Seiten dieselben Vorlagen. Wähle ein Beispiel, ersetze Motiv und Text und erzeuge jede Seite einzeln.
  fr: Gardez les mêmes références pour les trois pages. Choisissez un exemple, remplacez le sujet et le texte, puis générez chaque page séparément.
  ru: Используйте одни и те же исходные изображения для трёх карточек. Выберите пример, замените тему и текст и создайте каждую карточку отдельно.
  it: Usa gli stessi riferimenti per tutte e tre le pagine. Scegli un esempio, cambia soggetto e testo e genera una pagina alla volta.
  ar: استخدم الصور المرجعية نفسها للصفحات الثلاث. اختر مثالا واستبدل الموضوع والنص ثم أنشئ كل صفحة على حدة.
  zh-Hant: 三頁都使用同一組參考圖片。選擇範例，換成自己的主體和文案，再逐頁生成。
