instructions:
  en: Upload one portrait and exactly nine short greetings. Our person is synthetic.
  zh-Hans: 人物照片和九条简短祝福
  ja: ポートレートを 1 枚アップロードし、短い挨拶をちょうど 9 個指定してください。作例の人物は生成したものです。
  de: Lade ein Porträt hoch und gib genau neun kurze Grüße an. Die Person im Beispiel wurde künstlich
    erzeugt.
  pt-BR: Envie um retrato e exatamente nove saudações curtas. A pessoa do nosso exemplo é sintética.
  es: Sube un retrato y exactamente nueve saludos cortos. Nuestra persona es sintética.
  ko: 인물 사진 한 장을 업로드하고 짧은 인사말을 정확히 아홉 개 입력하세요. 예시의 인물은 합성 이미지입니다.
  zh-Hant: 上傳一張人像照片與恰好九則簡短祝福。本例人物為合成。
  fr: Importez un portrait et exactement neuf vœux courts. Notre personne est synthétique.
  it: Carica un ritratto ed esattamente nove brevi messaggi di auguri. La persona del nostro esempio è
    sintetica.
  ru: Загрузите один портрет и ровно девять коротких поздравлений. Наш человек синтетический.
