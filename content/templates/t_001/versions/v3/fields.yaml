fields:
  - name: product
    type: string
    required: true
    group: subject
    maxLength: 80
    labels:
      en: Product
      zh-Hans: 产品
      ja: 商品
      ar: المنتج
      de: Produkt
      pt-BR: Produto
      es: Producto
      ko: 제품
    help:
      en: Name the object and its material, e.g. “a speckled ceramic mug”.
      zh-Hans: 写清物品和材质，如“带斑点的陶瓷马克杯”。
      ja: 物と素材を書きます。例：「斑点模様の陶器のマグカップ」。
      ar: اذكر الشيء ومادته، مثل “كوب خزفي منقّط”.
      de: Nenne das Objekt und sein Material, etwa „ein gesprenkelter Keramikbecher“.
      pt-BR: Diga qual é o objeto e seu material, por exemplo, “uma caneca de cerâmica
        salpicada”.
      es: Indica el objeto y su material, por ejemplo «una taza de cerámica
        moteada».
      ko: "물체와 소재를 적으세요. 예: “점박이 도자기 머그잔”."
  - name: sellingPoints
    type: string-list
    required: true
    group: subject
    minItems: 1
    maxItems: 3
    itemMaxLength: 40
    separator: "; "
    labels:
      en: Selling points
      zh-Hans: 核心卖点
      ja: セールスポイント
      ar: نقاط البيع
      de: Verkaufsargumente
      pt-BR: Diferenciais
      es: Ventajas
      ko: 제품 특징
    help:
      en: Concrete details become visible; vague claims are ignored.
      zh-Hans: 具体的细节会被画出来，空泛的说法会被忽略。
      ja: 具体的な点は絵になり、あいまいな言葉は無視されます。
      ar: التفاصيل الملموسة تظهر في الصورة، والعبارات العامة تُهمل.
      de: Konkrete Details werden sichtbar; vage Aussagen werden ignoriert.
      pt-BR: Detalhes concretos se tornam visíveis; alegações vagas são ignoradas.
      es: Los detalles concretos se hacen visibles; las afirmaciones vagas se
        ignoran.
      ko: 구체적인 특징은 이미지에 나타나지만 모호한 주장은 반영되지 않습니다.
  - name: palette
    type: enum
    required: true
    group: style
    default: warm neutral
    labels:
      en: Palette
      zh-Hans: 配色
      ja: 配色
      ar: الألوان
      de: Farbpalette
      pt-BR: Paleta
      es: Paleta
      ko: 팔레트
    options:
      - value: warm neutral
        swatch:
          - "#E8DCC8"
          - "#B9A58E"
          - "#3E3129"
        labels:
          en: Warm neutral
          zh-Hans: 暖色中性
          ja: ウォームニュートラル
          ar: محايد دافئ
          de: Warme Neutraltöne
          pt-BR: Neutra quente
          es: Neutros cálidos
          ko: 따뜻한 중성색
      - value: sage green
        swatch:
          - "#DCE6DD"
          - "#6E9C88"
          - "#2F5D50"
        labels:
          en: Sage green
          zh-Hans: 鼠尾草绿
          ja: セージグリーン
          ar: أخضر مريمي
          de: Salbeigrün
          pt-BR: Verde-sálvia
          es: Verde salvia
          ko: 세이지 그린
      - value: midnight blue
        swatch:
          - "#1F2A44"
          - "#76C3B7"
          - "#F3ECE2"
        labels:
          en: Midnight blue
          zh-Hans: 午夜蓝
          ja: ミッドナイトブルー
          ar: أزرق ليلي
          de: Mitternachtsblau
          pt-BR: Azul-meia-noite
          es: Azul medianoche
          ko: 미드나이트 블루
      - value: soft grey
        swatch:
          - "#E2E2E0"
          - "#555555"
          - "#1A1A1A"
        labels:
          en: Soft grey
          zh-Hans: 柔和灰
          ja: ソフトグレー
          ar: رمادي ناعم
          de: Sanftes Grau
          pt-BR: Cinza suave
          es: Gris suave
          ko: 부드러운 회색
      - value: coral pop
        swatch:
          - "#EE6C4D"
          - "#F7F1E5"
          - "#2B2D42"
        labels:
          en: Coral pop
          zh-Hans: 珊瑚亮色
          ja: コーラルポップ
          ar: مرجاني
          de: Kräftiges Korallrot
          pt-BR: Coral vibrante
          es: Toque coral
          ko: 선명한 코럴
  - name: aspectRatio
    type: enum
    required: true
    group: composition
    default: 4:5
    labels:
      en: Aspect ratio
      zh-Hans: 画面比例
      ja: アスペクト比
      ar: نسبة الأبعاد
      de: Seitenverhältnis
      pt-BR: Proporção
      es: Relación de aspecto
      ko: 화면 비율
    options:
      - value: 4:5
        labels:
          en: 4:5
          zh-Hans: 4:5
          ja: 4:5
          ar: 4:5
          de: 4:5
          pt-BR: 4:5
          es: 4:5
          ko: 4:5
      - value: 5:4
        labels:
          en: 5:4
          zh-Hans: 5:4
          ja: 5:4
          ar: 5:4
          de: 5:4
          pt-BR: 5:4
          es: 5:4
          ko: 5:4
      - value: 1:1
        labels:
          en: 1:1
          zh-Hans: 1:1
          ja: 1:1
          ar: 1:1
          de: 1:1
          pt-BR: 1:1
          es: 1:1
          ko: 1:1
      - value: 3:4
        labels:
          en: 3:4
          zh-Hans: 3:4
          ja: 3:4
          ar: 3:4
          de: 3:4
          pt-BR: 3:4
          es: 3:4
          ko: 3:4
      - value: 16:9
        labels:
          en: 16:9
          zh-Hans: 16:9
          ja: 16:9
          ar: 16:9
          de: 16:9
          pt-BR: 16:9
          es: 16:9
          ko: 16:9
  - name: headline
    type: string
    required: false
    group: text
    maxLength: 32
    labels:
      en: Headline
      zh-Hans: 标题文字
      ja: 見出し
      ar: العنوان
      de: Überschrift
      pt-BR: Título
      es: Titular
      ko: 제목
    help:
      en: Optional. Short words render more reliably.
      zh-Hans: 可选。字越少越容易正确生成。
      ja: 任意です。短い言葉ほど正確に描画されやすくなります。
      ar: اختياري. الكلمات القصيرة تظهر بدقة أكبر.
      de: Optional. Kurze Wörter werden zuverlässiger dargestellt.
      pt-BR: Opcional. Palavras curtas são reproduzidas com mais confiabilidade.
      es: Opcional. Las palabras cortas se representan con más fiabilidad.
      ko: 선택 사항입니다. 짧은 단어가 더 안정적으로 표현됩니다.
