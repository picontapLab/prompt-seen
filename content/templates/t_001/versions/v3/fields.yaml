fields:
  - name: product
    type: string
    required: true
    group: subject
    maxLength: 80
    labels:
      en: Product
      zh-Hans: 产品
      ja: 商品
      ar: المنتج
      de: Produkt
      es: Producto
    help:
      en: Name the object and its material, e.g. “a speckled ceramic mug”.
      zh-Hans: 写清物品和材质，如“带斑点的陶瓷马克杯”。
      ja: 物と素材を書きます。例：「斑点模様の陶器のマグカップ」。
      ar: اذكر الشيء ومادته، مثل “كوب خزفي منقّط”.
      de: Nenne das Objekt und sein Material, etwa „ein gesprenkelter Keramikbecher“.
      es: Indica el objeto y su material, por ejemplo «una taza de cerámica
        moteada».
  - name: sellingPoints
    type: string-list
    required: true
    group: subject
    minItems: 1
    maxItems: 3
    itemMaxLength: 40
    separator: "; "
    labels:
      en: Selling points
      zh-Hans: 核心卖点
      ja: セールスポイント
      ar: نقاط البيع
      de: Verkaufsargumente
      es: Ventajas
    help:
      en: Concrete details become visible; vague claims are ignored.
      zh-Hans: 具体的细节会被画出来，空泛的说法会被忽略。
      ja: 具体的な点は絵になり、あいまいな言葉は無視されます。
      ar: التفاصيل الملموسة تظهر في الصورة، والعبارات العامة تُهمل.
      de: Konkrete Details werden sichtbar; vage Aussagen werden ignoriert.
      es: Los detalles concretos se hacen visibles; las afirmaciones vagas se
        ignoran.
  - name: palette
    type: enum
    required: true
    group: style
    default: warm neutral
    labels:
      en: Palette
      zh-Hans: 配色
      ja: 配色
      ar: الألوان
      de: Farbpalette
      es: Paleta
    options:
      - value: warm neutral
        swatch:
          - "#E8DCC8"
          - "#B9A58E"
          - "#3E3129"
        labels:
          en: Warm neutral
          zh-Hans: 暖色中性
          ja: ウォームニュートラル
          ar: محايد دافئ
          de: Warme Neutraltöne
          es: Neutros cálidos
      - value: sage green
        swatch:
          - "#DCE6DD"
          - "#6E9C88"
          - "#2F5D50"
        labels:
          en: Sage green
          zh-Hans: 鼠尾草绿
          ja: セージグリーン
          ar: أخضر مريمي
          de: Salbeigrün
          es: Verde salvia
      - value: midnight blue
        swatch:
          - "#1F2A44"
          - "#76C3B7"
          - "#F3ECE2"
        labels:
          en: Midnight blue
          zh-Hans: 午夜蓝
          ja: ミッドナイトブルー
          ar: أزرق ليلي
          de: Mitternachtsblau
          es: Azul medianoche
      - value: soft grey
        swatch:
          - "#E2E2E0"
          - "#555555"
          - "#1A1A1A"
        labels:
          en: Soft grey
          zh-Hans: 柔和灰
          ja: ソフトグレー
          ar: رمادي ناعم
          de: Sanftes Grau
          es: Gris suave
      - value: coral pop
        swatch:
          - "#EE6C4D"
          - "#F7F1E5"
          - "#2B2D42"
        labels:
          en: Coral pop
          zh-Hans: 珊瑚亮色
          ja: コーラルポップ
          ar: مرجاني
          de: Kräftiges Korallrot
          es: Toque coral
  - name: aspectRatio
    type: enum
    required: true
    group: composition
    default: 4:5
    labels:
      en: Aspect ratio
      zh-Hans: 画面比例
      ja: アスペクト比
      ar: نسبة الأبعاد
      de: Seitenverhältnis
      es: Relación de aspecto
    options:
      - value: 4:5
        labels:
          en: 4:5
          zh-Hans: 4:5
          ja: 4:5
          ar: 4:5
          de: 4:5
          es: 4:5
      - value: 5:4
        labels:
          en: 5:4
          zh-Hans: 5:4
          ja: 5:4
          ar: 5:4
          de: 5:4
          es: 5:4
      - value: 1:1
        labels:
          en: 1:1
          zh-Hans: 1:1
          ja: 1:1
          ar: 1:1
          de: 1:1
          es: 1:1
      - value: 3:4
        labels:
          en: 3:4
          zh-Hans: 3:4
          ja: 3:4
          ar: 3:4
          de: 3:4
          es: 3:4
      - value: 16:9
        labels:
          en: 16:9
          zh-Hans: 16:9
          ja: 16:9
          ar: 16:9
          de: 16:9
          es: 16:9
  - name: headline
    type: string
    required: false
    group: text
    maxLength: 32
    labels:
      en: Headline
      zh-Hans: 标题文字
      ja: 見出し
      ar: العنوان
      de: Überschrift
      es: Titular
    help:
      en: Optional. Short words render more reliably.
      zh-Hans: 可选。字越少越容易正确生成。
      ja: 任意です。短い言葉ほど正確に描画されやすくなります。
      ar: اختياري. الكلمات القصيرة تظهر بدقة أكبر.
      de: Optional. Kurze Wörter werden zuverlässiger dargestellt.
      es: Opcional. Las palabras cortas se representan con más fiabilidad.
