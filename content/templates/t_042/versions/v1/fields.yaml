fields:
  - name: product
    required: true
    group: subject
    labels:
      en: Product
      zh-Hans: 产品
      ja: 商品
      de: Produkt
    help:
      en: Changing this value creates an untested variant. Keep related content
        consistent.
      zh-Hans: 修改后属于未验证的新变体，请同时保持相关内容一致。
      ja: この値を変更すると、未検証の別案になります。関連する内容に一貫性を持たせてください。
      de: Eine Änderung dieses Werts erzeugt eine ungetestete Variante. Halte
        zusammengehörige Inhalte konsistent.
    type: string
    default: a small coral desk fan
    minLength: 1
    maxLength: 400
    multiline: false
  - name: gesture
    required: true
    group: subject
    labels:
      en: Use gesture
      zh-Hans: 使用动作
      ja: 使用時の動作
      de: Geste bei der Verwendung
    help:
      en: Changing this value creates an untested variant. Keep related content
        consistent.
      zh-Hans: 修改后属于未验证的新变体，请同时保持相关内容一致。
      ja: この値を変更すると、未検証の別案になります。関連する内容に一貫性を持たせてください。
      de: Eine Änderung dieses Werts erzeugt eine ungetestete Variante. Halte
        zusammengehörige Inhalte konsistent.
    type: string
    default: a hand reaching for it
    minLength: 1
    maxLength: 400
    multiline: false
