fields:
  - name: captions
    required: true
    group: text
    labels:
      en: Nine English captions
      zh-Hans: 九条英文配文
      ja: 9つの英語キャプション
      de: Neun englische Beschriftungen
    help:
      en: Exactly nine short captions in reading order; up to 28 characters each.
      zh-Hans: 按阅读顺序填写九条短句，每条最多 28 个字符。
      ja: 読む順に9つの短いキャプションを入力してください。各28文字以内です。
      de: Genau neun kurze Beschriftungen in Leserichtung; jeweils bis zu 28
        Zeichen.
    type: string-list
    default:
      - Morning.
      - Coffee first.
      - On it.
      - Quick question.
      - You're on mute.
      - Lunch?
      - Still loading.
      - Done!
      - Logging off.
    minItems: 9
    maxItems: 9
    itemMaxLength: 28
    separator: "; "
