fields:
  - name: product
    required: true
    group: subject
    labels:
      en: Product
      zh-Hans: 产品
      ja: 商品
    help:
      en: Changing this value creates an untested variant. Keep related content
        consistent.
      zh-Hans: 修改后属于未验证的新变体，请同时保持相关内容一致。
      ja: この値を変更すると、未検証の別案になります。関連する内容に一貫性を持たせてください。
    type: string
    default: a cobalt glass skincare bottle
    minLength: 1
    maxLength: 400
    multiline: false
  - name: background
    required: true
    group: subject
    labels:
      en: Background
      zh-Hans: 背景
      ja: 背景
    help:
      en: Changing this value creates an untested variant. Keep related content
        consistent.
      zh-Hans: 修改后属于未验证的新变体，请同时保持相关内容一致。
      ja: この値を変更すると、未検証の別案になります。関連する内容に一貫性を持たせてください。
    type: string
    default: a warm ivory-to-sand gradient backdrop
    minLength: 1
    maxLength: 400
    multiline: false
