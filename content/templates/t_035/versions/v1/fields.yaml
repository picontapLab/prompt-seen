fields:
  - name: product
    required: true
    group: subject
    labels:
      en: Product
      zh-Hans: 产品
      ja: 商品
      de: Produkt
      pt-BR: Produto
      es: Producto
    help:
      en: Changing this value creates an untested variant. Keep related content
        consistent.
      zh-Hans: 修改后属于未验证的新变体，请同时保持相关内容一致。
      ja: この値を変更すると、未検証の別案になります。関連する内容に一貫性を持たせてください。
      de: Eine Änderung dieses Werts erzeugt eine ungetestete Variante. Halte
        zusammengehörige Inhalte konsistent.
      pt-BR: Mudar este valor cria uma variante não testada. Mantenha o conteúdo
        relacionado consistente.
      es: Cambiar este valor crea una variante sin probar. Mantén coherente el
        contenido relacionado.
    type: string
    default: a cobalt glass skincare bottle
    minLength: 1
    maxLength: 400
    multiline: false
  - name: background
    required: true
    group: subject
    labels:
      en: Background
      zh-Hans: 背景
      ja: 背景
      de: Hintergrund
      pt-BR: Fundo
      es: Fondo
    help:
      en: Changing this value creates an untested variant. Keep related content
        consistent.
      zh-Hans: 修改后属于未验证的新变体，请同时保持相关内容一致。
      ja: この値を変更すると、未検証の別案になります。関連する内容に一貫性を持たせてください。
      de: Eine Änderung dieses Werts erzeugt eine ungetestete Variante. Halte
        zusammengehörige Inhalte konsistent.
      pt-BR: Alterar este valor cria uma variante não testada. Mantenha o conteúdo
        relacionado consistente.
      es: Cambiar este valor crea una variante sin probar. Mantén coherente el
        contenido relacionado.
    type: string
    default: a warm ivory-to-sand gradient backdrop
    minLength: 1
    maxLength: 400
    multiline: false
