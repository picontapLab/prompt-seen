fields:
  - name: age
    required: true
    group: text
    labels:
      en: Birthday age
      zh-Hans: 生日年龄
      ja: 誕生日の年齢
      de: Geburtstagsalter
      es: Edad de cumpleaños
      ko: 생일 나이
    help:
      en: Use a short age such as 30.
      zh-Hans: 填写简短年龄，例如 30。
      ja: 30など、短い年齢表記を入力してください。
      de: Verwende eine kurze Altersangabe wie 30.
      es: Usa una edad breve, como 30.
      ko: 나이는 30처럼 짧게 입력하세요.
    type: string
    default: "30"
    minLength: 1
    maxLength: 3
    multiline: false
  - name: personName
    required: true
    group: text
    labels:
      en: Name
      zh-Hans: 姓名
      ja: 名前
      de: Name
      es: Nombre
      ko: 이름
    help:
      en: Use a short display name.
      zh-Hans: 填写简短显示姓名。
      ja: 短い表示名を入力してください。
      de: Verwende einen kurzen Anzeigenamen.
      es: Usa un nombre corto para mostrar.
      ko: 짧은 표시 이름을 사용하세요.
    type: string
    default: ALEX
    minLength: 1
    maxLength: 16
    multiline: false
