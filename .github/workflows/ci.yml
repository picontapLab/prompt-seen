# PR and main-branch checks (design doc §15.1, §17.3 step 1a).
# - check: lint, format, types, content validation, colour contrast of the tokens, unit tests,
#   and the Storybook build.
# - secrets: gitleaks over the branch's history (§15.5.4).
# - build: one root production artifact and one /prompt-seen preview artifact.
# - build-and-test: those artifacts served by reference nginx and tested with Playwright
#   in Chromium, Firefox and WebKit on separate runners.
# - preview: uploads the tested /prompt-seen preview build to Cloudflare Pages (noindex). It is
#   skipped until the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets exist.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24
  BUILD_ID: ${{ github.sha }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run content:validate
      - name: Localization coverage
        if: always()
        run: |
          mkdir -p .artifacts/localization
          npm run --silent locale:check -- --all --json > .artifacts/localization/report.json
      - name: Save reports by locale
        if: always()
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const file = '.artifacts/localization/report.json';
          if (fs.existsSync(file) && fs.statSync(file).size) {
            for (const report of JSON.parse(fs.readFileSync(file, 'utf8')).reports) {
              fs.mkdirSync(`.artifacts/localization/${report.locale}`, { recursive: true });
              fs.writeFileSync(`.artifacts/localization/${report.locale}/report.json`, JSON.stringify(report, null, 2));
            }
          }
          JS
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: localization-coverage
          path: .artifacts/localization/**/report.json
      - run: npm run tokens:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Storybook builds (component state samples, §11.1.7)
        run: npm run storybook:build

  # Committed secrets (design doc §15.5.4): every commit of the branch, with gitleaks' rules.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan the history for secrets (gitleaks)
        run: docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner --verbose

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root
            base_path: ''
            build_mode: production
          - name: subpath
            base_path: /prompt-seen
            build_mode: preview
    name: build (${{ matrix.name }})
    env:
      BASE_PATH: ${{ matrix.base_path }}
      BUILD_MODE: ${{ matrix.build_mode }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # Preserve the build's test models and host configuration as well as its public files.
      # A tar keeps hidden generated files and permissions intact during artifact transfer.
      - name: Package the build and its test inputs
        run: tar -cf build.tar dist .generated public/generated deploy/generated src/config/generated
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.name }}
          path: build.tar
          compression-level: 1
          retention-days: 7
          if-no-files-found: error

  build-and-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.browser == 'webkit' && 55 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        name: [root, subpath]
        browser: [chromium, firefox, webkit]
    # One isolated runner per browser; HTTP checks run once per artifact, with Chromium.
    name: build-and-test (${{ matrix.name }}, ${{ matrix.browser }})
    env:
      PW_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: build-${{ matrix.name }}
      - name: Restore the exact build and its test inputs
        run: tar -xf build.tar && rm build.tar
      - name: Install Playwright browsers
        # Playwright 1.65 fixes WebKit process retention, but its Firefox 159 crashes with
        # SIGSEGV when closing the menu after an axe audit. Keep the complete Firefox suite
        # on the validated 1.64.1 runtime until that browser regression is fixed.
        if: matrix.browser != 'firefox'
        run: npx playwright install --with-deps "${{ matrix.browser }}"
      - name: Install the validated Firefox runtime and browser
        if: matrix.browser == 'firefox'
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @playwright/test@1.64.1
          npx playwright install --with-deps firefox
      - name: Disk space before the tests
        run: df -h .
      - name: End-to-end tests through the reference nginx
        run: |
          if [ "$PW_BROWSERS" = chromium ]; then
            npm run test:e2e
          else
            npm run test:e2e -- --project="$PW_BROWSERS"
          fi
      # Traces are recorded only for retries (playwright.config.ts): recording every test filled
      # the disk once. The free space left shows how close a run came, and the largest
      # directories what took it.
      - name: Disk space after the tests
        if: always()
        run: |
          df -h .
          du -sh test-results || true
          sudo du -xh --max-depth=2 /tmp "$HOME" /var/lib/docker "$PWD" 2>/dev/null | sort -h | tail -15 || true
      # Failed attempts of flaky tests too (their screenshots and error context; retries' traces).
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-${{ matrix.name }}-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - name: Keep the tested preview build for deployment
        if: matrix.name == 'subpath' && matrix.browser == 'chromium'
        run: npm run deploy:cloudflare:prepare
        env:
          BASE_PATH: /prompt-seen
          BUILD_MODE: preview
      - name: Smoke-test the prepared preview artifact
        if: matrix.name == 'subpath' && matrix.browser == 'chromium'
        run: npm run test:deploy
      - uses: actions/upload-artifact@v7
        if: matrix.name == 'subpath' && matrix.browser == 'chromium'
        with:
          name: cloudflare-preview
          path: .deploy/cloudflare/
          include-hidden-files: true
          retention-days: 7

  preview:
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [check, secrets, build-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Cloudflare secrets missing
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::PR preview skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable it."
      - uses: actions/download-artifact@v8
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          name: cloudflare-preview
          path: .deploy/cloudflare
      - name: Deploy preview to Cloudflare Pages
        if: env.HAS_CLOUDFLARE == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .deploy/cloudflare --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'prompt-seen' }} --branch=${{ github.head_ref }} --commit-hash=${{ github.event.pull_request.head.sha }}
      - name: Preview address
        if: env.HAS_CLOUDFLARE == 'true'
        run: echo "Preview (noindex) at ${{ steps.deploy.outputs.deployment-url }}/prompt-seen/" >> "$GITHUB_STEP_SUMMARY"
