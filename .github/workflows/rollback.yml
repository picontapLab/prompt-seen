# Production rollback (design doc §15.3, §17.3 step 5). Puts an earlier successful Cloudflare
# Pages production deployment back in place without rebuilding, then checks the canonical site
# serves it. Pages keeps every deployment and image keys are never reused (§10.4), so pages and
# images return together. Afterwards revert the commit on main as well, or the next deploy
# brings the change back. Same secrets and variables as the Deploy workflow.
name: Rollback

on:
  workflow_dispatch:
    inputs:
      to:
        description: Deployment ID or commit (at least 7 characters); empty = the deployment before the live one
        required: false
        default: ''

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'prompt-seen' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Production configuration
        env:
          V_ORIGIN: ${{ vars.SITE_ORIGIN }}
          V_BASE_PATH: ${{ vars.BASE_PATH }}
        run: |
          {
            echo "BUILD_MODE=production"
            echo "SITE_ORIGIN=$V_ORIGIN"
            if [ "$V_BASE_PATH" = "/" ]; then echo "BASE_PATH="; elif [ -n "$V_BASE_PATH" ]; then echo "BASE_PATH=$V_BASE_PATH"; fi
          } >> "$GITHUB_ENV"
      - name: Production deployments
        run: npm run deploy:rollback -- --list
      - name: Roll back
        id: rollback
        env:
          TO: ${{ inputs.to }}
        run: npm run deploy:rollback -- --yes ${TO:+--to "$TO"}
      - name: Check the canonical site serves it
        run: npm run check:live -- --expect-build "${{ steps.rollback.outputs.commit }}" --wait 180
