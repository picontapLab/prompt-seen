# Production deploy to Cloudflare Pages (design doc §15.2, §17.3 step 5). Runs after CI passes on
# main, or by hand for a chosen commit. Builds the commit in production mode with the instance's
# settings, makes sure every image is on the CDN, deploys, checks the platform address and the
# canonical site, then tells IndexNow what changed. Rolling back: the Rollback workflow.
#
# Skipped with a notice until the production settings exist (docs/operations.md):
#   secrets  CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#            INDEXNOW_KEY (optional), S3_ENDPOINT, S3_BUCKET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY (optional)
#            PRODUCTION_DEPLOY_HOOK (optional private artifact customization, production environment only)
#   vars     SITE_ORIGIN (the canonical host, e.g. https://xxx.com)
#            BASE_PATH (optional; "/" for a root deployment; default: content/site.yaml)
#            MEDIA_BASE_URL (optional; the CDN of the bucket), CLOUDFLARE_PAGES_PROJECT (default prompt-seen)
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag or branch at current main HEAD with passing CI (use Rollback for older releases)
        required: true
        default: main

# One production change at a time, never cancelled half-way.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      actions: read
      deployments: write
    env:
      NODE_VERSION: 24
      READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && vars.SITE_ORIGIN != '' }}
      PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'prompt-seen' }}
      HAS_S3: ${{ secrets.S3_ACCESS_KEY_ID != '' && secrets.S3_SECRET_ACCESS_KEY != '' }}
    steps:
      - name: Production settings missing
        if: env.READY != 'true'
        run: echo "::notice::Production deploy skipped. Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets and the SITE_ORIGIN variable (docs/operations.md)."
      - uses: actions/checkout@v7
        if: env.READY == 'true'
        with:
          # The gate always comes from trusted main, never from the requested candidate.
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: env.READY == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Preserve the trusted release gate
        if: env.READY == 'true'
        run: cp scripts/deploy-gate.ts "$RUNNER_TEMP/deploy-gate.ts"
      - name: Resolve and verify the candidate before executing its code
        if: env.READY == 'true'
        id: release
        run: node "$RUNNER_TEMP/deploy-gate.ts"
        env:
          CANDIDATE_REF: ${{ github.event.workflow_run.head_sha || inputs.ref }}
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check out the verified immutable commit
        if: env.READY == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false
      - if: env.READY == 'true'
        run: npm ci
      - name: Production configuration
        if: env.READY == 'true'
        env:
          V_ORIGIN: ${{ vars.SITE_ORIGIN }}
          V_BASE_PATH: ${{ vars.BASE_PATH }}
          V_MEDIA: ${{ vars.MEDIA_BASE_URL }}
        run: |
          {
            echo "BUILD_MODE=production"
            echo "BUILD_ID=$(git rev-parse HEAD)"
            echo "SITE_ORIGIN=$V_ORIGIN"
            if [ "$V_BASE_PATH" = "/" ]; then echo "BASE_PATH="; elif [ -n "$V_BASE_PATH" ]; then echo "BASE_PATH=$V_BASE_PATH"; fi
            if [ -n "$V_MEDIA" ]; then echo "MEDIA_BASE_URL=$V_MEDIA"; fi
          } >> "$GITHUB_ENV"
      - name: Upload images to object storage
        if: env.READY == 'true' && vars.MEDIA_BASE_URL != '' && env.HAS_S3 == 'true'
        run: npm run media:sync
        env:
          MEDIA_STORAGE: s3
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      - name: Build
        if: env.READY == 'true'
        run: npm run build
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      - name: Every image the build references is on the CDN
        if: env.READY == 'true'
        run: npm run media:check
      - name: Live addresses before the deploy (IndexNow)
        if: env.READY == 'true'
        run: npm run indexnow -- snapshot --out .deploy/urls-before.json
      - name: Restore the previous production file count
        if: env.READY == 'true'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/pages-production-count
          key: pages-production-count-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pages-production-count-
      - name: Prepare production artifact and apply private customization
        if: env.READY == 'true'
        run: npm run deploy:cloudflare:prepare
        env:
          PRODUCTION_DEPLOY_HOOK: ${{ secrets.PRODUCTION_DEPLOY_HOOK }}
          PAGES_COUNT_HISTORY: ${{ runner.temp }}/pages-production-count
      - name: Install the smoke-test browser
        if: env.READY == 'true'
        run: npx playwright install --with-deps chromium
      - name: Smoke-test the final upload directory
        if: env.READY == 'true'
        run: npm run test:deploy
        env:
          EXPECT_DEPLOY_INTEGRATION: ${{ secrets.PRODUCTION_DEPLOY_HOOK != '' && 'true' || 'false' }}
      # Recheck after building and smoking: main may have advanced while this job held the lock.
      - name: Revalidate the pinned candidate immediately before upload
        if: env.READY == 'true'
        run: node "$RUNNER_TEMP/deploy-gate.ts"
        env:
          CANDIDATE_REF: ${{ steps.release.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Cloudflare Pages
        if: env.READY == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .deploy/cloudflare --project-name=${{ env.PROJECT }} --branch=main --commit-hash=${{ env.BUILD_ID }}
      - name: Check the platform address (noindex, statuses, content)
        if: env.READY == 'true'
        shell: bash
        env:
          PAGES_DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          mkdir -p .artifacts/release
          printf '%s\n' "$PAGES_DEPLOYMENT_URL" > .artifacts/release/pages-url.txt
          npm run check:live -- --site "$PAGES_DEPLOYMENT_URL" --platform --expect-build "$BUILD_ID" | tee .artifacts/release/pages.log
      - name: Check the canonical site
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        # The host may cache for a moment: wait up to three minutes for this build, then check.
        shell: bash
        run: |
          mkdir -p .artifacts/release
          npm run check:live -- --expect-build "$BUILD_ID" --wait 180 --release-record .artifacts/release/canonical.json | tee .artifacts/release/canonical.log
      - name: Verify the bilingual SEO and GEO release targets
        if: env.READY == 'true'
        shell: bash
        env:
          PW_BROWSERS: ''
          PW_TARGET_ORIGIN: ${{ env.SITE_ORIGIN }}
        run: |
          npm run test:e2e -- --project=http home.http.spec.ts seo.http.spec.ts --grep '@release' --reporter=list --trace=off --timeout=120000 | tee .artifacts/release/public-http.log
      - name: Archive public release verification
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-verification-${{ env.BUILD_ID }}
          path: .artifacts/release/
          include-hidden-files: true
          if-no-files-found: error
      - name: Tell IndexNow what changed
        if: env.READY == 'true'
        run: npm run indexnow -- submit --before .deploy/urls-before.json
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      - name: Summary
        if: env.READY == 'true'
        run: |
          echo "Deployed \`$BUILD_ID\` to $SITE_ORIGIN (this deployment on Pages: ${{ steps.deploy.outputs.deployment-url }})." >> "$GITHUB_STEP_SUMMARY"
          observed_at=$(node -p 'require("./.artifacts/release/canonical.json").canonicalFirstObservedAt')
          echo "First observed at the canonical origin: $observed_at (UTC)." >> "$GITHUB_STEP_SUMMARY"
          echo "To undo it, run the Rollback workflow." >> "$GITHUB_STEP_SUMMARY"
