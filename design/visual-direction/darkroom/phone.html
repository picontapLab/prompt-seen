<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A · Darkroom · Phone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.t-dark{--bg:#121110;--film:#0B0A09;--hole:#2A2724;--text:#EEEAE3;--text2:#A8A196;--line:#2E2B27;--mark:#FFB547;--markText:#1A1206;--markSoft:#46351C;--btn:#EEEAE3;--btnText:#121110}
.t-light{--bg:#EDECE8;--film:#1A1917;--hole:#EDECE8;--text:#151413;--text2:#57534D;--line:#CBC8C2;--mark:#9A4D00;--markText:#FFFFFF;--markSoft:#F5D7A1;--btn:#151413;--btnText:#F6F5F2}
</style>
</head>
<body>
<div class="t-light" style="width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="height: 56px; padding: 0 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); flex: none">
    <span aria-hidden="true" style="width: 22px; height: 15px; background: var(--text); border-radius: 2px; position: relative; display: inline-block"><span style="position: absolute; left: 4px; top: 3px; width: 14px; height: 9px; background: var(--bg)"></span></span>
    <span style="font-family: 'Fira Sans Extra Condensed', sans-serif; font-weight: 700; font-size: 21px; letter-spacing: 0.04em">PROMPT SEEN</span>
    <button type="button" aria-label="Search" style="margin-left: auto; width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" style="stroke: var(--text)" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></button>
    <button type="button" aria-label="Menu" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" style="stroke: var(--text)" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"></path></svg></button>
  </header>
  <div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="background: var(--film)">
      <div aria-hidden="true" style="display: flex; justify-content: space-between; padding: 6px 10px">
        <span style="width: 12px; height: 8px; border-radius: 2px; background: var(--hole)"></span><span style="width: 12px; height: 8px; border-radius: 2px; background: var(--hole)"></span><span style="width: 12px; height: 8px; border-radius: 2px; background: var(--hole)"></span><span style="width: 12px; height: 8px; border-radius: 2px; background: var(--hole)"></span><span style="width: 12px; height: 8px; border-radius: 2px; background: var(--hole)"></span><span style="width: 12px; height: 8px; border-radius: 2px; background: var(--hole)"></span><span style="width: 12px; height: 8px; border-radius: 2px; background: var(--hole)"></span><span style="width: 12px; height: 8px; border-radius: 2px; background: var(--hole)"></span><span style="width: 12px; height: 8px; border-radius: 2px; background: var(--hole)"></span><span style="width: 12px; height: 8px; border-radius: 2px; background: var(--hole)"></span><span style="width: 12px; height: 8px; border-radius: 2px; background: var(--hole)"></span><span style="width: 12px; height: 8px; border-radius: 2px; background: var(--hole)"></span>
      </div>
      <div style="display: flex; justify-content: center; padding: 2px 0">
        <div style="position: relative; width: 300px; height: 375px">
          <img src="../images/neon-portrait.jpg" alt="Silhouette in profile with cyan and magenta rim light" style="width: 300px; height: 375px; display: block">
          <div style="position: absolute; left: 51%; top: 27%; width: 23%; height: 66%; outline: 2px solid #FFB547; box-shadow: 0 0 0 3px rgba(26,18,6,0.85)"><span style="position: absolute; left: -6px; top: -6px; width: 12px; height: 12px; border-left: 2px solid #FFB547; border-top: 2px solid #FFB547"></span><span style="position: absolute; right: -6px; top: -6px; width: 12px; height: 12px; border-right: 2px solid #FFB547; border-top: 2px solid #FFB547"></span><span style="position: absolute; left: -6px; bottom: -6px; width: 12px; height: 12px; border-left: 2px solid #FFB547; border-bottom: 2px solid #FFB547"></span><span style="position: absolute; right: -6px; bottom: -6px; width: 12px; height: 12px; border-right: 2px solid #FFB547; border-bottom: 2px solid #FFB547"></span></div><span style="position: absolute; left: calc(51% - 30px); top: 27%; width: 22px; height: 22px; box-sizing: border-box; background: #FFB547; color: #1A1206; box-shadow: 0 0 0 1px rgba(26,18,6,0.85); font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; display: flex; align-items: center; justify-content: center">B</span>
        </div>
      </div>
      <div aria-hidden="true" style="display: flex; justify-content: space-between; padding: 6px 10px">
        <span style="width: 12px; height: 8px; border-radius: 2px; background: var(--hole)"></span><span style="width: 12px; height: 8px; border-radius: 2px; background: var(--hole)"></span><span style="width: 12px; height: 8px; border-radius: 2px; background: var(--hole)"></span><span style="width: 12px; height: 8px; border-radius: 2px; background: var(--hole)"></span><span style="width: 12px; height: 8px; border-radius: 2px; background: var(--hole)"></span><span style="width: 12px; height: 8px; border-radius: 2px; background: var(--hole)"></span><span style="width: 12px; height: 8px; border-radius: 2px; background: var(--hole)"></span><span style="width: 12px; height: 8px; border-radius: 2px; background: var(--hole)"></span><span style="width: 12px; height: 8px; border-radius: 2px; background: var(--hole)"></span><span style="width: 12px; height: 8px; border-radius: 2px; background: var(--hole)"></span><span style="width: 12px; height: 8px; border-radius: 2px; background: var(--hole)"></span><span style="width: 12px; height: 8px; border-radius: 2px; background: var(--hole)"></span>
      </div>
    </div>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text2)"><span style="color: var(--mark)">FRAME 0127</span> · Model A · 1 Oct 2026 · 4:5</span>
    <h1 style="margin: 0; font-family: 'Fira Sans Extra Condensed', sans-serif; font-weight: 700; font-size: 44px; line-height: 0.95">See what every phrase does.</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.6">Portrait in dark silhouette, head and shoulders in profile. <span style="border-bottom: 2px dashed var(--mark)">Cyan rim light on the left edge</span><sup style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 500; color: var(--mark); border: 1px solid var(--mark); padding: 0 4px; margin-left: 3px">A</sup> and <span style="background: var(--markSoft); padding: 1px 3px">magenta rim light on the right edge</span><sup style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 500; background: var(--mark); color: var(--markText); padding: 1px 5px; margin-left: 3px">B</sup>…</p>
    <button type="button" style="height: 52px; border: 0; border-radius: 2px; background: var(--btn); color: var(--btnText); font-family: 'IBM Plex Sans', sans-serif; font-size: 16px; font-weight: 600; cursor: pointer">Copy prompt</button>
  </div>
</div>
<script>
/* Theme for review: ?theme=light|dark, or the theme button. */
(function () {
  var root = document.querySelector('.t-dark, .t-light');
  if (!root) return;
  var p = new URLSearchParams(location.search).get('theme');
  if (p === 'light' || p === 'dark') { root.classList.remove('t-dark', 't-light'); root.classList.add('t-' + p); }
  document.querySelectorAll('[aria-label="Switch theme"]').forEach(function (b) {
    b.addEventListener('click', function () {
      var dark = root.classList.contains('t-dark');
      root.classList.toggle('t-dark', !dark); root.classList.toggle('t-light', dark);
    });
  });
})();
</script>
</body>
</html>
