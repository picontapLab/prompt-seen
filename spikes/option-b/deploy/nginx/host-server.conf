# Stand-in for the HOST site's server block (hand-written, not generated).
# The host only needs: a root that contains prompt-seen/, absolute_redirect off,
# and one include of the generated file.
server {
    listen 80;
    server_name _;

    # Behind Docker port mapping / a CDN the internal port differs from the
    # public one; relative Location headers avoid leaking :80.
    absolute_redirect off;

    root /srv/dist;

    location = / {
        default_type text/plain;
        return 200 "host site root\n";
    }

    include /etc/nginx/prompt-seen/prompt-seen.locations.conf;
}
